<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>해피트리 파닉스</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<style>
/* 해피트리 파닉스 Lv1 — 유치부·초1. 글자는 Andika(아이 손글씨와 같은 한 층짜리 a). */
:root{
  --navy:#1f3a5f; --gold:#f2a900; --cream:#fff8e7; --leaf:#4caf50; --leaf2:#2e7d32;
  --red:#e53935; --yellow:#fbc02d; --green:#43a047; --sky:#e3f2fd; --ink:#263238;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);
  font-family:'Jua','Malgun Gothic',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;border:0;cursor:pointer}
.en{font-family:'Andika','Arial Rounded MT Bold',Arial,sans-serif}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--navy);color:#fff}
header .home{background:rgba(255,255,255,.15);color:#fff;font-size:22px;width:46px;height:46px;border-radius:14px}
header .title{font-size:20px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .fruit{background:#fff;color:var(--navy);border-radius:999px;padding:6px 14px;font-size:20px}
.dots{display:flex;gap:4px;padding:8px 16px 0;justify-content:center;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:#e0d6bd}
.dots i.done{background:var(--gold)} .dots i.now{background:var(--navy);transform:scale(1.3)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 16px 20px;
  overflow-y:auto;position:relative}
.guide{font-size:24px;color:var(--navy);text-align:center;margin:0 0 14px;line-height:1.35}
.guide small{display:block;font-size:17px;color:#7a6f57;margin-top:4px}
.big{font-size:min(42vw,260px);line-height:1;color:var(--navy);font-weight:700}
.big b{color:var(--gold)}
.btn{background:var(--gold);color:var(--navy);font-size:24px;padding:14px 32px;border-radius:999px;
  box-shadow:0 5px 0 #c98c00;margin-top:14px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c98c00}
.btn.ghost{background:#fff;box-shadow:0 5px 0 #d8ccb0}
.row{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.spk{width:84px;height:84px;border-radius:50%;background:var(--navy);color:#fff;font-size:38px;
  box-shadow:0 5px 0 #0f2238}
.spk:active{transform:translateY(4px);box-shadow:none}
.spk.play{animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.mic{width:110px;height:110px;border-radius:50%;background:var(--red);color:#fff;font-size:50px;position:relative;
  box-shadow:0 6px 0 #a31c19}
.mic:disabled{opacity:.45}
.mic.on{background:#fff;color:var(--red);box-shadow:0 0 0 0 rgba(229,57,53,.6);animation:ring 1s infinite}
@keyframes ring{to{box-shadow:0 0 0 22px rgba(229,57,53,0)}}
.mic .lv{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);height:8px;border-radius:4px;background:var(--leaf);width:0;transition:width .08s}
.card{background:#fff;border-radius:28px;padding:18px 22px;box-shadow:0 6px 0 #e7dcc2;text-align:center}
.emoji{font-size:min(28vw,150px);line-height:1.1}
.word{font-size:min(14vw,72px);color:var(--navy)}
.word b{color:var(--gold)}
.ko{font-size:22px;color:#8a7d60}
.stars{font-size:44px;letter-spacing:4px;min-height:54px}
.msg{font-size:22px;min-height:30px;text-align:center;margin-top:8px}
.light{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 14px;font-size:20px}
.light i{width:22px;height:22px;border-radius:50%;display:inline-block}
.mine{display:flex;gap:10px;margin-top:10px}
.mine button{background:#fff;border-radius:16px;padding:10px 16px;font-size:20px;box-shadow:0 4px 0 #e2d6bb}
.hide{display:none!important}
/* 따라쓰기 */
.trace-wrap{position:relative;touch-action:none}
canvas.trace{background:#fff;border-radius:24px;box-shadow:0 6px 0 #e7dcc2;touch-action:none;display:block}
.meter{width:min(80vw,420px);height:16px;background:#eee3c8;border-radius:8px;overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;width:0;background:var(--leaf);transition:width .2s}
/* 버블 */
.pond{position:relative;width:min(94vw,820px);height:min(56vh,460px);background:linear-gradient(#bfe6ff,#e9f7ff);
  border-radius:28px;overflow:hidden;box-shadow:inset 0 0 0 4px #fff}
.bub{position:absolute;width:96px;height:96px;border-radius:50%;font-size:54px;color:var(--navy);font-weight:700;
  background:radial-gradient(circle at 32% 30%,#fff 0 12%,rgba(255,255,255,.55) 13% 40%,rgba(160,215,255,.55) 70%,rgba(110,180,255,.7));
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.bub.pop{animation:pop .3s forwards}
@keyframes pop{to{transform:scale(1.6);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
/* 낚시 */
.sea{display:flex;gap:18px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.fish{--c:#ff8a65;--d:#d6623f;width:150px;height:96px;background:var(--c);border-radius:60% 40% 40% 60%/50%;position:relative;font-size:52px;color:#fff;font-weight:700;
  box-shadow:0 5px 0 var(--d);animation:swim 2s ease-in-out infinite alternate;margin-right:26px}
.fish:nth-child(2){--c:#4fc3f7;--d:#2a96c7;animation-delay:.4s}
.fish:nth-child(3){--c:#9575cd;--d:#6a4ea8;animation-delay:.8s}
.fish:after{content:'';position:absolute;right:-26px;top:22px;border:26px solid transparent;border-left:30px solid var(--c);border-right:0}
.fish:before{content:'';position:absolute;left:22px;top:22px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:inset 3px 0 0 #222}
@keyframes swim{to{transform:translateY(-12px)}}
/* 짝맞추기 */
.grid{display:grid;grid-template-columns:repeat(3,min(26vw,140px));gap:14px;justify-content:center}
.mem{height:min(26vw,140px);border-radius:22px;background:var(--leaf);color:#fff;font-size:64px;font-weight:700;
  box-shadow:0 6px 0 var(--leaf2);transition:transform .25s}
.mem.open{background:#fff;color:var(--navy);box-shadow:0 6px 0 #e2d6bb}
.mem.got{background:#fff3c4;color:var(--gold);box-shadow:0 6px 0 #e9cf72}
/* 지도·나무 */
.map{display:flex;flex-direction:column;gap:12px;width:min(94vw,640px)}
.lane{background:#fff;border-radius:22px;padding:12px 14px;box-shadow:0 5px 0 #e7dcc2;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lane .lt{font-size:44px;width:64px;text-align:center;color:var(--navy);font-weight:700}
.node{width:64px;height:64px;border-radius:18px;background:#f1e8d2;font-size:30px;position:relative}
.node.done{background:#fff3c4;box-shadow:inset 0 0 0 3px var(--gold)}
.node.next{background:var(--gold);animation:pulse .7s infinite alternate}
.node span{position:absolute;left:0;right:0;bottom:-20px;font-size:13px;color:#8a7d60}
.tree{position:relative;width:min(80vw,340px);height:min(80vw,340px)}
.tree .crown{position:absolute;left:5%;right:5%;top:0;height:72%;background:var(--leaf);border-radius:50%;box-shadow:inset -18px -18px 0 var(--leaf2)}
.tree .trunk{position:absolute;left:43%;width:14%;bottom:0;height:34%;background:#8d6e63;border-radius:8px}
.tree .ap{position:absolute;font-size:30px;animation:drop .5s backwards}
@keyframes drop{from{transform:translateY(-40px);opacity:0}}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:min(30vw,170px);pointer-events:none;animation:yay 1s forwards;z-index:9}
@keyframes yay{0%{transform:translate(-50%,-50%) scale(.2)}40%{transform:translate(-50%,-50%) scale(1.15)}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.qc{background:#fff;border-radius:22px;min-width:120px;height:110px;font-size:64px;color:var(--navy);font-weight:700;box-shadow:0 5px 0 #e2d6bb;padding:0 18px}
.chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;width:100%;max-width:820px;margin:8px 0}
.cc{background:#fff;border-radius:12px;padding:8px 6px;display:flex;align-items:baseline;gap:6px;box-shadow:0 3px 0 #e7dcc2;transition:transform .15s}
.cc b{font-size:26px;color:var(--navy)} .cc span{font-size:18px;color:#5b5140}
.cc.now{background:var(--gold);transform:scale(1.12);box-shadow:0 0 0 4px #fff3c4} .cc.now b,.cc.now span{color:#fff}
.cc.done{background:#eef7ee}
.seg2{display:flex;gap:8px;margin-bottom:6px}
.seg2 button{background:#fff;border-radius:999px;padding:8px 16px;font-size:18px;box-shadow:0 3px 0 #e2d6bb}
.seg2 button.on{background:var(--navy);color:#fff}
@media (max-width:560px){ .chart{grid-template-columns:repeat(4,minmax(0,1fr))} }
.cards5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;width:100%;max-width:760px;margin-top:4px}
.c5{background:#fff;border-radius:20px;padding:10px 4px 8px;box-shadow:0 5px 0 #e7dcc2;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.c5 .e{font-size:min(11vw,64px);line-height:1.1}
.c5 .w{font-size:min(5.4vw,30px);color:var(--navy);white-space:nowrap}
.c5 .w b{color:var(--gold)}
.c5 .ko{font-size:min(3.6vw,16px);color:#8a7d60}
.c5.play{animation:pulse .6s infinite alternate}
.c5.heard:after{content:'✓';position:absolute;top:4px;right:8px;color:var(--leaf);font-size:20px;font-weight:700}
@media (max-width:560px){ .cards5{grid-template-columns:repeat(3,minmax(0,1fr))} }
.note{font-size:15px;color:#9a8f75;text-align:center;margin-top:16px;max-width:560px}
@media (max-height:620px){ .big{font-size:150px} .emoji{font-size:90px} .mic{width:90px;height:90px;font-size:40px} }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="home" onclick="homeBtn()" aria-label="처음으로">🏠</button>
    <div class="title" id="title">해피트리 파닉스</div>
    <div class="fruit">🍎 <span id="fruits">0</span></div>
  </header>
  <div class="dots" id="dots"></div>
  <main id="stage"></main>
</div>
<script>
'use strict';
// ── 어디서 열렸나 ─────────────────────────────────────────────────
// 트리톡 학생 화면이 iframe 으로 열면 ?aid=과제&sid=학생 → 서버에 기록(제출·녹음·시험).
// 주소만 열면 시연(기기에만 기록, ?day=N 으로 날 고르기).
const QS = new URLSearchParams(location.search);
const AID = QS.get('aid') || '', SID = QS.get('sid') || '', SNAME = QS.get('name') || '';
const EMBED = !!(AID && SID);
let C = null;             // /api/phonics/content
let A = null;             // 이 과제(트리톡)
let LET = [], DAY = 1, STEPS = [], cur = -1;
const NAMES = {review:'복습 소리표', meet:'만나기', parrot:'앵무새', trace:'따라쓰기', words:'단어 말하기', bubble:'소리 버블', fish:'첫소리 낚시', memory:'짝 찾기', quiz:'오늘의 퀴즈'};
const ICON  = {review:'🔁', meet:'👋', parrot:'🦜', trace:'✍️', words:'🎤', bubble:'🫧', fish:'🎣', memory:'🃏', quiz:'🏆'};
const QAREA = {snd:'소리 듣고 글자', pic:'그림 보고 첫소리', case:'큰글자·작은글자', word:'단어 듣고 그림', say:'말하기'};
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem('ht_phonics')||'{}') }catch(e){ return {} } },
  set(v){ try{ localStorage.setItem('ht_phonics', JSON.stringify(v)) }catch(e){} }
};
// S = 이 기기의 시연 기록, 또는 서버 제출의 phonics 칸(EMBED)
let S = {fruits:0, done:{}, takes:{}, parrot:{}, quiz:null};
const $ = q => document.querySelector(q);
const stage = () => $('#stage');
function h(html){ stage().innerHTML = html; return stage() }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a }
const pick = a => a[Math.random()*a.length|0];
function nowStr(){ const d=new Date(); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` }
// 초점 글자 금색: 보통 첫 글자, x 처럼 끝소리 글자는 마지막 그 글자
function hi(w, k){
  if(w[0].toLowerCase()===k) return `<b>${w[0]}</b>${w.slice(1)}`;
  const i = w.toLowerCase().lastIndexOf(k);
  return i<0 ? w : `${w.slice(0,i)}<b>${w[i]}</b>${w.slice(i+1)}`;
}
const startsWith = k => !(C.letters[k].pos==='end');   // 첫소리 문제에 쓸 수 있는 글자

// ── 서버 기록 ──────────────────────────────────────────────────────
let saveT = null, saveErr = '';
function save(extra){
  $('#fruits').textContent = S.fruits;
  if(!EMBED){ store.set({fruits:S.fruits, done:S.done, quiz:S.quizByDay||{}}); return Promise.resolve() }
  clearTimeout(saveT);
  const send = () => fetch(`/api/submission/${encodeURIComponent(AID)}/${encodeURIComponent(SID)}`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(Object.assign({phonics:S}, extra||{}))})
    .then(async r=>{ if(!r.ok){ let m=''; try{ m=(await r.json()).detail }catch(e){} throw new Error(m||('저장 실패 '+r.status)) } saveErr='' })
    .catch(e=>{ saveErr = e.message || '저장 실패'; console.warn(e) });
  if(extra) return send();                 // 제출은 바로
  return new Promise(res=>{ saveT = setTimeout(()=>send().then(res), 600) });
}
async function upload(blob){
  if(!EMBED) return null;
  try{
    const fd = new FormData(); fd.append('audio', blob, 'rec.webm');
    const r = await fetch('/api/audio',{method:'POST',body:fd});
    return r.ok ? (await r.json()).url : null;
  }catch(e){ return null }
}
function leave(){
  if(playing){ try{playing.pause()}catch(e){} }
  if(EMBED && window.parent!==window) window.parent.postMessage('phonics-close', location.origin);
  else go('map');
}

// ── 소리 ───────────────────────────────────────────────────────────
const cache = {};
const audUrl = id => '/api/phonics/audio/'+id+'.mp3?v='+((C&&C.audioVer)||'0');   // 대본이 바뀌면 주소도 바뀌어 옛 소리 캐시를 안 탄다
function aud(id){ if(!cache[id]){ cache[id]=new Audio(audUrl(id)); cache[id].preload='auto' } return cache[id] }
let playing = null;
function play(id, btn){
  return new Promise(res=>{
    if(playing){ try{playing.pause()}catch(e){} }
    const a = aud(id); playing = a; a.currentTime = 0;
    btn && btn.classList.add('play');
    const end = ()=>{ btn && btn.classList.remove('play'); a.onended=a.onerror=null; res() };
    a.onended = end; a.onerror = end;
    a.play().catch(end);
  });
}
// 효과음은 파일 없이 만든다
let AC = null;
function beep(kind){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const notes = kind==='ok' ? [660,880,1175] : kind==='pop' ? [900] : [220,180];
    notes.forEach((f,i)=>{
      const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+i*0.09;
      o.type = kind==='no'?'square':'sine'; o.frequency.value=f;
      g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+.18);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+.2);
    });
  }catch(e){}
}
function cheer(ch){ const d=document.createElement('div'); d.className='toast'; d.textContent=ch||'🍎'; document.body.appendChild(d); setTimeout(()=>d.remove(),1000) }
function fruit(n){ S.fruits += n||1; save(); cheer('🍎') }

// ── 녹음 ───────────────────────────────────────────────────────────
// 한 번 누르면 녹음 시작, 다시 누르거나 시간이 다 되면 끝. 0.7초 안의 두 번째 누름은 무시한다
// (문해숨에서 🎤/⏹ 를 두 번 눌러 1초 만에 죽던 녹음이 12% — reference_natdok_double_tap).
const Rec = {
  stream:null,
  async ensure(){
    if(this.stream) return this.stream;
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('이 기기에서는 녹음을 쓸 수 없어요');
    this.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    return this.stream;
  }
};
function recButton(box, {maxMs=3500, onDone}){
  box.innerHTML = '<button class="mic" aria-label="녹음">🎤<i class="lv"></i></button>';
  const b = box.querySelector('.mic'), lv = b.querySelector('.lv');
  let mr=null, t0=0, timer=null, raf=0, peak=0, an=null, src=null;
  async function start(){
    let stream;
    try{ stream = await Rec.ensure() }catch(e){ onDone({error:'마이크를 켜 주세요 🙏 ('+(e.message||e)+')'}); return }
    try{
      AC = AC || new (window.AudioContext||window.webkitAudioContext)();
      if(AC.state==='suspended') await AC.resume();
      src = AC.createMediaStreamSource(stream); an = AC.createAnalyser(); an.fftSize=512; src.connect(an);
    }catch(e){ an=null }
    const chunks=[]; peak=0;
    mr = new MediaRecorder(stream);
    mr.ondataavailable = e=>{ if(e.data && e.data.size) chunks.push(e.data) };
    mr.onstop = ()=>{
      cancelAnimationFrame(raf); clearTimeout(timer);
      try{ src && src.disconnect() }catch(e){}
      b.classList.remove('on'); b.textContent='🎤'; b.appendChild(lv); lv.style.width='0';
      const ms = Date.now()-t0;
      const blob = new Blob(chunks,{type:mr.mimeType||'audio/webm'});
      mr=null;
      // 아무 소리도 없으면 기록하지 않는다(헛녹음이 '했다'로 세지지 않게)
      if(an && peak < 0.04) { onDone({error:'목소리가 안 들렸어요. 마이크에 대고 크게! 📣'}); return }
      onDone({blob, url:URL.createObjectURL(blob), ms});
    };
    mr.start(); t0=Date.now();
    b.classList.add('on'); b.textContent='⏹'; b.appendChild(lv);
    timer = setTimeout(()=>{ if(mr && mr.state==='recording') mr.stop() }, maxMs);
    const buf = an ? new Uint8Array(an.fftSize) : null;
    (function meter(){
      if(an){ an.getByteTimeDomainData(buf); let m=0; for(const v of buf){ m=Math.max(m,Math.abs(v-128)/128) } peak=Math.max(peak,m); lv.style.width=Math.min(100,m*220)+'%' }
      raf = requestAnimationFrame(meter);
    })();
  }
  b.onclick = ()=>{
    if(playing){ try{playing.pause()}catch(e){} }
    if(!mr) start();
    else if(Date.now()-t0 > 700 && mr.state==='recording') mr.stop();
  };
  return b;
}
async function assess(text, blob){
  const fd = new FormData(); fd.append('text', text); fd.append('audio', blob, 'rec');
  const r = await fetch('/api/phonics/assess',{method:'POST',body:fd});
  if(!r.ok) throw new Error('채점 서버가 바빠요');
  return r.json();
}

// ── 흐름 ───────────────────────────────────────────────────────────
// 복습 소리표(원장 2026-10-30): 알파벳은 '앞날까지 배운 글자'를 매일 먼저 소리 내어 읽고 녹음한다
// (1일차는 없음). 단모음 책부터는 이 목록을 26자 전체로 바꿔 매일 전체 녹음을 한다.
let REVIEW = [];
function build(){
  STEPS = [];
  REVIEW = C.days.filter(d=>d.day < DAY).flatMap(d=>d.letters);
  if(REVIEW.length) STEPS.push({t:'review'});
  LET.forEach(k=>['meet','parrot','trace','words'].forEach(t=>STEPS.push({t,k})));
  ['bubble','fish','memory','quiz'].forEach(t=>STEPS.push({t}));
}
function key(i){ const s=STEPS[i]; return DAY+':'+s.t+(s.k?':'+s.k:'') }
function dots(){
  $('#dots').innerHTML = cur<0 ? '' : STEPS.map((s,i)=>`<i class="${i===cur?'now':S.done[key(i)]?'done':''}"></i>`).join('');
}
let doneLock = false;   // '다음' 을 두 번 눌러 한 칸 건너뛰지 않게
function finish(){ if(doneLock || cur<0) return; doneLock = true; S.done[key(cur)] = 1; save(); cur+1 < STEPS.length ? run(cur+1) : go('end') }
function run(i){
  cur = i; doneLock = false; const s = STEPS[i]; dots();
  $('#title').textContent = (s.k ? s.k.toUpperCase()+s.k+' · ' : s.t==='review' ? '' : '섞어 놀기 · ') + NAMES[s.t];
  ({review, meet, parrot, trace, words, bubble, fish, memory, quiz})[s.t](s.k);
}
function homeBtn(){ cur<0 ? leave() : go('map') }
function go(where){
  if(playing){ try{playing.pause()}catch(e){} }
  cur = -1; dots();
  if(where==='end') return end();
  $('#title').textContent = (A ? A.title : '해피트리 파닉스 · '+DAY+'일차');
  const nextI = STEPS.findIndex((s,i)=>!S.done[key(i)]);
  const node = i => `<button class="node ${S.done[key(i)]?'done':i===nextI?'next':''}" data-i="${i}">${ICON[STEPS[i].t]}<span>${NAMES[STEPS[i].t]}</span></button>`;
  const rv = STEPS.findIndex(s=>s.t==='review');
  let lanes = rv<0 ? '' : `<div class="lane"><div class="lt" style="font-size:26px">복습</div>${node(rv)}
    <span style="font-size:18px;color:#8a7d60">${REVIEW.length}글자 소리 녹음</span></div>`;
  lanes += LET.map(k=>{
    const ids = STEPS.map((s,i)=>s.k===k?i:-1).filter(i=>i>=0);
    return `<div class="lane"><div class="lt en">${k.toUpperCase()}${k}</div>${ids.map(node).join('')}</div>`;
  }).join('');
  const mix = STEPS.map((s,i)=>s.k||s.t==='review'?-1:i).filter(i=>i>=0);
  lanes += `<div class="lane"><div class="lt" style="font-size:26px">섞어<br>놀기</div>${mix.map(node).join('')}</div>`;
  h(`<p class="guide">${SNAME?SNAME+', ':''}오늘은 <span class="en" style="font-size:32px">${LET.map(k=>k.toUpperCase()).join(' · ')}</span> 를 만나요!<small>반짝이는 칸을 눌러요</small></p>
     <div class="map">${lanes}</div>
     <div class="row">
       ${nextI<0?'<button class="btn" onclick="go(\'end\')">🌳 내 나무 보기</button>':''}
       ${EMBED?'<button class="btn ghost" onclick="openReport()">📊 내 성적표</button><button class="btn ghost" onclick="leave()">↩ 나가기</button>'
              :'<button class="btn ghost" style="font-size:16px;padding:8px 18px" onclick="if(confirm(\'처음부터 다시 할까요? (열매도 0개로)\')){S={fruits:0,done:{},takes:{},parrot:{},quiz:null};save();go(\'map\')}">처음부터 다시</button>'}
     </div>`);
  stage().querySelectorAll('.node').forEach(b=>b.onclick=()=>run(+b.dataset.i));
}
function openReport(){ location.href = `/phonics-report.html?sid=${encodeURIComponent(SID)}&back=${encodeURIComponent(location.pathname+location.search)}` }

// ── 0. 복습 소리표 ── 표의 칸에 차례로 불이 켜지고 그 소리를 낸다. 처음부터 끝까지 한 번에 녹음.
//    🦜 따라 읽기 = 선생님 소리 → 아이가 따라(기본) / 🙋 혼자 읽기 = 불만 켜지고 아이 혼자.
//    소리 하나는 채점할 수 없어(Azure) 점수 없이 녹음만 남기고, 선생님이 성적표에서 듣는다.
function review(){
  const ks = REVIEW;
  let mode = 'echo', busy = false;
  h(`<p class="guide">🔁 배운 소리 다 같이 읽어요<small id="rg">🎤 시작을 누르면 녹음이 시작돼요</small></p>
     <div class="seg2"><button data-m="echo" class="on">🦜 따라 읽기</button><button data-m="solo">🙋 혼자 읽기</button></div>
     <div class="chart">${ks.map(k=>`<div class="cc" data-k="${k}"><b class="en">${k.toUpperCase()}</b><span>${C.letters[k].ko}</span></div>`).join('')}</div>
     <div class="row"><button class="btn" id="go">🎤 시작</button></div>
     <div class="msg" id="msg"></div>
     <div class="mine hide" id="mine"><button id="me">🙋 내 녹음 듣기</button><button id="again">🔁 다시 하기</button></div>
     <button class="btn hide" id="nx">다음 ▶</button>`);
  stage().querySelectorAll('.seg2 button').forEach(b=>b.onclick=()=>{ if(busy) return;
    mode = b.dataset.m; stage().querySelectorAll('.seg2 button').forEach(x=>x.classList.toggle('on', x===b)) });
  const cells = [...stage().querySelectorAll('.cc')];
  const wait = ms => new Promise(r=>setTimeout(r, ms));
  let mine = null;
  async function start(){
    if(busy) return; busy = true;
    $('#go').classList.add('hide'); $('#mine').classList.add('hide'); $('#msg').textContent = '';
    let stream;
    try{ stream = await Rec.ensure() }catch(e){ $('#msg').textContent = '마이크를 켜 주세요 🙏'; busy=false; $('#go').classList.remove('hide'); return }
    const chunks = []; const mr = new MediaRecorder(stream);
    mr.ondataavailable = e=>{ if(e.data && e.data.size) chunks.push(e.data) };
    const stopped = new Promise(r=>{ mr.onstop = r });
    mr.start(); const t0 = Date.now();
    $('#rg').textContent = mode==='echo' ? '🦜 선생님 소리 다음에 따라 말해요' : '🙋 불이 켜진 글자 소리를 말해요';
    cells.forEach(c=>c.classList.remove('done','now'));
    await wait(600);
    for(const c of cells){
      c.classList.add('now'); c.scrollIntoView({block:'nearest', behavior:'smooth'});
      if(mode==='echo'){ await play('snd-'+c.dataset.k); await wait(1500) }
      else await wait(1900);
      c.classList.remove('now'); c.classList.add('done');
    }
    await wait(500); mr.stop(); await stopped;
    const blob = new Blob(chunks, {type: mr.mimeType || 'audio/webm'});
    mine = new Audio(URL.createObjectURL(blob));
    $('#rg').textContent = '다 읽었어요! 👏'; $('#msg').textContent = '저장하는 중…';
    const url = await upload(blob);
    S.chart = {url, at: nowStr(), n: ks.length, mode, sec: Math.round((Date.now()-t0)/1000)};
    $('#msg').textContent = EMBED && !url ? '⚠ 녹음 저장이 안 됐어요. 다시 해 볼까요?' : '잘했어요! 선생님이 들어 볼 거예요 👂';
    busy = false; beep('ok');
    $('#mine').classList.remove('hide');
    if($('#nx').classList.contains('hide')){ fruit(2); $('#nx').classList.remove('hide') }
    save();
  }
  $('#go').onclick = start;
  $('#again').onclick = start;
  $('#me').onclick = ()=>{ mine && (mine.currentTime=0, mine.play()) };
  $('#nx').onclick = finish;
}

// ── 1. 만나기 ── 큰 글자를 누르면 노래처럼: "A. A says /æ/ /æ/ /æ/, apple!"
function meet(k){
  // 큰 글자(노래) + 그 소리로 시작하는 카드 5장(원장 2026-10-30). 노래 3번 + 카드 5장을 다 들으면 다음으로.
  const L = C.letters[k];
  h(`<p class="guide">글자를 눌러 노래를 듣고, 카드도 눌러 봐요<small id="how">글자 3번 · 카드 5장</small></p>
     <div class="row"><button class="big en" id="lt" style="background:none;font-size:min(34vw,200px)">${k.toUpperCase()}<b>${k}</b></button>
       <div class="light" style="font-size:28px">소리 <b style="color:var(--gold)">${L.ko}</b></div></div>
     <div class="stars" id="st" style="min-height:44px;font-size:34px"></div>
     <div class="cards5">${L.words.map((w,i)=>`<button class="c5" data-i="${i}"><span class="e">${w[2]}</span>
       <span class="w en">${hi(w[0],k)}</span><span class="ko">${w[1]}</span></button>`).join('')}</div>
     <button class="btn hide" id="nx">다음 ▶</button>`);
  let n = 0; const heard = new Set();
  const lt = $('#lt');
  const check = ()=>{
    $('#how').textContent = `글자 ${Math.min(n,3)}/3 · 카드 ${heard.size}/${L.words.length}`;
    if(n>=3 && heard.size===L.words.length && $('#nx').classList.contains('hide')){ fruit(); $('#nx').classList.remove('hide') }
  };
  lt.onclick = async ()=>{
    lt.classList.add('shake'); setTimeout(()=>lt.classList.remove('shake'),400);
    await play('chant-'+k);
    n++; $('#st').textContent = '⭐'.repeat(Math.min(n,3)); check();
  };
  stage().querySelectorAll('.c5').forEach(b=>b.onclick=async ()=>{
    const w = L.words[+b.dataset.i];
    b.classList.add('on'); await play('word-'+w[0], b);
    heard.add(+b.dataset.i); b.classList.add('heard'); check();
  });
  $('#nx').onclick = finish;
  check();
  setTimeout(()=>lt.click(), 400);
}

// ── 2. 앵무새 ── 선생님 소리 → 내 소리 녹음 → 둘을 번갈아 듣기. 소리 하나는 채점하지 않는다(Azure 가 못 함).
function parrot(k){
  const L = C.letters[k];
  let got = 0;
  h(`<p class="guide">🦜 앵무새처럼 따라 해요!<small>🔊 듣고 → 🎤 눌러 ${L.ko} 소리를 말해요</small></p>
     <div class="row"><div class="big en" style="font-size:min(30vw,180px)">${k}</div>
       <button class="spk" id="sp">🔊</button><div id="mic"></div></div>
     <div class="msg" id="msg"></div>
     <div class="mine hide" id="mine"><button id="tch">🔊 선생님</button><button id="me">🙋 내 목소리</button><button id="both">🔁 번갈아</button></div>
     <div class="stars" id="st"></div><button class="btn hide" id="nx">다음 ▶</button>`);
  $('#sp').onclick = e=>play('snd-'+k, e.currentTarget);
  let mine = null;
  recButton($('#mic'), {maxMs:2500, onDone(r){
    if(r.error){ $('#msg').textContent = r.error; beep('no'); return }
    mine = new Audio(r.url); got++;
    $('#msg').textContent = got>=2 ? '멋져요! 선생님이랑 비교해 들어 봐요 👂' : '좋아요! 한 번 더 해 볼까요?';
    $('#mine').classList.remove('hide'); $('#st').textContent='⭐'.repeat(Math.min(got,2));
    beep('ok');
    // 선생님이 성적표에서 들어 볼 수 있게 마지막 녹음을 남긴다
    upload(r.blob).then(url=>{ if(url){ S.parrot[k] = {url, at:nowStr()}; save() } });
    if(got===2){ fruit(); $('#nx').classList.remove('hide') }
  }});
  $('#tch').onclick = ()=>play('snd-'+k);
  $('#me').onclick = ()=>{ mine && mine.play() };
  $('#both').onclick = async ()=>{ await play('snd-'+k); if(mine){ await new Promise(r=>{ mine.onended=r; mine.currentTime=0; mine.play().catch(r) }) } };
  $('#nx').onclick = finish;
  setTimeout(()=>play('snd-'+k, $('#sp')), 400);
}

// ── 3. 따라쓰기 ── 흐린 글자 위를 손가락으로. 글자 칸을 얼마나 덮었나로 판정(밖으로 너무 나가면 안 셈).
function trace(k){
  const forms = [k.toUpperCase(), k]; let fi = 0;
  h(`<p class="guide" id="g">✍️ 손가락으로 따라 써요</p>
     <div class="trace-wrap"><canvas class="trace" id="cv"></canvas></div>
     <div class="meter"><i id="mt"></i></div>
     <div class="row"><button class="btn ghost" id="er">🧽 지우기</button><button class="btn hide" id="nx">다음 ▶</button></div>`);
  const cv = $('#cv'), ctx = cv.getContext('2d');
  const W = Math.min(innerWidth-40, 520), H = Math.min(innerHeight-300, 420);
  const dpr = devicePixelRatio||1;
  cv.width = W*dpr; cv.height = H*dpr; cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.scale(dpr,dpr);
  let mask=null, total=0, ink=[], drawing=false, last=null, passed=false;
  const fs = Math.min(H*0.9, W*0.95);
  const pen = Math.max(18, fs*0.09);
  const baseY = () => H*0.87 - (fi===1 && 'gjpqy'.includes(k) ? H*0.25 : 0);   // 아래로 내려가는 소문자는 올려 쓴다
  function guide(){
    ctx.clearRect(0,0,W,H);
    // 4선 노트 줄
    ctx.strokeStyle='#d8e6f5'; ctx.lineWidth=2;
    [0.12,0.37,0.62,0.87].forEach((y,i)=>{ ctx.setLineDash(i===1?[8,8]:[]); ctx.beginPath(); ctx.moveTo(10,H*y); ctx.lineTo(W-10,H*y); ctx.stroke() });
    ctx.setLineDash([]);
    ctx.font = `700 ${fs}px Andika, Arial, sans-serif`; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillStyle='#e9e3d3'; ctx.fillText(forms[fi], W/2, baseY());
  }
  function buildMask(){
    const o = document.createElement('canvas'); o.width=W; o.height=H; const c=o.getContext('2d');
    c.font = `700 ${fs}px Andika, Arial, sans-serif`; c.textAlign='center'; c.textBaseline='alphabetic'; c.fillStyle='#000';
    c.fillText(forms[fi], W/2, baseY());
    const d = c.getImageData(0,0,W,H).data; mask = new Uint8Array(W*H); total=0;
    for(let i=0;i<W*H;i+=1){ if(d[i*4+3]>100){ mask[i]=1; total++ } }
  }
  function score(){
    const o=document.createElement('canvas'); o.width=W; o.height=H; const c=o.getContext('2d');
    c.lineCap='round'; c.lineJoin='round'; c.lineWidth=pen*1.6; c.strokeStyle='#000';
    ink.forEach(s=>{ c.beginPath(); s.forEach((p,j)=>j?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])); if(s.length===1) c.lineTo(s[0][0]+.1,s[0][1]); c.stroke() });
    const d=c.getImageData(0,0,W,H).data; let hit=0, out=0, inkN=0;
    for(let i=0;i<W*H;i++){ const on=d[i*4+3]>100; if(on){ inkN++; if(!mask[i]) out++ } if(on&&mask[i]) hit++ }
    return {cover: total? hit/total : 0, stray: inkN? out/inkN : 0};
  }
  function redraw(){
    guide(); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=pen; ctx.strokeStyle='#1f3a5f';
    ink.forEach(s=>{ ctx.beginPath(); s.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); if(s.length===1) ctx.lineTo(s[0][0]+.1,s[0][1]); ctx.stroke() });
  }
  function check(){
    const {cover, stray} = score();
    $('#mt').style.width = Math.min(100, cover/0.7*100)+'%';
    if(!passed && cover>=0.7 && stray<0.55){
      passed = true; beep('ok'); cheer('✨');
      setTimeout(()=>{
        if(fi===0){ fi=1; ink=[]; passed=false; buildMask(); redraw(); $('#mt').style.width='0'; $('#g').textContent='이번엔 작은 글자 '+k+' !' }
        else { fruit(); $('#nx').classList.remove('hide'); $('#g').textContent='와! 둘 다 썼어요 🎉' }
      }, 700);
    }
  }
  const pt = e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top] };
  cv.onpointerdown = e=>{ if(passed) return; cv.setPointerCapture(e.pointerId); drawing=true; last=pt(e); ink.push([last]); redraw() };
  cv.onpointermove = e=>{ if(!drawing) return; const p=pt(e); ink[ink.length-1].push(p); ctx.beginPath(); ctx.moveTo(last[0],last[1]); ctx.lineTo(p[0],p[1]); ctx.stroke(); last=p };
  cv.onpointerup = cv.onpointercancel = ()=>{ if(drawing){ drawing=false; check() } };
  $('#er').onclick = ()=>{ if(passed) return; ink=[]; redraw(); $('#mt').style.width='0' };
  $('#nx').onclick = finish;
  const ready = ()=>{ buildMask(); redraw() };
  (document.fonts && document.fonts.load) ? document.fonts.load(`700 40px Andika`).then(ready, ready) : ready();
}

// ── 4. 단어 말하기 ── 3단어. 녹음 → 서버 채점(소리별). 별 1~3 + 첫소리 신호등.
function firstLight(res, k, w){
  // 초점 글자의 소리 점수 — 보통 첫 음소, x 처럼 끝소리 글자는 마지막 음소
  const phs = ((res.words||[])[0]||{}).phonemes||[];
  const ph = C.letters[k].pos==='end' ? phs[phs.length-1] : phs[0];
  if(!ph) return '';
  const a = ph.acc, col = a>=70?'var(--green)':a>=45?'var(--yellow)':'var(--red)';
  const say = a>=70?'아주 좋아요!':a>=45?'조금만 더 또렷하게':`${C.letters[k].ko} 소리를 더 크게!`;
  return `<span class="light"><i style="background:${col}"></i>${C.letters[k].pos==='end'?'끝소리':'첫소리'} <b class="en">${k}</b> ${say}</span>`;
}
function words(k){
  const L = C.letters[k]; let wi = 0;
  function one(){
    const w = L.words[wi];
    h(`<p class="guide">🎤 그림 이름을 말해요 <small>${wi+1} / ${L.words.length}</small></p>
       <div class="card"><div class="emoji">${w[2]}</div><div class="word en">${hi(w[0],k)}</div><div class="ko">${w[1]}</div></div>
       <div class="row" style="margin-top:16px"><button class="spk" id="sp">🔊</button><div id="mic"></div></div>
       <div class="stars" id="st"></div><div class="msg" id="msg"></div>
       <div class="mine hide" id="mine"><button id="tch">🔊 선생님</button><button id="me">🙋 내 목소리</button></div>
       <button class="btn hide" id="nx">${wi+1<L.words.length?'다음 단어 ▶':'다 했어요 ▶'}</button>`);
    $('#sp').onclick = e=>play('word-'+w[0], e.currentTarget);
    let mine=null;
    recButton($('#mic'), {maxMs:3500, async onDone(r){
      if(r.error){ $('#msg').textContent=r.error; beep('no'); return }
      mine = new Audio(r.url); $('#mine').classList.remove('hide');
      $('#msg').textContent = '듣고 있어요… 👂'; $('#st').textContent='';
      const up = upload(r.blob);
      let res=null;
      try{ res = await assess(w[0], r.blob) }catch(e){}
      if(!res || !res.ok){
        // 채점이 안 돼도 해낸 건 해낸 것 — 별 하나는 준다(성적표엔 점수 없이)
        $('#st').textContent='⭐'; $('#msg').innerHTML = (res&&res.note) || '잘 들었어요! (채점은 잠시 쉬는 중)';
      } else {
        const sc = res.score, n = sc>=80?3:sc>=55?2:1;
        $('#st').textContent = '⭐'.repeat(n) + '☆'.repeat(3-n);
        $('#msg').innerHTML = firstLight(res, k, w) || (n===3?'완벽해요!':'잘했어요!');
        if(n===3) play('fb-0');
        // 같은 단어를 여러 번 하면 가장 잘한 것을 남긴다
        const prev = S.takes[w[0]];
        up.then(url=>{ if(!prev || prev.score==null || sc>=prev.score){ S.takes[w[0]] = {k, score:sc, url, at:nowStr()}; save() } });
      }
      beep('ok');
      if($('#nx').classList.contains('hide')){ fruit(); $('#nx').classList.remove('hide') }
    }});
    $('#tch').onclick = ()=>play('word-'+w[0]);
    $('#me').onclick = ()=>{ mine && (mine.currentTime=0, mine.play()) };
    $('#nx').onclick = ()=>{ $('#nx').onclick = null; wi++; wi<L.words.length ? one() : finish() };
    setTimeout(()=>play('word-'+w[0], $('#sp')), 350);
  }
  one();
}

// ── 5. 소리 버블 ── 소리를 듣고 그 글자 방울을 톡! 6번.
function bubble(){
  const ks = LET;
  const targets = shuffle(ks.concat(ks, ks)).slice(0,6);
  let r = 0, raf = 0, bubs = [];
  h(`<p class="guide">🫧 소리를 듣고 그 글자 방울을 톡!<small id="cnt">1 / 6</small></p>
     <div class="pond" id="pond"></div>
     <div class="row"><button class="spk" id="sp">🔊</button></div>`);
  const pond = $('#pond');
  function round(){
    cancelAnimationFrame(raf); pond.innerHTML=''; bubs=[];
    $('#cnt').textContent = (r+1)+' / '+targets.length;
    const t = targets[r]; let solved = false;   // 같은 글자 방울(A·a)을 연달아 눌러 두 번 넘어가지 않게
    const labels = shuffle(ks.flatMap(k=>[k.toUpperCase(),k]));
    const PW = pond.clientWidth, PH = pond.clientHeight;
    labels.forEach((lb,i)=>{
      const b = document.createElement('button'); b.className='bub en'; b.textContent=lb;
      const o = {el:b, x:(PW-96)*(i+0.5)/labels.length, y:(PH-96)*(0.15+0.7*((i*0.37)%1)), v:28+Math.random()*30, ph:Math.random()*6};
      b.onclick = ()=>{
        if(solved) return;
        if(lb.toLowerCase()===t){
          solved = true; beep('pop'); b.classList.add('pop'); o.dead=true;
          setTimeout(()=>{ beep('ok'); r++; r<targets.length ? round() : (cancelAnimationFrame(raf), fruit(), fruit(), setTimeout(finish,700)) }, 350);
        } else { beep('no'); b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),350); play('snd-'+t) }
      };
      pond.appendChild(b); bubs.push(o);
    });
    let tPrev = performance.now();
    (function move(now){
      // 시간 기준으로 움직인다(기기 화면 빈도가 달라도 같은 속도)
      const dt = Math.min(0.05, ((now||tPrev)-tPrev)/1000); tPrev = now||tPrev;
      bubs.forEach(o=>{ if(o.dead) return; o.y -= o.v*dt; o.ph += 1.8*dt; if(o.y < -100) o.y = PH+10;
        o.el.style.transform = `translate(${o.x + Math.sin(o.ph)*18}px,${o.y}px)` });
      raf = requestAnimationFrame(move);
    })();
    setTimeout(()=>play('snd-'+t, $('#sp')), 300);
  }
  $('#sp').onclick = e=>play('snd-'+targets[r], e.currentTarget);
  round();
}

// ── 6. 첫소리 낚시 ── 그림 + 단어 소리 → 첫 글자 물고기를 낚아요. 6번.
//    끝소리 글자(x)는 '어떤 소리가 들어 있을까?' 로 묻는다.
function fish(){
  const ks = LET;
  const pool = shuffle(ks.flatMap(k=>C.letters[k].words.map(w=>({k,w})))).slice(0,6);
  let r = 0;
  function round(){
    const {k,w} = pool[r]; let solved = false;
    const end = !startsWith(k);
    h(`<p class="guide">🎣 ${end?'어떤 소리가 들어 있을까?':'무슨 소리로 시작할까?'}<small>${r+1} / ${pool.length}</small></p>
       <div class="card" style="padding:8px 30px"><div class="emoji">${w[2]}</div><div class="ko">${w[1]}</div></div>
       <div class="row" style="margin-top:10px"><button class="spk" id="sp">🔊</button></div>
       <div class="sea">${shuffle(ks).map(x=>`<button class="fish en" data-k="${x}">${x}</button>`).join('')}</div>`);
    $('#sp').onclick = e=>play('word-'+w[0], e.currentTarget);
    stage().querySelectorAll('.fish').forEach(b=>b.onclick=async ()=>{
      if(solved) return;
      if(b.dataset.k===k){
        solved = true; beep('ok'); b.style.animation='none'; b.style.transform='translateY(-200px) rotate(-30deg)'; b.style.transition='transform .5s';
        $('.card').innerHTML = `<div class="emoji">${w[2]}</div><div class="word en">${hi(w[0],k)}</div>`;
        await play('word-'+w[0]);
        r++; r<pool.length ? round() : (fruit(), fruit(), finish());
      } else { beep('no'); b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),350); play('snd-'+k) }
    });
    setTimeout(()=>play('word-'+w[0], $('#sp')), 300);
  }
  round();
}

// ── 7. 짝 찾기 ── 대문자·소문자 카드 짝 맞추기
function memory(){
  const ks = LET;
  const cards = shuffle(ks.flatMap(k=>[{k,lb:k.toUpperCase()},{k,lb:k}]));
  h(`<p class="guide">🃏 큰 글자와 작은 글자 짝을 찾아요</p><div class="grid">${cards.map((c,i)=>`<button class="mem en" data-i="${i}">?</button>`).join('')}</div>`);
  let open = [], got = 0, lock = false;
  stage().querySelectorAll('.mem').forEach(b=>b.onclick=()=>{
    const c = cards[+b.dataset.i];
    if(lock || b.classList.contains('open') || b.classList.contains('got')) return;
    b.classList.add('open'); b.textContent = c.lb; play('name-'+c.k); open.push([b,c]);
    if(open.length===2){
      lock = true;
      const [[b1,c1],[b2,c2]] = open; open = [];
      if(c1.k===c2.k){
        setTimeout(()=>{ beep('ok'); [b1,b2].forEach(x=>{x.classList.remove('open');x.classList.add('got')}); play('snd-'+c1.k); lock=false;
          if(++got===ks.length){ fruit(); fruit(); setTimeout(finish, 900) } }, 400);
      } else setTimeout(()=>{ beep('no'); [b1,b2].forEach(x=>{x.classList.remove('open');x.textContent='?'}); lock=false }, 900);
    }
  });
}

// ── 문제 풀이 엔진 (오늘의 퀴즈·진급시험 공용) ──
// 글을 못 읽어도 풀 수 있게 전부 '듣고 고르기' + 말하기. 첫 번째 고른 답만 점수에 넣는다
// (틀리면 정답을 보여 주고 넘어감). 결과는 영역별(byType)·글자별(letters)로 남는다.
function makeQ(type, k, pool){
  const others = n => shuffle(pool.filter(x=>x!==k)).slice(0,n);
  const q = {type, k, w: pick(C.letters[k].words)};
  if(type==='snd' || type==='pic') q.opts = shuffle([k].concat(others(2)));
  if(type==='case') q.opts = shuffle([k].concat(others(Math.min(3, pool.length-1))));
  if(type==='word') q.opts = shuffle([q.w].concat(others(2).map(x=>pick(C.letters[x].words))));
  return q;
}
function runQuestions(qs, title, onDone){
  const ans = [], t0 = Date.now();
  let qi = 0;
  function next(ok){
    ans.push({type:qs[qi].type, k:qs[qi].k, ok, score:qs[qi].score});
    beep(ok?'ok':'no');
    setTimeout(()=>{ qi++; qi<qs.length ? ask() : onDone(ans, Math.round((Date.now()-t0)/1000)) }, ok?700:1400);
  }
  function choices(opts, render, isRight){
    let picked = false;
    stage().querySelector('#ch').innerHTML = opts.map((o,i)=>`<button class="qc" data-i="${i}">${render(o)}</button>`).join('');
    stage().querySelectorAll('.qc').forEach(b=>b.onclick=()=>{
      if(picked) return; picked = true;
      const ok = isRight(opts[+b.dataset.i]);
      b.style.background = ok ? '#c8e6c9' : '#ffcdd2';
      if(!ok) stage().querySelectorAll('.qc').forEach(x=>{ if(isRight(opts[+x.dataset.i])) x.style.background='#c8e6c9' });
      next(ok);
    });
  }
  function ask(){
    const q = qs[qi];
    const head = `<p class="guide">${title} <small>${qi+1} / ${qs.length}</small></p>
      <div class="meter" style="margin:0 0 14px"><i style="width:${qi/qs.length*100}%"></i></div>`;
    const L = x => `<span class="en">${x}</span>`;
    if(q.type==='snd'){
      h(head+`<p class="guide">🔊 이 소리는 어떤 글자일까?</p><button class="spk" id="sp">🔊</button><div class="sea" id="ch"></div>`);
      $('#sp').onclick = e=>play('snd-'+q.k, e.currentTarget);
      choices(q.opts, L, x=>x===q.k);
      setTimeout(()=>play('snd-'+q.k, $('#sp')), 300);
    } else if(q.type==='pic'){
      h(head+`<p class="guide">어떤 소리로 시작할까?</p><div class="card" style="padding:6px 26px"><div class="emoji">${q.w[2]}</div></div>
        <button class="spk" id="sp" style="width:64px;height:64px;font-size:28px;margin-top:8px">🔊</button><div class="sea" id="ch"></div>`);
      $('#sp').onclick = e=>play('word-'+q.w[0], e.currentTarget);
      choices(q.opts, L, x=>x===q.k);
    } else if(q.type==='case'){
      h(head+`<p class="guide">짝꿍 작은 글자를 찾아요</p><div class="big en" style="font-size:150px">${q.k.toUpperCase()}</div><div class="sea" id="ch"></div>`);
      choices(q.opts, L, x=>x===q.k);
    } else if(q.type==='word'){
      h(head+`<p class="guide">🔊 잘 듣고 그림을 골라요</p><button class="spk" id="sp">🔊</button><div class="sea" id="ch"></div>`);
      $('#sp').onclick = e=>play('word-'+q.w[0], e.currentTarget);
      choices(q.opts, x=>`<span style="font-size:64px">${x[2]}</span>`, x=>x[0]===q.w[0]);
      setTimeout(()=>play('word-'+q.w[0], $('#sp')), 300);
    } else {
      h(head+`<p class="guide">🎤 그림 이름을 말해 봐요!</p>
        <div class="card"><div class="emoji">${q.w[2]}</div><div class="word en">${hi(q.w[0],q.k)}</div></div>
        <div class="row" style="margin-top:14px"><div id="mic"></div></div><div class="msg" id="msg"></div>`);
      let sent = false;
      recButton($('#mic'), {maxMs:3500, async onDone(r){
        if(r.error){ $('#msg').textContent=r.error; return }   // 안 들린 건 다시 기회
        if(sent) return; sent = true;
        $('#msg').textContent='듣고 있어요… 👂';
        let res=null; try{ res = await assess(q.w[0], r.blob) }catch(e){}
        // 채점이 안 되면 점수 없이 '말하기 함'으로만 남기고 정답 처리하지 않는다(성적이 거짓말을 하면 안 됨)
        q.score = res && res.ok ? res.score : null;
        $('#msg').textContent = q.score==null ? '잘 들었어요!' : q.score>=55 ? '좋아요! 👍' : '괜찮아요, 다음엔 더 크게!';
        next(q.score!=null && q.score>=55);
      }});
    }
  }
  ask();
}
function tally(ans){
  const by = {}, lt = {};
  ans.forEach(a=>{ (by[a.type]=by[a.type]||{ok:0,n:0}); by[a.type].n++; if(a.ok) by[a.type].ok++;
                   (lt[a.k]=lt[a.k]||{ok:0,n:0}); lt[a.k].n++; if(a.ok) lt[a.k].ok++ });
  return {by, lt, n: ans.filter(a=>a.ok).length};
}
function areaList(by){
  return Object.entries(by).map(([t,v])=>`<div>${v.ok===v.n?'🟢':v.ok/v.n>=0.5?'🟡':'🔴'} ${QAREA[t]||t} <b>${v.ok}/${v.n}</b></div>`).join('');
}

// ── 8. 오늘의 퀴즈 ── 7문항(소리→글자 3, 그림→첫소리, 대→소문자, 단어→그림, 말하기)
function quiz(){
  const ks = LET, firsts = ks.filter(startsWith);
  const snd = shuffle(ks.concat(ks)).slice(0,3);
  const qs = shuffle([
    ...snd.map(k=>makeQ('snd', k, ks)),
    makeQ('pic', pick(firsts.length?firsts:ks), ks),
    makeQ('case', pick(ks), ks),
    makeQ('word', pick(ks), ks),
  ]).concat([makeQ('say', pick(ks), ks)]);   // 말하기는 맨 끝
  runQuestions(qs, '🏆 오늘의 퀴즈', async (ans, sec)=>{
    const {by, lt, n} = tally(ans), score = Math.round(n/ans.length*100);
    S.quiz = {at:nowStr(), score, sec, byType:by, letters:lt, answers:ans};
    S.fruits += n;
    S.done[key(cur)] = 1;
    // 오늘 할 일이 다 끝났으면 제출(랭킹·알림·진급시험 열림이 여기서 시작된다)
    const all = STEPS.every((s,i)=>S.done[key(i)]);
    h(`<p class="guide">🏆 퀴즈 끝!</p><p class="guide" style="font-size:18px">저장하는 중…</p>`);
    await save(all ? {status:'submitted', submittedAt:nowStr(), phonicsScore:score} : {});
    const weak = Object.entries(lt).filter(([k,v])=>v.ok<v.n).map(([k])=>k.toUpperCase());
    h(`<p class="guide">🏆 퀴즈 끝!</p>
       <div class="card" style="min-width:min(90vw,460px)">
         <div style="font-size:64px;color:var(--navy)">${score}<span style="font-size:28px">점</span></div>
         <div class="stars">${'⭐'.repeat(n)}${'☆'.repeat(ans.length-n)}</div>
         <div style="text-align:left;font-size:19px;line-height:1.9;margin-top:6px">${areaList(by)}</div>
         <div class="msg">${weak.length ? `조금 더 연습할 글자: <b class="en" style="color:var(--gold)">${weak.join(' · ')}</b>` : '모두 완벽해요! 🎉'}</div>
         ${saveErr ? `<div class="msg" style="color:var(--red);font-size:17px">⚠ 저장이 안 됐어요: ${saveErr}</div>` : ''}
         ${EMBED && !all ? `<div class="msg" style="font-size:17px">아직 안 한 칸이 있어요 — 다 하면 '완료'가 돼요</div>` : ''}
       </div>
       <button class="btn" id="nx">🌳 내 나무 보기</button>`);
    if(n===ans.length) play('fb-0');
    $('#nx').onclick = ()=>{ doneLock = true; go('end') };
  });
}

// ── 끝: 열매 나무 ──
function end(){
  $('#title').textContent = '오늘 다 했어요!';
  const n = Math.min(S.fruits, 40);
  let ap = '';
  for(let i=0;i<n;i++){ const a=i*2.4, rr=0.18+0.22*((i*37)%10)/10; ap += `<span class="ap" style="left:${46+Math.cos(a)*rr*100}%;top:${34+Math.sin(a)*rr*80}%;animation-delay:${i*0.05}s">🍎</span>` }
  h(`<p class="guide">🌳 내 나무에 열매가 <b style="color:var(--gold)">${S.fruits}개</b>!</p>
     <div class="tree"><div class="trunk"></div><div class="crown"></div>${ap}</div>
     <div class="row">${EMBED ? '<button class="btn" onclick="leave()">↩ 트리톡으로</button><button class="btn ghost" onclick="openReport()">📊 내 성적표</button>'
                              : '<button class="btn" onclick="go(\'map\')">🏠 처음 화면</button>'}</div>
     ${EMBED ? '' : '<p class="note">시연 화면이에요 — 기록은 이 기기에만 남아요.</p>'}`);
  play('fb-0');
}

// ── 진급시험 ── 알파벳 26자 30문항: 소리→글자 10 · 그림→첫소리 6 · 대→소문자 6 · 단어→그림 4 · 말하기 4.
//    점수는 /api/exam 에 쌓여 단어급수 진급시험과 같은 성적표(전체·동학년 상위%·9등급·70점 진급)가 나온다.
function examIntro(){
  $('#title').textContent = A.title; $('#dots').innerHTML='';
  h(`<p class="guide">🎯 알파벳 진급시험</p>
     <div class="card" style="font-size:20px;line-height:1.8;text-align:left">
       🔊 소리를 듣고 고르는 문제 26개<br>🎤 그림 이름을 말하는 문제 4개<br>
       <span style="color:#8a7d60">70점을 넘으면 다음 책으로 올라가요!</span></div>
     <button class="btn" id="go">시작하기 ▶</button>
     <button class="btn ghost" onclick="leave()">↩ 나가기</button>`);
  $('#go').onclick = examRun;
}
function examRun(){
  const all = C.days.flatMap(d=>d.letters), firsts = all.filter(startsWith);
  const qs = shuffle([
    ...shuffle(all).slice(0,10).map(k=>makeQ('snd', k, all)),
    ...shuffle(firsts).slice(0,6).map(k=>makeQ('pic', k, all)),
    ...shuffle(all).slice(0,6).map(k=>makeQ('case', k, all)),
    ...shuffle(all).slice(0,4).map(k=>makeQ('word', k, all)),
  ]).concat(shuffle(firsts).slice(0,4).map(k=>makeQ('say', k, all)));
  runQuestions(qs, '🎯 진급시험', async (ans, sec)=>{
    const {by, lt, n} = tally(ans);
    h(`<p class="guide">🎯 채점하는 중…</p>`);
    let rep = null, err = '';
    if(EMBED){
      try{
        const r = await fetch(`/api/exam/${encodeURIComponent(AID)}/${encodeURIComponent(SID)}`, {method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({correct:n, total:ans.length, seconds:sec, byType:Object.assign({}, by, {_letters:lt})})});
        if(!r.ok) throw new Error('저장 실패 '+r.status);
        rep = await (await fetch(`/api/exam-report/${encodeURIComponent(AID)}/${encodeURIComponent(SID)}`)).json();
      }catch(e){ err = e.message }
    }
    const score = Math.round(n/ans.length*100), pass = score >= ((rep&&rep.passScore)||70);
    h(`<p class="guide">${pass?'🎉 진급 성공!':'💪 조금만 더!'}</p>
       <div class="card" style="min-width:min(90vw,480px)">
         <div style="font-size:64px;color:var(--navy)">${score}<span style="font-size:28px">점</span></div>
         ${rep && rep.score!==score ? `<div class="msg" style="font-size:16px">지금까지 최고 ${rep.score}점</div>` : ''}
         <div style="text-align:left;font-size:19px;line-height:1.9;margin-top:6px">${areaList(by)}</div>
         ${rep && rep.score_all && rep.score_all.n>=3 ? `<div class="msg">함께 본 친구 ${rep.score_all.n}명 중 <b>상위 ${rep.score_all.top}%</b>${rep.band?` · ${rep.band}등급`:''}</div>` : ''}
         ${err ? `<div class="msg" style="color:var(--red);font-size:17px">⚠ ${err}</div>` : ''}
       </div>
       <div class="row">${EMBED ? '<button class="btn" onclick="openReport()">📊 성적표 보기</button><button class="btn ghost" onclick="leave()">↩ 나가기</button>'
                                : '<button class="btn" onclick="examIntro()">다시 보기</button>'}</div>`);
    if(pass) play('fb-0');
  });
}

// ── 시작 ──
(async function(){
  try{
    C = await (await fetch('/api/phonics/content')).json();
    if(AID){
      const r = await fetch('/api/assignment/'+encodeURIComponent(AID));
      if(!r.ok) throw new Error('과제를 찾지 못했어요');
      A = await r.json();
    }
  }catch(e){ h(`<p class="guide">불러오지 못했어요. 새로고침 해 주세요 🙏<small>${e.message||''}</small></p>`); return }

  if(A && A.type==='exam'){ return examIntro() }

  // 오늘 글자: 과제의 items(복사돼도 남는다) → 없으면 ?day=
  const want = A ? (A.items||[]).map(x=>String(x).toLowerCase()) : null;
  const d = want ? C.days.find(x=>x.letters.join()===want.join()) : C.days.find(x=>x.day===(+QS.get('day')||1));
  DAY = d ? d.day : 1; LET = d ? d.letters : (want || C.days[0].letters);
  build();
  if(EMBED){
    try{
      const sub = await (await fetch(`/api/submission/${encodeURIComponent(AID)}/${encodeURIComponent(SID)}`)).json();
      S = Object.assign(S, (sub && sub.phonics) || {});
    }catch(e){}
  } else {
    const st = store.get(); S.fruits = st.fruits||0; S.done = st.done||{};
  }
  $('#fruits').textContent = S.fruits;
  go('map');
  // 첫 재생이 느리지 않게 오늘 소리를 미리 만들어 둔다(서버는 한 번 만든 건 다시 안 만듦)
  const ids = [];
  LET.forEach(k=>{ ids.push('chant-'+k,'snd-'+k,'name-'+k); C.letters[k].words.forEach(w=>ids.push('word-'+w[0])) });
  ids.push('fb-0');
  for(const id of ids){ try{ await fetch(audUrl(id)) }catch(e){} }
})();
</script>
