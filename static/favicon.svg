      <ellipse cx="27" cy="55" rx="3" ry="1.5" transform="rotate(-32 27 55)"/>
      <ellipse cx="22" cy="50" rx="3.1" ry="1.5" transform="rotate(-44 22 50)"/>
      <ellipse cx="17.5" cy="44.5" rx="3.2" ry="1.5" transform="rotate(-56 17.5 44.5)"/>
