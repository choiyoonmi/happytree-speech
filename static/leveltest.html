  const i = from[Math.floor(Math.random() * from.length)];
  const it = Object.assign({ idx: i, g: GRAMMAR.items[i].g }, GRAMMAR.items[i]);
  /* ★문법 자료도 정답 자리가 쏠려 있다(④가 정답인 문항이 0개) — 고르기는 화면에서 섞는다. */
  if (it.t !== 'w') Object.assign(it, shuffleQ(it));
  return it;
}
/* ★맨 위·맨 아래 단계는 문항이 몇 개뿐이다. 다 쓰고 나면 예전에는 사다리를 아무 근거 없이
     옮겨서, 문법을 다 맞힌 중3이 8단계로 판정됐다. 이제는 칸은 그대로 두고 가장 가까운
     단계(아래 먼저)에서 한 문항을 빌려 온다 — 판정은 지금 칸을 그대로 지킨다. */
function borrowGram(d, used) {
  for (let k = 1; k < DLV.length; k++) {
    for (const dd of [d - k, d + k]) {
      if (!GD[dd]) continue;
      const it = makeGram(dd, used);
      if (it) return it;
    }
  }
  return null;
}

/* 지금 단계를 끝내고 다음 단계 안내로 — 마지막이면 결과 */
function advance() {
  const k = PHASES.indexOf(S.phase);
  if (k >= PHASES.length - 1) return result();
  S.phase = PHASES[k + 1];
  if (S.phase === 'write' && !S.witems) {
    S.wband = WBAND(gramJudge() || GSTART[S.grade] || 1);
    S.witems = pickWrite(S.wband); S.wn = 0; S.wlog = [];
  }
  if (S.phase === 'speak' && !S.sitems) {
    S.sband = SBAND(listenJudge() || HSTART[S.grade] || 1);
    S.sitems = pickSpeak(S.sband); S.sn = 0; S.slog = [];
  }
  return bridge();
}
function next() {
  if (S.phase === 'vocab' && S.n >= N_VOCAB) return advance();
  if (S.phase === 'listen' && S.hn >= N_LISTEN) return advance();
  if (S.phase === 'gram' && S.gn >= N_GRAM) return advance();
  if (S.phase === 'read' && S.rp >= N_PSG) return advance();
  if (S.phase === 'write') {
    if (S.wn >= S.witems.length) return advance();
    S.item = WRITE.find(x => x.id === S.witems[S.wn]);
    S.wpick = []; S.wtiles = S.item.type === 'order' ? tilesOf(S.item.ans) : null;
    S.t0 = performance.now();
    return drawWrite();
  }
  if (S.phase === 'speak') {
    if (S.sn >= S.sitems.length) return advance();
    S.item = SPEAK.find(x => x.id === S.sitems[S.sn]);
    S.srec = 0; S.shint = false; S.sdone = null;
    return drawSpeak();
  }
  let it = null, guard = 0;
  if (S.phase === 'vocab') {
    while (!it && guard++ < 40) {
      it = makeItem(WALK[S.ri], S.used);
      if (!it) S.ri = Math.max(0, Math.min(WALK.length - 1, S.ri + (Math.random() < .5 ? -1 : 1)));
    }
    if (!it) return advance();
    S.used.add(it.w);
  } else if (S.phase === 'listen') {
    /* 그 단계 문항을 다 쓰면 칸은 그대로 두고 가까운 단계(아래 먼저)에서 빌린다 — 문법과 같은 까닭 */
    it = makeListen(S.hl, S.hused);
    for (let k = 1; !it && k < HLV.length; k++) it = makeListen(S.hl - k, S.hused) || makeListen(S.hl + k, S.hused);
    if (!it) return advance();
    S.hused.add(it.id);
    S.plays = 0;
  } else if (S.phase === 'gram') {
    it = makeGram(S.gi, S.gused) || borrowGram(S.gi, S.gused);
    if (!it) return advance();
    S.gused.add(it.idx);
  }
  if (S.phase === 'read') {
    if (S.rq === 0) {                       /* 새 지문을 편다 */
      let p = null, g2 = 0;
      while (!p && g2++ < 20) {
        p = makePsg(S.rlv, S.rused);
        if (!p) S.rlv = Math.max(1, Math.min(RLV.length, S.rlv + (Math.random() < .5 ? -1 : 1)));
      }
      if (!p) return result();
      S.rused.add(S.rlv + '|' + p.t);
      S.psg = { lv: S.rlv, t: p.t, s: p.s, qs: [shuffleQ(p.q1), shuffleQ(p.q2)] };
      S.pgot = 0;
    }
    it = S.psg.qs[S.rq];
  }
  S.item = it; S.t0 = performance.now();
  draw();
}

const BRIDGE_TIP = {
  listen: '원어민 목소리를 듣고 알맞은 답을 고릅니다. <b>▶ 듣기</b>를 누르면 나오고, 한 문항에 <b>두 번까지</b> 들을 수 있습니다. '
        + '소리가 잘 들리는지 먼저 확인해 주세요(이어폰 권장).',
  gram:   '맞히면 한 단계 위로, 틀리면 한 단계 아래로 갑니다.',
  read:   '지문을 읽고 편마다 두 문항씩 답합니다. 맞힌 만큼 다음 글이 어려워지고, 틀린 만큼 쉬워집니다.',
  write:  '영어로 문장을 만들고 씁니다. 철자가 조금 틀려도 괜찮아요 — 아는 만큼 끝까지 써 보세요.',
  speak:  '마지막입니다. <b>🎤 녹음</b>을 누르고 영어로 말한 뒤 <b>⏹ 끝</b>을 누릅니다. 조용한 곳에서, 화면에 가까이 대고 또박또박 말해 주세요. '
        + '처음 녹음할 때 <b>마이크 허용</b>을 물으면 「허용」을 눌러 주세요.'
};
function bridge() {
  const prev = PHASES[PHASES.indexOf(S.phase) - 1];
  document.getElementById('app').innerHTML =
    '<div class="card"><p class="lead">' + PNAME[prev] + ' ' + PCOUNT()[prev] + '이 끝났습니다.</p>'
    + '<p class="small">이어서 <b>' + PNAME[S.phase] + ' ' + PCOUNT()[S.phase] + '</b>입니다. ' + (BRIDGE_TIP[S.phase] || '') + '</p>'
    + '<button class="go" onclick="next()">' + PNAME[S.phase] + ' 시작</button></div>';
  saveRun('bridge');
}

function draw() {
  const it = S.item, v = S.phase === 'vocab';
  const r = S.phase === 'read', h = S.phase === 'listen';
  const w = it.t === 'w';                    /* 라이팅 — 보기 없이 빈칸에 직접 쓴다 */
  const blank = s => esc(s).replace(/____/g, '<u>&nbsp;&nbsp;&nbsp;&nbsp;</u>');
  const head = v
    ? '<p class="word">' + esc(it.w) + '</p>'
      + '<p class="pos">' + (POSKO[it.p] || '') + ' · 뜻으로 알맞은 것을 고르세요</p>'
    : h
    ? '<audio id="aud" preload="auto" src="/api/lt/audio/' + encodeURIComponent(it.id) + '.mp3"></audio>'
      + '<button class="play" id="play" onclick="playA()">' + playLabel() + '</button>'
      + '<p class="gq rq">' + esc(it.q) + '</p>'
    : r
    ? '<div class="psg"><p class="en">' + esc(S.psg.s.join(' ')) + '</p></div>'
      + '<p class="gq rq">' + esc(it.q) + '</p>'
    : w
    ? '<p class="kotip">' + esc(it.ko) + '</p><p class="gq">' + blank(it.q) + '</p>'
    : '<p class="gq">' + blank(it.q) + '</p>';
  const body = w
    ? '<input class="wbox" id="wans" autocomplete="off" autocapitalize="off" autocorrect="off"'
      + ' spellcheck="false" placeholder="빈칸에 들어갈 말을 쓰세요" oninput="typed(this.value)">'
    : '<ul class="opts">' + it.c.map((c, i) =>
        '<li><button class="opt" id="o' + i + '" onclick="pick(' + i + ')">'
        + '<b>' + '①②③④'[i] + '</b><span>' + esc(c) + '</span></button></li>').join('') + '</ul>';
  document.getElementById('app').innerHTML = (v ? ladderHtml() : r ? rLadderHtml() : h ? hLadderHtml() : gLadderHtml())
    + '<div class="card"><div class="meta"><span class="n">'
    + (v ? '단어 ' + (S.n + 1) + ' / ' + N_VOCAB
         : h ? '듣기 ' + (S.hn + 1) + ' / ' + N_LISTEN
         : r ? '독해 ' + (S.rp + 1) + '편 · ' + (S.rq + 1) + ' / 2'
             : '문장 만들기 ' + (S.gn + 1) + ' / ' + N_GRAM + (w ? ' · 쓰기' : '')) + '</span>'
    + '<span>지금 칸 · ' + (v ? LABEL(WALK[S.ri]) : h ? it.lv + '단계 ' + HNAME[it.lv] : r ? 'LV' + S.psg.lv : DNAME[S.gi]) + '</span>'
    + '<span class="t" id="clock">0.0초</span></div>' + head + body
    + '<button class="go" id="nextq" disabled onclick="sendAns()">다음</button></div>';
  S.sel = null;
  if (w) {
    const el = document.getElementById('wans');
    if (el) { el.focus(); el.onkeydown = e => { if (e.key === 'Enter') sendAns(); }; }
  }
  S.t0 = performance.now();
  tick();
  saveRun('q');
}
/* ══ 쓰기 화면 ════════════════════════════════════════════════════ */
/* 카드는 소문자로 섞는다(I 만 그대로) — 첫 낱말이 대문자면 그게 첫 자리라는 힌트가 된다. 마침표·물음표는 채점에서 뺀다. */
function tilesOf(ans) {
  const w = ans.replace(/[.?!]$/, '').split(/\s+/).map(x => x === 'I' ? x : x.toLowerCase());
  const t = w.map((x, i) => ({ w: x, i }));
  for (let k = 0; k < 6; k++) {
    for (let i = t.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; }
    if (t.some((x, i) => x.i !== i)) break;   /* 섞였는데 그대로면 다시 */
  }
  return t;
}
const ordNorm = s => String(s).toLowerCase().replace(/[.?!,]/g, '').replace(/\s+/g, ' ').trim();
function drawWrite() {
  const it = S.item, n = S.witems.length;
  let body;
  if (it.type === 'order') {
    const used = new Set(S.wpick);
    body = '<p class="pos">우리말 뜻이 되도록 낱말 카드를 차례대로 누르세요</p>'
      + '<p class="gq rq">' + esc(it.ko) + '</p>'
      + '<div class="psg" style="min-height:56px;margin:0 0 12px"><p class="en" style="font-size:18px">'
      + (S.wpick.length ? S.wpick.map((k, j) => '<button class="tile on" onclick="unpickW(' + j + ')">' + esc(S.wtiles[k].w) + '</button>').join(' ')
                        : '<span class="ko" style="font-size:13px">여기에 문장이 만들어져요</span>') + '</p></div>'
      + '<div class="tiles">' + S.wtiles.map((t, k) => used.has(k) ? '' :
          '<button class="tile" onclick="pickW(' + k + ')">' + esc(t.w) + '</button>').join('') + '</div>';
  } else {
    body = '<p class="gq" style="margin-bottom:6px">' + esc(it.q) + '</p><p class="kotip">' + esc(it.qko) + '</p>'
      + '<textarea class="wbox" id="wtext" rows="' + (it.lines + 2) + '" autocapitalize="sentences" spellcheck="false" '
      + 'placeholder="영어로 써 보세요" oninput="wTyped()">' + esc(S.wdraft || '') + '</textarea>'
      + '<p class="small" id="wcount" style="text-align:right">' + wCount(S.wdraft || '') + '낱말</p>';
  }
  const ready = it.type === 'order' ? S.wpick.length === S.wtiles.length : wCount(S.wdraft || '') > 0;
  document.getElementById('app').innerHTML =
    '<div class="card"><div class="meta"><span class="n">쓰기 ' + (S.wn + 1) + ' / ' + n + '</span>'
    + '<span>' + (it.type === 'order' ? '낱말 배열' : '문장 쓰기') + '</span><span class="t" id="clock">0.0초</span></div>'
    + body
    + '<button class="go" id="nextq" ' + (ready ? '' : 'disabled') + ' onclick="sendWrite()">다음</button>'
    + (it.type === 'open' ? '<p class="small" style="text-align:center;margin-top:10px"><a href="#" onclick="skipWrite();return false">못 쓰겠어요 — 건너뛰기</a></p>' : '')
    + '</div>';
  tick();
  saveRun('q');
}
const wCount = s => (String(s).match(/[A-Za-z']+/g) || []).length;
function pickW(k) { S.wpick.push(k); drawWrite(); }
function unpickW(j) { S.wpick.splice(j, 1); drawWrite(); }
function wTyped() {
  const v = document.getElementById('wtext').value; S.wdraft = v;
  document.getElementById('wcount').textContent = wCount(v) + '낱말';
  document.getElementById('nextq').disabled = wCount(v) === 0;
  saveRun('q');
}
function sendWrite() {
  const it = S.item, sec = (performance.now() - S.t0) / 1000;
  clearInterval(timer);
  if (it.type === 'order') {
    const made = S.wpick.map(k => S.wtiles[k].w).join(' ');
    S.wlog.push({ id: it.id, type: 'order', ko: it.ko, ans: it.ans, made, ok: ordNorm(made) === ordNorm(it.ans), sec });
  } else {
    S.wlog.push({ id: it.id, type: 'open', q: it.q, text: (S.wdraft || '').trim(), words: wCount(S.wdraft || ''), minw: it.minw, sec });
  }
  S.wdraft = ''; S.wn++; next();
}
function skipWrite() {
  const it = S.item;
  S.wlog.push({ id: it.id, type: it.type, q: it.q || it.ko, text: '', words: 0, skipped: true, sec: 0 });
  S.wdraft = ''; S.wn++; next();
}

/* ══ 말하기 화면 ══════════════════════════════════════════════════ */
function sndBtn(id, label) {
  return '<audio id="saud" preload="none" src="/api/lt/audio/' + encodeURIComponent(id) + '.mp3"></audio>'
    + '<button class="play" id="splay" onclick="playS()">' + label + '</button>';
}
function playS() {
  const a = document.getElementById('saud'), b = document.getElementById('splay');
  if (!a || !b) return;
  const keep = b.innerHTML;
  b.disabled = true; b.classList.add('on'); b.innerHTML = '♪ 듣는 중…';
  a.onended = () => { b.disabled = false; b.classList.remove('on'); b.innerHTML = keep; };
  a.onerror = () => { b.disabled = false; b.classList.remove('on'); b.innerHTML = keep; };
  a.currentTime = 0;
  const p = a.play(); if (p && p.catch) p.catch(() => { b.disabled = false; b.classList.remove('on'); b.innerHTML = keep; });
}
function drawSpeak() {
  const it = S.item, band = S.sband, n = S.sitems.length;
  const lim = SMAX[band][it.type];
  const showHint = band === 'A' || band === 'B' || (band === 'C' && S.shint);
  let head;
  if (it.type === 'read') {
    head = '<p class="pos">소리 내어 또박또박 읽어 보세요</p>'
      + (band === 'A' || band === 'B' ? sndBtn(it.id + 'm', '▶ 원어민이 읽는 것 먼저 듣기 <span class="left">힌트 · 몇 번이든</span>') : '')
      + '<p class="gq">' + esc(it.ref) + '</p>'
      + (band === 'A' || band === 'B' ? '<p class="kotip">' + esc(it.ko) + '</p>' : '');
  } else {
    head = sndBtn(it.id + 'q', '▶ 질문 듣기')
      + '<p class="gq" style="margin-bottom:6px">' + esc(it.q) + '</p>'
      + '<p class="kotip">' + esc(it.qko) + '</p>'
      + (it.frame && showHint
          ? '<div class="psg" style="margin:10px 0 0"><p class="pos" style="margin:0 0 4px">이렇게 말해 보세요</p>'
            + '<p class="en" style="font-size:17px">' + esc(it.frame).replace(/___/g, '<u>&nbsp;&nbsp;&nbsp;&nbsp;</u>') + '</p>'
            + (it.hints ? '<p class="pos" style="margin:6px 0 0">쓸 수 있는 낱말 · <b>' + it.hints.map(esc).join(' · ') + '</b></p>' : '') + '</div>'
          : '')
      + (it.frame && band === 'C' && !S.shint
          ? '<p class="small"><a href="#" onclick="S.shint=true;drawSpeak();return false">💡 힌트 보기</a> — 막히면 눌러도 됩니다.</p>' : '')
      + (band === 'D' ? '<p class="small">까닭이나 예를 들어 <b>' + lim + '초 안에</b> 되도록 길게 말해 보세요.</p>' : '');
  }
  const st = S.sdone;
  const recUI = st && st.ok
    ? '<p class="lead" style="text-align:center;color:var(--ok)">✓ 녹음했어요</p>'
      + (S.srec < 2 ? '<p class="small" style="text-align:center"><a href="#" onclick="redoSpeak();return false">다시 녹음하기</a> (한 번 더 할 수 있어요)</p>' : '')
    : '<button class="go" id="recb" onclick="recToggle()" style="background:var(--no)">🎤 녹음 시작 <span style="font-weight:400;font-size:12px">(' + lim + '초까지)</span></button>'
      + (st && st.note ? '<p class="small" style="color:var(--no);text-align:center">' + esc(st.note) + '</p>' : '');
  document.getElementById('app').innerHTML =
    '<div class="card"><div class="meta"><span class="n">말하기 ' + (S.sn + 1) + ' / ' + n + '</span>'
    + '<span>' + (it.type === 'read' ? '따라 읽기' : it.type === 'frame' ? '질문에 답하기' : '생각 말하기') + '</span>'
    + '<span class="t" id="clock"></span></div>' + head
    + '<div id="recbox" style="margin-top:14px">' + recUI + '</div>'
    + '<button class="go" id="nextq" ' + (st && st.ok ? '' : 'disabled') + ' onclick="sendSpeak()">다음</button>'
    + (st && st.ok ? '' : '<p class="small" style="text-align:center;margin-top:10px"><a href="#" onclick="skipSpeak();return false">말할 수 없어요 — 건너뛰기</a></p>')
    + '</div>';
  saveRun('q');
}
let REC = null;
async function recToggle() {
  const b = document.getElementById('recb');
  if (REC && REC.mr && REC.mr.state === 'recording') {
    if (Date.now() - REC.t0 < 700) return;           /* 두 번 눌림 — 1초 만에 끝나는 녹음 막기 */
    return REC.mr.stop();
  }
  if (b) { b.disabled = true; b.innerHTML = '마이크 켜는 중…'; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) {
    S.sdone = { ok: false, note: '마이크를 쓸 수 없어요. 주소창 옆 자물쇠에서 마이크를 「허용」으로 바꾸거나, 선생님께 말해 주세요.' };
    return drawSpeak();
  }
  const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'];
  const mime = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
  const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  const chunks = [];
  const lim = SMAX[S.sband][S.item.type];
  REC = { mr, t0: Date.now() };
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = () => {
    clearInterval(REC.tick); clearTimeout(REC.cut);
    stream.getTracks().forEach(t => t.stop());
    const secs = (Date.now() - REC.t0) / 1000;
    uploadSpeak(new Blob(chunks, { type: mr.mimeType || 'audio/webm' }), secs);
  };
  mr.start();
  if (b) { b.disabled = false; b.style.background = 'var(--ink)'; b.innerHTML = '⏹ 다 말했어요 (끝내기)'; }
  const clk = document.getElementById('clock');
  REC.tick = setInterval(() => { if (clk) clk.textContent = Math.max(0, lim - (Date.now() - REC.t0) / 1000).toFixed(0) + '초 남음'; }, 250);
  REC.cut = setTimeout(() => { if (mr.state === 'recording') mr.stop(); }, lim * 1000);
}
async function uploadSpeak(blob, secs) {
  const box = document.getElementById('recbox');
  if (box) box.innerHTML = '<p class="lead" style="text-align:center">녹음을 보내는 중… 잠깐만요</p>';
  S.srec = (S.srec || 0) + 1;
  try {
    const fd = new FormData();
    fd.append('item', S.item.id); fd.append('audio', blob, 'rec.webm');
    if (S.shint) fd.append('hint', '1');
    const r = await fetch('/api/lt/speak', { method: 'POST', body: fd });
    if (!r.ok) throw new Error(r.status);
    const sc = await r.json();
    if (sc.note && !sc.score) {            /* 소리가 안 잡힘 — 몇 번이든 다시 하게 둔다 */
      S.srec--; S.sdone = { ok: false, note: sc.note };
    } else {
      S.sdone = { ok: true, sc: sc, secs: Math.round(secs) };
    }
  } catch (e) {
    S.srec--;
    S.sdone = { ok: false, note: '녹음을 보내지 못했어요. 인터넷을 확인하고 다시 녹음해 주세요.' };
  }
  drawSpeak();
}
function redoSpeak() { S.sdone = null; drawSpeak(); }
function sendSpeak() {
  if (!S.sdone || !S.sdone.ok) return;
  const it = S.item, sc = S.sdone.sc;
  S.slog.push(Object.assign({ id: it.id, type: it.type, prompt: it.ref || it.q, secs: S.sdone.secs, tries: S.srec }, sc));
  S.sn++; next();
}
function skipSpeak() {
  const it = S.item;
  S.slog.push({ id: it.id, type: it.type, prompt: it.ref || it.q, score: 0, skipped: true, text: '' });
  S.sn++; next();
}
/* 말하기 판정 — 묶음의 두 단계 중 하나, 못하면 한 칸 아래 */
function speakJudge() {
  if (!S.slog || !S.slog.length) return null;
  const avg = S.slog.reduce((a, x) => a + (x.score || 0), 0) / S.slog.length;
  const base = SBASE[S.sband];
  return { lv: Math.max(1, avg >= 70 ? base + 1 : avg >= 45 ? base : base - 1), avg: Math.round(avg) };
}

/* ── 듣기 재생 — 두 번까지. 재생 중엔 버튼을 잠근다(겹쳐 틀면 두 번이 한 번에 사라진다). ── */
function playLabel() {
  const left = H_PLAYS - (S.plays || 0);
  return left > 0 ? '▶ 듣기 <span class="left">' + (S.plays ? '한 번 더 들을 수 있어요' : '두 번까지 들을 수 있어요') + '</span>'
                  : '다 들었어요 <span class="left">답을 고르세요</span>';
}
function playA() {
  const a = document.getElementById('aud'), b = document.getElementById('play');
  if (!a || !b || (S.plays || 0) >= H_PLAYS) return;
  b.disabled = true; b.classList.add('on'); b.innerHTML = '♪ 듣는 중…';
  const done = () => {
    S.plays = (S.plays || 0) + 1;
    b.classList.remove('on'); b.innerHTML = playLabel(); b.disabled = S.plays >= H_PLAYS;
    saveRun('q');
  };
  a.onended = done;
  a.onerror = () => { b.disabled = false; b.classList.remove('on');
                      b.innerHTML = '소리를 못 불러왔어요 — 다시 누르기'; };
  a.currentTime = 0;
  const p = a.play();
  if (p && p.catch) p.catch(() => { b.disabled = false; b.classList.remove('on'); b.innerHTML = playLabel(); });
}
function hLadderHtml() {
  const been = new Set(S.hlog.map(x => x.lv)), cur = S.item.lv;
  return '<div class="ladder">' + HLV.map(l =>
      '<i class="' + (l === cur ? 'here' : been.has(l) ? 'been' : '')
      + '" style="height:' + (l === cur ? 100 : been.has(l) ? 52 : 26) + '%"></i>').join('')
    + '</div><div class="lscale"><span>1단계 · ' + HNAME[HLV[0]] + '</span><span>'
    + HLV[HLV.length - 1] + '단계 · ' + HNAME[HLV[HLV.length - 1]] + '</span></div>';
}
function rLadderHtml() {
  const been = new Set(S.rlog.map(x => x.lv));
  return '<div class="ladder">' + RLV.map(l =>
      '<i class="' + (l === S.psg.lv ? 'here' : been.has(l) ? 'been' : '')
      + '" style="height:' + (l === S.psg.lv ? 100 : been.has(l) ? 52 : 26) + '%"></i>').join('')
    + '</div><div class="lscale"><span>LV1 · 5문장</span><span>LV10 · 18문장</span></div>';
}
function gLadderHtml() {
  const been = new Set(S.glog.map(x => x.gi));
  return '<div class="ladder">' + DLV.map(d =>
      '<i class="' + (d === S.gi ? 'here' : been.has(d) ? 'been' : '')
      + '" style="height:' + (d === S.gi ? 100 : been.has(d) ? 52 : 26) + '%"></i>').join('')
    + '</div><div class="lscale"><span>' + DNAME[DLV[0]] + '</span><span>'
    + DNAME[DLV[DLV.length - 1]] + '</span></div>';
}
let timer = null;
function tick() {
  clearInterval(timer);
  timer = setInterval(() => {
    const el = document.getElementById('clock');
    if (!el) return clearInterval(timer);
    el.textContent = ((performance.now() - S.t0) / 1000).toFixed(1) + '초';
  }, 100);
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

/* ★고르기와 내기를 가른다.
     누르는 순간 채점하고 정답까지 보여 주면 (가) 잘못 누른 걸 못 고치고
     (나) 뒤 문항을 앞 문항에서 배운 걸로 푼다 — 레테가 수업이 되어 버린다.
     시간은 문항이 뜬 때부터 「다음」 을 누른 때까지, 헤아린 시간 전부다. */
function pick(i) {
  S.sel = i;
  document.querySelectorAll('.opt').forEach((b, j) => b.classList.toggle('sel', j === i));
  const go = document.getElementById('nextq');
  if (go) go.disabled = false;
}
/* 라이팅 — 쓴 글자를 그대로 담아 둔다. 비어 있으면 「다음」 을 못 누른다. */
function typed(v) {
  S.sel = v;
  const go = document.getElementById('nextq');
  if (go) go.disabled = !String(v).trim();
}
/* 채점은 대소문자·앞뒤 공백·마침표를 무시한다 — 문법을 재는 것이지 타자를 재는 게 아니다. */
/* 아이패드 키보드는 don't 의 ' 를 둥근 따옴표(’)로 바꿔 넣는다 — 곧은 따옴표로 맞춘다. */
function nrm(s) { return String(s).toLowerCase().trim().replace(/[‘’ʼ`´]/g, "'").replace(/[.,!?]/g, '').replace(/\s+/g, ' '); }
function sendAns() {
  if (S.sel == null || S.sel === '') return;
  if (S.item.t === 'w' && !String(S.sel).trim()) return;
  answer(S.sel);
}
function answer(i) {
  clearInterval(timer);
  const it = S.item, sec = (performance.now() - S.t0) / 1000;
  const w = it.t === 'w';
  const ok = w ? it.a.some(x => nrm(x) === nrm(i)) : i === it.a;
  const chose = w ? String(i).trim() : it.c[i];
  const right = w ? it.a[0] : it.c[it.a];
  document.querySelectorAll('.opt').forEach(b => b.disabled = true);
  const wb = document.getElementById('wans'); if (wb) wb.disabled = true;
  if (S.phase === 'vocab') {
    S.log.push({ w: it.w, k: it.k, rung: it.rung, ri: S.ri, ok: ok, sec: sec, chose: chose });
    S.n++; if (ok) S.ok++;
    placeUpd(S.vp, S.ri, ok);
    S.ri = stepTo(S.ri, placeAsk(S.vp), V_CAP, ok ? 1 : -1);
  } else if (S.phase === 'gram') {
    S.glog.push({ q: it.q, ko: it.ko || '', wr: w, gi: S.gi, g: it.g,
                  name: GLAB[it.g].name, ch: GLAB[it.g].ch,
                  ok: ok, sec: sec, chose: chose, right: right });
    S.gn++; if (ok) S.gok++;
    /* 2026-10-27 — 독해와 같은 방식: 판정은 확률(PLACE), 움직임은 한 문항에 한 단계까지.
       2연속 규칙에 걸음 1 을 쓰니 10문항으로는 시작 학년을 못 벗어났다(만점 초2 → 4단계). */
    placeUpd(S.gp, S.gi, ok);
    S.gi = stepTo(S.gi, placeAsk(S.gp), G_CAP, ok ? 1 : -1);
  } else if (S.phase === 'listen') {
    /* 판정 칸은 '지금 칸(S.hl)', 문항은 빌려 온 단계일 수 있다 — 확률은 실제로 들은 문항 단계로 고친다 */
    S.hlog.push({ id: it.id, lv: it.lv, q: it.q, ok: ok, sec: sec, chose: chose, right: right, plays: S.plays || 0 });
    S.hn++; if (ok) S.hok++;
    placeUpd(S.hp, it.lv, ok);
    S.hl = stepTo(S.hl, placeAsk(S.hp), H_CAP, ok ? 1 : -1);
  }
  if (S.phase === 'read') {
    S.rlog.push({ lv: S.psg.lv, t: S.psg.t, q: it.q, ok: ok, sec: sec,
                  chose: chose, right: right });
    if (ok) { S.rok++; S.pgot++; }
    placeUpd(S.rpl, S.psg.lv, ok);
    S.rq++;
    if (S.rq >= 2) {                        /* 한 편을 다 풀었다 — 다음 글은 지금 가장 그럴 법한 LV 에서 */
      S.rq = 0; S.rp++;
      S.rlv = stepTo(S.psg.lv, placeAsk(S.rpl), R_CAP, S.pgot === 2 ? 1 : S.pgot === 0 ? -1 : 0);
    }
  }
  next();
}

function result() {
  clearRun();   /* 끝난 시험은 이어 할 것이 없다 */
  /* ★단어·독해 판정 = 열에 일곱을 아는 칸(PLACE). 지나온 칸의 가운데값이 아니다. */
  const ri = S.log.length ? placeJudge(S.vp) : null;
  /* 문장 만들기도 '맞힌 가장 높은 단계 + 1' 을 넘지 않는다 */
  const gOk = S.glog.filter(x => x.ok).map(x => x.gi);
  const gi = S.glog.length
    ? Math.min(placeJudge(S.gp), gOk.length ? Math.max.apply(null, gOk) + 1 : 1) : null;
  /* 독해 판정은 '한 문항이라도 맞힌 가장 높은 LV + 1' 을 넘지 않는다 — 읽어 보지도 않은 글 수준으로 올려 주지 않는다 */
  const rOkLv = S.rlog.filter(x => x.ok).map(x => x.lv);
  const rl = S.rlog.length
    ? Math.min(placeJudge(S.rpl), rOkLv.length ? Math.max.apply(null, rOkLv) + 1 : 1) : null;
  /* 듣기도 같은 규칙 — 확률 판정, '맞힌 가장 높은 단계 + 1' 을 넘지 않는다 */
  const hl = listenJudge();
  const sj = speakJudge();
  const wj = writeJudge();
  const all = S.log.concat(S.hlog, S.glog, S.rlog);
  const secs = all.map(x => x.sec).sort((a, b) => a - b);
  const med = secs.length ? secs[Math.floor(secs.length / 2)] : 0;
  const tot = all.reduce((a, b) => a + b.sec, 0);

  /* ★시간으로 다시 보기 — 본인 중앙값을 잣대로 쓴다.
     남과 견주면 원래 느린 아이가 벌을 받는다. 자기 안에서 갈라야 공평하다. */
  const okAll = all.filter(x => x.ok);
  const solid = okAll.filter(x => x.sec < med).length;      /* 빠르고 맞힘 = 굳은 것 */
  const effort = okAll.length - solid;                       /* 느리고 맞힘 = 헤아린 것 */
  const guess = all.filter(x => !x.ok && x.sec < 3).length;  /* 3초 미만 오답 = 안 읽고 찍음 */
  const half = Math.floor(all.length / 2);
  const acc1 = half ? all.slice(0, half).filter(x => x.ok).length / half * 100 : 0;
  const acc2 = (all.length - half) ? all.slice(half).filter(x => x.ok).length / (all.length - half) * 100 : 0;

  /* 판정 칸에서 맞힌 것이 대부분 '헤아려 맞힌 것' 이면 그 칸은 아직 자리가 아니다 */
  const atTop = S.log.filter(x => x.ri === ri && x.ok);
  const topEffort = atTop.filter(x => x.sec >= med).length;
  const shaky = atTop.length >= 2 && topEffort / atTop.length > 0.6;

  const R = {
    grade: S.grade, ts: new Date().toISOString().slice(0, 10), m: 3,
    v: ri, g: gi, r: rl, h: hl, s: sj ? sj.lv : null, sAvg: sj ? sj.avg : null, sBand: S.sband || null,
    w: wj ? wj.lv : null, wPending: wj ? wj.pending : false, wBand: S.wband || null,
    ok: S.ok + S.hok + S.gok + S.rok, n: all.length,
    med: Math.round(med * 10) / 10, tot: Math.round(tot),
    solid: solid, effort: effort, guess: guess
  };

  document.getElementById('app').innerHTML = '<div class="card">'
    + '<p class="who2">' + (S.name ? '<b>' + esc(S.name) + '</b> · ' : '')
    + S.grade + ' · ' + R.ts + '</p>'
    + '<dl class="three">'
    + '<div><dt>단어</dt><p class="lv">' + (ri == null ? '—' : (ri + 1) + '칸') + '</p>'
    + '<p class="cap">' + (ri == null ? '' : BOOK(WALK[ri]) + '<br>') + S.ok + ' / ' + S.log.length + '</p></div>'
    + '<div><dt>듣기</dt><p class="lv">' + (hl == null ? '—' : hl + '단계') + '</p>'
    + '<p class="cap">' + (hl == null ? '' : HNAME[hl] + '<br>') + S.hok + ' / ' + S.hlog.length + '</p></div>'
    + '<div><dt>문장 만들기</dt><p class="lv">' + (gi == null ? '—' : gi + '단계') + '</p>'
    + '<p class="cap">' + (gi == null ? '' : DNAME[gi] + '<br>') + S.gok + ' / ' + S.glog.length + '</p></div>'
    + '<div><dt>독해</dt><p class="lv">' + (rl == null ? '—' : 'LV' + rl) + '</p>'
    + '<p class="cap">' + S.rok + ' / ' + S.rlog.length + '</p></div>'
    + '<div><dt>쓰기</dt><p class="lv">' + (wj == null ? '—' : wj.lv + '단계' + (wj.pending ? '<span style="font-size:12px"> 잠정</span>' : '')) + '</p>'
    + '<p class="cap">' + (wj == null ? '' : S.wband + '묶음' + (S.wlog.some(x => x.type === 'order') ? ' · 카드 ' + wj.ord : '')
        + (wj.pending ? '<br>글은 선생님 채점 뒤 확정' : '')) + '</p></div>'
    + '<div><dt>말하기</dt><p class="lv">' + (sj == null ? '—' : sj.lv + '단계') + '</p>'
    + '<p class="cap">' + (sj == null ? '' : S.sband + '묶음 · 평균 ' + sj.avg + '점') + '</p></div></dl>'
    + '<p class="small" style="margin:-6px 0 14px;text-align:center">'
    + '영역마다 자가 다릅니다 — 단어 <b>1~' + WALK.length + '칸</b>(LV2·1권 ~ LV15·4권) · 듣기 <b>1~' + HLV.length + '단계</b> · 문장 만들기 <b>1~' + DLV.length + '단계</b> · 독해 <b>LV1~LV10</b></p>'
    + (function () {
        const miss = [...new Set(S.glog.filter(x => !x.ok).map(x => x.name + (x.ch ? ' (' + x.ch + ')' : '')))];
        return '<p class="small" style="margin:-10px 0 16px;text-align:center">'
          + (miss.length ? '문장 만들기에서 막힌 자리 — ' + miss.join(' · ') : '문장 만들기에서 막힌 자리가 없었습니다') + '</p>';
      })()

    + '<h2>시간이 말해 주는 것</h2>'
    + '<p>맞힌 문항을 <b>본인 중앙값(' + med.toFixed(1) + '초)</b> 으로 가릅니다. 남과 견주면 원래 느린 아이가 벌을 받습니다.</p>'
    + '<dl class="solid">'
    + '<div class="a"><dt>빠르고 맞힘 — 굳은 것</dt><dd>' + solid + '문항</dd></div>'
    + '<div class="b"><dt>느리고 맞힘 — 헤아린 것</dt><dd>' + effort + '문항</dd></div></dl>'
    + '<div class="verdict2">'
    + (shaky
        ? '판정 칸 <b>' + (ri + 1) + '칸(' + BOOK(WALK[ri]) + ')</b> 에서 맞힌 것이 대부분 <b>헤아려 맞힌 것</b>입니다. '
          + '아는 자리가 아직 굳지 않았습니다 — <b>수업은 한 칸 아래에서 시작</b>하는 편이 낫습니다.'
        : '판정 칸에서 맞힌 것이 <b>대체로 빨랐습니다</b>. 그 자리는 굳었다고 봐도 됩니다.')
    + (guess ? '<br>3초도 안 되어 틀린 문항이 <b>' + guess + '개</b> — 읽지 않고 찍은 자리입니다.' : '')
    + '<br>전반부 정답률 <b>' + acc1.toFixed(0) + '%</b> → 후반부 <b>' + acc2.toFixed(0) + '%</b>'
    + (acc2 < acc1 - 20 ? ' — 뒤로 갈수록 떨어집니다. 집중이 오래 가지 않았습니다.' : '')
    + '</div>'

    + '<h2>또래와 견주면</h2><p>같은 학년 · 같은 판정을 받은 학생들과 견줍니다.</p>'
    + '<div class="rank" id="rank"><div class="none">응시 기록을 불러오는 중…</div></div>'

    + '<h2>단어 — 사다리가 어떻게 움직였나</h2><p>답 하나마다 가장 그럴 법한 자리를 다시 어림해 그 칸에서 다음 낱말을 냅니다. 판정 칸은 열에 일곱을 아는 자리 — 지나온 칸 중 가장 높은 곳보다 낮게 나올 수 있습니다.</p>'
    + '<div class="tbl"><table><thead><tr><th></th><th>낱말</th><th>칸</th><th>고른 뜻</th><th class="r">초</th></tr></thead><tbody>'
    + S.log.map(x => '<tr><td><span class="mark ' + (x.ok ? 'o">O' : 'x">X') + '</span></td>'
        + '<td class="w">' + esc(x.w) + '</td><td>' + LABEL(x.rung) + '</td>'
        + '<td>' + esc(x.ok ? x.k : x.chose + ' → ' + x.k) + '</td>'
        + '<td class="r">' + x.sec.toFixed(1) + '</td></tr>').join('')
    + '</tbody></table></div>'
    + '<h2>듣기 — 어느 단계까지 알아들었나</h2><p>들은 횟수도 함께 적습니다. 두 번 듣고 맞힌 것은 아직 굳지 않은 자리입니다.</p>'
    + '<div class="tbl"><table><thead><tr><th></th><th>단계</th><th>물음</th><th>고른 답</th><th class="r">들음</th><th class="r">초</th></tr></thead><tbody>'
    + S.hlog.map(x => '<tr><td><span class="mark ' + (x.ok ? 'o">O' : 'x">X') + '</span></td>'
        + '<td>' + x.lv + '단계</td><td>' + esc(x.q.length > 22 ? x.q.slice(0, 22) + '…' : x.q) + '</td>'
        + '<td>' + esc(x.ok ? x.right : x.chose + ' → ' + x.right) + '</td>'
        + '<td class="r">' + x.plays + '번</td><td class="r">' + x.sec.toFixed(1) + '</td></tr>').join('')
    + '</tbody></table></div>'
    + (S.wlog && S.wlog.length
      ? '<h2>쓰기 — 만든 문장과 쓴 글</h2><p>카드 문장은 바로 채점하고, 쓴 글은 선생님이 내용·문법·어휘로 채점합니다.</p>'
        + '<div class="tbl"><table><thead><tr><th></th><th>문항</th><th>학생 답</th></tr></thead><tbody>'
        + S.wlog.map(x => '<tr><td>' + (x.type === 'order' ? '<span class="mark ' + (x.ok ? 'o">O' : 'x">X') + '</span>' : '<span class="tag">글</span>') + '</td>'
            + '<td>' + esc(x.type === 'order' ? x.ko : x.q) + '</td>'
            + '<td class="w">' + (x.skipped ? '<span class="ko">건너뜀</span>'
                : x.type === 'order' ? esc(x.made) + (x.ok ? '' : '<br><span class="ko">→ ' + esc(x.ans) + '</span>')
                : esc(x.text) + ' <span class="ko">(' + x.words + '낱말)</span>') + '</td></tr>').join('')
        + '</tbody></table></div>' : '')
    + (S.slog && S.slog.length
      ? '<h2>말하기 — 무엇을 어떻게 말했나</h2><p>들린 말은 기계가 받아 적은 것이라 정확하지 않을 수 있습니다. 녹음은 선생님 화면에서 다시 들을 수 있습니다.</p>'
        + '<div class="tbl"><table><thead><tr><th>유형</th><th>문항</th><th>들린 말</th><th class="r">점수</th></tr></thead><tbody>'
        + S.slog.map(x => '<tr><td>' + (x.type === 'read' ? '따라 읽기' : '답하기') + (x.hint ? ' <span class="tag">힌트</span>' : '') + '</td>'
            + '<td class="w">' + esc((x.prompt || '').length > 40 ? x.prompt.slice(0, 40) + '…' : x.prompt) + '</td>'
            + '<td>' + (x.skipped ? '<span class="ko">건너뜀</span>' : esc(x.text || '—')) + '</td>'
            + '<td class="r">' + (x.score == null ? '—' : x.score) + '</td></tr>').join('')
        + '</tbody></table></div>' : '')
    + '<h2>문장 만들기 — 어디서 막혔나</h2><p>틀린 주제가 다음에 손볼 자리입니다.</p>'
    + '<div class="tbl"><table><thead><tr><th></th><th>주제</th><th>문항</th><th>고른 답</th><th class="r">초</th></tr></thead><tbody>'
    + S.glog.map(x => '<tr><td><span class="mark ' + (x.ok ? 'o">O' : 'x">X') + '</span></td>'
        + '<td>' + esc(x.name) + '</td>'
        + '<td class="w">' + (x.wr ? '<span class="tag">쓰기</span> ' : '')
        + (x.ko ? '<span class="ko">' + esc(x.ko) + '</span><br>' : '')
        + esc(x.q.replace(/____/g, '___')) + '</td>'
        + '<td>' + esc(x.ok ? x.right : x.chose + ' → ' + x.right) + '</td>'
        + '<td class="r">' + x.sec.toFixed(1) + '</td></tr>').join('')
    + '</tbody></table></div>'
    + '<h2>독해 — 어느 길이까지 읽어 냈나</h2><p>한 편을 둘 다 맞히면 더 긴 글로 올라갑니다.</p>'
    + '<div class="tbl"><table><thead><tr><th></th><th>LV</th><th>지문</th><th>물음</th><th class="r">초</th></tr></thead><tbody>'
    + S.rlog.map(x => '<tr><td><span class="mark ' + (x.ok ? 'o">O' : 'x">X') + '</span></td>'
        + '<td>LV' + x.lv + '</td><td class="w">' + esc(x.t) + '</td>'
        + '<td>' + esc(x.q.length > 22 ? x.q.slice(0, 22) + '…' : x.q) + '</td>'
        + '<td class="r">' + x.sec.toFixed(1) + '</td></tr>').join('')
    + '</tbody></table></div>'
    + '<button class="go" onclick="home()">다시 하기</button></div>';
  window.scrollTo(0, 0);
  cohort(R);
}

/* ── 결과 저장 + 또래와 견주기 ──
   결과는 트리톡 서버(/api/lt/result)에 이름·답안까지 통째로 남긴다 — 선생님이 관리자 화면에서 다시 본다.
   또래 견주기(/api/lt/peers)는 이름·답안 없이 판정 숫자만 받아 온다.
   서버가 안 되면 이 자리만 비운다 — 판정과 시간은 화면에 그대로 있다. */
const IS_TEST = /[?&]test=1/.test(location.search);   /* 시험 삼아 본 것 — 또래 견주기에서 뺀다 */
async function cohort(R) {
  const box = document.getElementById('rank');
  const full = Object.assign({}, R, {
    name: S.name || '', test: IS_TEST,
    vocab: S.log.map(x => ({ w: x.w, ri: x.ri, ok: x.ok, sec: Math.round(x.sec * 10) / 10, chose: x.chose })),
    listen: S.hlog, gram: S.glog.map(x => ({ g: x.g, gi: x.gi, q: x.q, ok: x.ok, sec: Math.round(x.sec * 10) / 10, chose: x.chose })),
    read: S.rlog.map(x => ({ lv: x.lv, t: x.t, q: x.q, ok: x.ok, sec: Math.round(x.sec * 10) / 10, chose: x.chose })),
    write: S.wlog || [],
    speak: S.slog || []
  });
  let rows = [];
  try {
    const sv = await fetch('/api/lt/result', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(full) });
    if (!sv.ok) throw new Error('save ' + sv.status);
    if (LT_AP) { let rid = ''; try { rid = (await sv.clone().json()).rid || ''; } catch (e) {} ltEng(R, rid); }   /* 🧪 레벨테스트 포털로 */
    const res = await fetch('/api/lt/peers');
    /* 판정 방식이 바뀌면 m 을 올린다 — 옛 방식 기록과 섞으면 칸의 뜻이 달라 견주기가 틀어진다 */
    rows = ((await res.json()).rows || []).filter(x => x.m === 3);
  } catch (e) {
    if (LT_AP && !ltSent) ltEng(R, '');
    box.innerHTML = '<div class="none">응시 기록을 서버에 남기지 못했습니다 — 판정과 시간은 위에 그대로 있습니다. 화면을 캡처해 두세요.</div>';
    return;
  }
  const same = rows.filter(x => x.grade === R.grade);
  /* 상위% = 나보다 나은 사람 수 + 1 을 인원으로 나눈 값(문해숨·수학숨 성적표와 같은 규칙) */
  const pct = (list, key, big) => {
    const v = list.map(x => x[key]).filter(x => x != null);
    if (v.length < 2) return null;
    const better = v.filter(x => big ? x > R[key] : x < R[key]).length;
    return Math.ceil((better + 1) / v.length * 100);
  };
  const line = (name, key, big, unit) => {
    const a = pct(rows, key, big), b = pct(same, key, big);
    return '<tr><td>' + name + '</td>'
      + '<td class="p">' + (b == null ? '—' : '상위 ' + b + '%') + '</td>'
      + '<td class="p">' + (a == null ? '—' : '상위 ' + a + '%') + '</td>'
      + '<td class="r">' + (R[key] == null ? '—' : R[key] + (unit || '')) + '</td></tr>';
  };
  /* 같은 판정을 받은 학생들 안에서 시간 순위 — "같은 레벨을 친 아이들 중 나는" */
  const peers = rows.filter(x => x.v === R.v);
  const tv = peers.map(x => x.med).filter(x => x != null);
  const tRank = tv.length < 2 ? null
    : Math.ceil((tv.filter(x => x < R.med).length + 1) / tv.length * 100);

  box.innerHTML = '<table><thead><tr><th>영역</th><th>동학년 (' + same.length + '명)</th>'
    + '<th>전체 (' + rows.length + '명)</th><th class="r">내 값</th></tr></thead><tbody>'
    + line('단어 칸', 'v', true) + line('듣기 단계', 'h', true) + line('문장 만들기 단계', 'g', true) + line('독해 LV', 'r', true)
    + line('쓰기 단계(잠정)', 'w', true) + line('말하기 단계', 's', true)
    + line('맞힌 수', 'ok', true, '개')
    + '<tr><td>문항당 시간</td><td class="p">' + (tRank == null ? '—' : '같은 판정 안에서 상위 ' + tRank + '%')
    + '</td><td class="p">' + (pct(rows, 'med', false) == null ? '—' : '상위 ' + pct(rows, 'med', false) + '%')
    + '</td><td class="r">' + R.med + '초</td></tr>'
    + '</tbody></table>'
    + (rows.length < 5 ? '<div class="none">아직 응시 기록이 ' + rows.length + '명뿐입니다 — '
        + '쌓일수록 상위%가 정확해집니다.</div>' : '');
}


/* ══ 🧪 레벨테스트 포털(test.happytreeacademy.com)에서 열렸을 때 — ?ap=응시자 아이디 (2026-10-29) ══
   포털에서 이름·학년을 받아 바로 시작하고(초1은 초2 문제로), 끝나면 영역마다 문항별 수준·정오·걸린 시간·
   들은 횟수를 보낸다. 리포트(포털 report.js)가 실수한 자리·틀린 유형·처리 속도·푸는 스타일을 판단한다.
   쓰기 글은 여기서 잠정 — 확정은 채점 화면(rid 를 같이 보내 둔다). */
const LT_PORTAL = 'https://test.happytreeacademy.com';
const LT_AP = (function () { try { return (new URLSearchParams(location.search).get('ap') || '').replace(/[^a-z0-9]/gi, '').slice(0, 16); } catch (e) { return ''; } })();
let ltBooted = false, ltSent = false;
function ltSaved(ok) { const el = document.getElementById('lt-saved'); if (el) el.innerHTML = ok ? '✓ 결과가 선생님께 전달됐어요' : '⚠️ 결과를 보내지 못했어요 — 선생님께 말씀해 주세요'; }
function ltPost(kind, data, tries) {
  tries = tries || 0;
  fetch(LT_PORTAL + '/api/result', { method: 'POST', headers: { 'content-type': 'text/plain' }, body: JSON.stringify({ ap: LT_AP, kind: kind, data: data }) })
    .then(r => { if (!r.ok) throw 0; ltSaved(true); })
    .catch(() => { if (tries < 3) setTimeout(() => ltPost(kind, data, tries + 1), 1500 * (tries + 1)); else ltSaved(false); });
}
function ltStrip(h) { const d = document.createElement('div'); d.innerHTML = String(h == null ? '' : h); return (d.textContent || '').replace(/\s+/g, ' ').trim(); }
function ltEngBoot() {
  fetch(LT_PORTAL + '/api/ap?id=' + LT_AP, { cache: 'no-store' }).then(r => r.json()).then(r => {
    if (!r || !r.ok) throw 0;
    const o = loadRun();
    if (o && o.ap !== LT_AP) clearRun();          /* 이 기기에 다른 학생이 하다 만 시험 — 지운다 */
    if (loadRun()) return home();                 /* 이 학생이 하다 만 시험 — 이어 하기 */
    let g = r.grade === '초1' ? '초2' : r.grade;
    if (!START[g]) g = Object.keys(START)[0];
    start(g); S.name = r.name; S.ap = LT_AP; saveRun('q');
  }).catch(() => { alert('응시 정보를 찾지 못했어요. 레벨테스트 포털에서 다시 열어 주세요.'); location.href = LT_PORTAL; });
}
function ltEng(R, rid) {
  ltSent = true;
  const card = document.querySelector('#app .card');
  if (card && !document.getElementById('lt-saved')) card.insertAdjacentHTML('afterbegin',
    '<div style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#eef4ff;border:1.5px solid #c9d8f5;border-radius:12px;padding:12px 14px;margin-bottom:14px;">'
    + '<span id="lt-saved" style="font-weight:700;color:#16305c;">결과를 선생님께 보내는 중…</span>'
    + '<a href="' + LT_PORTAL + '/?ap=' + LT_AP + '" style="padding:10px 16px;background:#16305c;color:#fff;border-radius:9px;font-weight:800;text-decoration:none;">🧪 레벨테스트 목록으로</a></div>');
  const r1 = x => Math.round((x || 0) * 10) / 10;
  let n = 0;
  const items = []
    .concat(S.log.map(x => ({ n: ++n, area: '단어', type: (x.ri + 1) + '칸', lv: x.ri, ok: x.ok ? 1 : 0, t: r1(x.sec), q: ltStrip(x.w), my: ltStrip(x.chose), ans: ltStrip(x.k) })))
    .concat(S.hlog.map(x => ({ n: ++n, area: '듣기', type: x.lv + '단계', lv: x.lv, ok: x.ok ? 1 : 0, t: r1(x.sec), plays: x.plays || 1, q: ltStrip(x.q).slice(0, 70), my: ltStrip(x.chose), ans: ltStrip(x.right) })))
    .concat(S.glog.map(x => ({ n: ++n, area: '문장', type: ltStrip(x.name) + (x.ch ? ' (' + ltStrip(x.ch) + ')' : ''), lv: x.gi, ok: x.ok ? 1 : 0, t: r1(x.sec), wr: x.wr ? 1 : 0, q: ltStrip(x.q).slice(0, 70), my: ltStrip(x.chose), ans: ltStrip(x.right) })))
    .concat(S.rlog.map(x => ({ n: ++n, area: '독해', type: 'LV' + x.lv, lv: x.lv, ok: x.ok ? 1 : 0, t: r1(x.sec), q: ltStrip(x.t) + ' — ' + ltStrip(x.q).slice(0, 50), my: ltStrip(x.chose) })));
  const speak = (S.slog || []).map(x => ({ type: x.type, score: x.score == null ? null : x.score, skipped: x.skipped ? 1 : 0, hint: x.hint ? 1 : 0, text: ltStrip(x.text).slice(0, 80), prompt: ltStrip(x.prompt).slice(0, 60) }));
  const write = (S.wlog || []).map(x => ({ type: x.type, ok: x.type === 'order' ? (x.ok ? 1 : 0) : null, skipped: x.skipped ? 1 : 0, words: x.words || 0, text: ltStrip(x.type === 'order' ? x.made : x.text).slice(0, 160), q: ltStrip(x.type === 'order' ? x.ko : x.q).slice(0, 60) }));
  ltPost('eng', { v: 1, test: '영어 4영역 ' + R.grade, grade: R.grade, rid: rid,
    v_: R.v, h: R.h, g: R.g, r: R.r, w: R.w, s: R.s, sAvg: R.sAvg, sBand: R.sBand, wBand: R.wBand, wPending: R.wPending,
    max: { v: WALK.length, h: HLV.length, g: DLV.length, r: 10 },
    names: { v: R.v == null ? '' : ltStrip(BOOK(WALK[R.v])), h: R.h == null ? '' : ltStrip(HNAME[R.h]), g: R.g == null ? '' : ltStrip(DNAME[R.g]) },
    ok: R.ok, n: R.n, med: R.med, tot: R.tot, solid: R.solid, effort: R.effort, guess: R.guess,
    items: items, speak: speak, write: write });
}

/* ══ 중간 저장 — 새로고침·뒤로 가기·태블릿 잠금으로 튕겨도 그 문항부터 이어 한다 ══
   이 기기 브라우저에만 둔다(다른 기기·다른 사람에겐 안 보인다). 하루 지나면 버린다.
   보는 중이던 문항은 시간을 처음부터 다시 잰다 — 자리를 비운 시간이 풀이 시간에 섞이지 않게. */
const RUN_KEY = 'ht_englt_run_v2';   /* 서버판(듣기 포함) — 아티팩트판 저장(v1)과 섞이지 않게 */
function saveRun(view) {
  if (!S) return;
  try {
    localStorage.setItem(RUN_KEY, JSON.stringify(Object.assign({}, S,
      { used: [...S.used], gused: [...S.gused], rused: [...S.rused], hused: [...S.hused], view: view, at: Date.now() })));
  } catch (e) {}
}
function loadRun() {
  try {
    const o = JSON.parse(localStorage.getItem(RUN_KEY) || 'null');
    if (!o || !o.at || Date.now() - o.at > 24 * 3600 * 1000) return null;
    if (!o.gp || !o.vp || !o.rpl || !o.hp) return null;   /* 판정 방식이 바뀌기 전 저장 — 이어 할 수 없다 */
    o.used = new Set(o.used); o.gused = new Set(o.gused); o.rused = new Set(o.rused); o.hused = new Set(o.hused);
    return o;
  } catch (e) { return null; }
}
function clearRun() { try { localStorage.removeItem(RUN_KEY); } catch (e) {} }
function resumeRun() {
  const o = loadRun();
  if (!o) return home();
  S = o;
  if (o.view === 'bridge' || !S.item) return bridge();
  if (S.phase === 'speak') { S.sdone = S.sdone && S.sdone.ok ? S.sdone : null; return drawSpeak(); }
  if (S.phase === 'write') { S.t0 = performance.now(); return drawWrite(); }
  draw();
}
function freshRun() { clearRun(); home(); }
function runWhere(o) {
  return o.phase === 'vocab' ? '단어 ' + (o.n + 1) + ' / ' + N_VOCAB + '번'
       : o.phase === 'listen' ? '듣기 ' + (o.hn + 1) + ' / ' + N_LISTEN + '번'
       : o.phase === 'speak' ? '말하기 ' + ((o.sn || 0) + 1) + '번'
       : o.phase === 'write' ? '쓰기 ' + ((o.wn || 0) + 1) + '번'
       : o.phase === 'gram'  ? '문장 만들기 ' + (o.gn + 1) + ' / ' + N_GRAM + '번'
       : '독해 ' + (o.rp + 1) + ' / ' + N_PSG + '편';
}

function home() {
  if (LT_AP && !ltBooted) { ltBooted = true; return ltEngBoot(); }
  const o = loadRun();
  if (o) {
    document.getElementById('app').innerHTML =
      '<div class="card"><p class="lead">하다 만 시험이 있습니다.</p>'
      + '<p class="small"><b>' + (o.name ? esc(o.name) : '이름 없음') + '</b> · ' + o.grade
      + ' · <b>' + runWhere(o) + '</b> 차례에서 멈췄습니다.</p>'
      + '<button class="go" onclick="resumeRun()">이어 하기</button>'
      + '<p class="small" style="text-align:center;margin-top:12px">'
      + '<a href="#" onclick="freshRun();return false">처음부터 새로 하기</a> — 멈춘 시험은 지워집니다.</p></div>';
    return;
  }
  document.getElementById('app').innerHTML =
    '<div class="card"><p class="lead">이름을 적고 학년을 고르면 시작합니다.</p>'
    + '<input class="name" id="who" placeholder="학생 이름" autocomplete="off">'
    + '<p class="small">시작 칸은 어림잡은 값입니다 — 틀려도 시험이 알아서 찾아갑니다. '
    + '단어 ' + N_VOCAB + '문항 · 듣기 ' + N_LISTEN + '문항 · 문장 만들기 ' + N_GRAM + '문항 · 독해 ' + N_PSG + '편 · 쓰기 2~3문항 · 말하기 3~5문항 (모두 40분 안팎) — 이어폰과 마이크를 준비해 주세요. 맞힌 만큼 어려워지고, 틀린 만큼 쉬워집니다. 중간에 화면이 꺼져도 이 기기에서 이어 할 수 있습니다.</p>'
    + '<div class="pick">' + Object.keys(START).map(g =>
        '<button onclick="begin(\'' + g + '\')">' + g + '</button>').join('') + '</div>'
    + '<p class="small">낱말은 해피트리 단어급수 교재에서 그대로 나옵니다. '
    + '오답 보기는 같은 급수·같은 품사에서 뽑아, 뜻을 몰라도 품사로 답이 좁혀지지 않게 했습니다.</p>'
    + '<p class="small">결과는 학원 선생님만 볼 수 있게 저장됩니다. 또래 견주기에는 이름 없이 숫자만 쓰입니다.</p></div>';
  const w = document.getElementById('who');
  if (w) w.focus();
}
/* 이름을 받아 두고 시작한다. 안 적어도 막지는 않는다 — 시험을 못 보게 할 일은 아니다. */
function begin(grade) {
  const w = document.getElementById('who');
  const name = (w && w.value || '').trim();
  start(grade);
  S.name = name;
  saveRun('q');
}
home();
</script>
</body></html>
