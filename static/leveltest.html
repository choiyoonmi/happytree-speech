<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 트리톡 서버판 (2026-10-27~). 아티팩트판 adaptive-template.html 에서 갈라져 나왔다 —
     듣기·말하기·쓰기를 넣으려고(마이크·채점 서버가 필요). 빌드: build-server.py -->
<title>영어 레벨테스트</title>
<link rel="icon" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  --ink:#1B2430; --ink2:#46505E; --ink3:#79838F;
  --ground:#FBFAF7; --surface:#FFFFFF; --sunk:#F4F2ED;
  --line:#E4E0D8; --line2:#EFEDE7;
  --acc:#1C6FA8; --acc-bg:#EAF2F8;
  --ok:#2F7D5B; --ok-bg:#E9F2EE; --no:#B4472E; --no-bg:#FBEDE9;
  --sans:'IBM Plex Sans KR',system-ui,sans-serif;
  --serifko:'Gowun Batang','IBM Plex Sans KR',serif;
  --serifen:'Source Serif 4',Georgia,serif;
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
  --ink:#EDEAE3; --ink2:#B6BDC6; --ink3:#8A939D;
  --ground:#14181D; --surface:#1B2026; --sunk:#222831;
  --line:#333B45; --line2:#272E36;
  --acc:#6DB2E0; --acc-bg:#152430;
  --ok:#7CC4A2; --ok-bg:#15251E; --no:#E08C74; --no-bg:#2B1A16;
}}
:root[data-theme="dark"]{
  --ink:#EDEAE3; --ink2:#B6BDC6; --ink3:#8A939D;
  --ground:#14181D; --surface:#1B2026; --sunk:#222831;
  --line:#333B45; --line2:#272E36;
  --acc:#6DB2E0; --acc-bg:#152430;
  --ok:#7CC4A2; --ok-bg:#15251E; --no:#E08C74; --no-bg:#2B1A16;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.6;
     -webkit-font-smoothing:antialiased}
.wrap{max-width:660px;margin:0 auto;padding:28px 20px 70px}
h1{font-family:var(--serifko);font-size:25px;font-weight:700;margin:0;letter-spacing:-.01em}
.sub{font-size:12.5px;color:var(--ink3);margin:3px 0 0}
.head{padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:20px}

/* ── 사다리 (왼쪽 눈금) ── */
.ladder{display:flex;gap:3px;align-items:flex-end;height:34px;margin:0 0 4px}
.ladder i{flex:1;background:var(--line2);border-radius:2px 2px 0 0;transition:height .25s,background .25s}
.ladder i.here{background:var(--acc)}
.ladder i.been{background:var(--acc-bg)}
.lscale{display:flex;justify-content:space-between;font-size:10px;color:var(--ink3);
        letter-spacing:.03em;margin-bottom:18px}

/* ── 카드 ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:22px}
.meta{display:flex;align-items:baseline;gap:10px;font-size:11.5px;color:var(--ink3);margin-bottom:16px}
.meta .n{font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.meta .t{margin-left:auto;font-variant-numeric:tabular-nums}
.gq{font-family:var(--serifen);font-size:19px;line-height:1.65;margin:0 0 20px}
.gq.rq{font-family:var(--sans);font-size:15.5px;font-weight:500;margin:16px 0 16px}
/* 지문은 줄글로 — 문장마다 번호를 달면 '몇 번을 보라'는 힌트가 된다 */
.psg{background:var(--sunk);border-radius:11px;padding:16px 18px;margin:0}
.psg .en{font-family:var(--serifen);font-size:15.5px;line-height:1.78;margin:0;text-align:justify}
.rank{border:1px solid var(--line);border-radius:11px;padding:0;margin:0 0 18px;overflow:hidden}
.rank table{font-size:13px}
.rank th,.rank td{padding:9px 11px}
.rank thead th{background:var(--sunk);border-bottom:1px solid var(--line)}
.rank td.p{font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.rank .none{padding:13px;font-size:12.5px;color:var(--ink3);text-align:center}
.solid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 6px}
.solid>div{border-radius:10px;padding:12px 14px}
.solid .a{background:var(--ok-bg)} .solid .b{background:var(--no-bg)}
.solid dt{font-size:11px;color:var(--ink3);margin:0 0 3px}
.solid dd{margin:0;font-size:15px;font-weight:600}
.solid .a dd{color:var(--ok)} .solid .b dd{color:var(--no)}
.verdict2{font-size:13px;color:var(--ink2);background:var(--sunk);border-radius:9px;
          padding:11px 14px;margin:0 0 18px;line-height:1.6}
.verdict2 b{color:var(--ink)}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;margin:0 0 18px}
/* ── 듣기 ── */
.play{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:0 0 18px;
      padding:16px;font:inherit;font-size:16px;font-weight:600;border-radius:12px;cursor:pointer;
      background:var(--acc-bg);color:var(--acc);border:1.5px solid var(--acc)}
.play:disabled{opacity:.45;cursor:default}
.play .left{font-size:12px;font-weight:500;color:var(--ink3)}
.play.on{background:var(--acc);color:var(--surface)}
/* ── 쓰기 낱말 카드 ── */
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.tile{font-family:var(--serifen);font-size:17px;padding:8px 13px;border-radius:9px;cursor:pointer;
      background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.tile:hover{border-color:var(--acc)}
.tile.on{background:var(--acc-bg);border-color:var(--acc);color:var(--acc);margin:2px 0}
textarea.wbox{resize:vertical;line-height:1.6}
.three>div{border:1px solid var(--line);border-radius:11px;padding:13px 8px;text-align:center}
.three dt{font-size:10.5px;letter-spacing:.06em;color:var(--ink3);margin:0 0 4px}
.three .lv{font-family:var(--serifko);font-size:20px;font-weight:700;color:var(--acc);margin:0}
.three .cap{font-size:11px;color:var(--ink3);margin:2px 0 0;line-height:1.4}
.gq u{text-decoration:none;border-bottom:2px solid var(--ink3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 18px}
.two>div{border:1px solid var(--line);border-radius:11px;padding:14px 15px;text-align:center}
.two dt{font-size:10.5px;letter-spacing:.07em;color:var(--ink3);margin:0 0 4px}
.two .lv{font-family:var(--serifko);font-size:23px;font-weight:700;color:var(--acc);margin:0}
.two .cap{font-size:11.5px;color:var(--ink3);margin:2px 0 0}
.word{font-family:var(--serifen);font-size:38px;font-weight:600;letter-spacing:-.01em;
      margin:0 0 4px;word-break:break-word}
.pos{font-size:11.5px;color:var(--ink3);margin:0 0 20px}
.opts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
     font:inherit;font-size:15px;color:var(--ink);cursor:pointer;
     background:var(--sunk);border:1px solid transparent;border-radius:10px;padding:12px 15px}
.opt:hover{border-color:var(--line)}
.opt:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.opt b{flex:none;font-size:11px;font-weight:600;color:var(--ink3);margin-top:3px}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.wrong{background:var(--no-bg);border-color:var(--no);color:var(--no)}
.opt.sel{border-color:var(--acc);background:var(--surface);font-weight:600}
.kotip{font-size:13.5px;color:var(--ink3);margin:0 0 8px}
.wbox{width:100%;font-size:18px;font-family:Georgia,'Times New Roman',serif;color:var(--ink);
  background:var(--sunk);border:1px solid transparent;border-radius:10px;padding:13px 14px;margin:2px 0 0}
.wbox:focus{outline:none;border-color:var(--acc);background:var(--surface)}
.wbox::placeholder{font-family:inherit;font-size:14px;color:var(--ink3)}
.wbox:disabled{opacity:.6}
.tbl .ko{color:var(--ink3)}
.tag{display:inline-block;font-size:10px;padding:1px 5px;border-radius:3px;
  background:var(--acc);color:var(--surface);vertical-align:1px}
.opt.sel b{color:var(--acc)}
.opt:disabled{cursor:default}
#nextq:disabled{opacity:.35;cursor:default}

/* ── 🧪 화면 자동 맞춤(2026-10-29 원장 "레벨테스트를 태블릿·컴퓨터 환경에 맞게 자동 맞춤") ──
   태블릿·컴퓨터 = 틀을 넓히고 글자 키움 / 손가락 = 보기·버튼 크게 /
   독해: 가로 화면이면 지문 왼쪽(제 상자 안에서 스크롤)·문제 오른쪽, 세로면 지문 위(높이 제한).
   태블릿은 스크롤 막대가 안 보여 → 지문 상자 아래에 그림자(더 있으면만 보임)로 '이어진다'를 알린다. */
.card > .psg{max-height:calc(100vh - 300px);max-height:calc(100dvh - 300px);min-height:160px;overflow:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:linear-gradient(var(--sunk) 30%,transparent) center top,linear-gradient(transparent,var(--sunk) 70%) center bottom,
    radial-gradient(farthest-side at 50% 0,rgba(0,0,0,.14),transparent) center top,radial-gradient(farthest-side at 50% 100%,rgba(0,0,0,.18),transparent) center bottom;
  background-repeat:no-repeat;background-size:100% 40px,100% 40px,100% 12px,100% 14px;background-attachment:local,local,scroll,scroll;background-color:var(--sunk)}
@media (min-width:900px){
  .wrap{max-width:860px}
  .opt{font-size:17px;padding:14px 17px}
  .word{font-size:46px}
  .gq{font-size:21px}
  .gq.rq{font-size:17.5px}
  .psg .en{font-size:17.5px}
  .meta{font-size:12.5px}
}
@media (min-width:1300px){ .wrap{max-width:980px} }
@media (orientation:landscape) and (min-width:900px){
  .card:has(> .psg){display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);column-gap:24px;align-items:start}
  .card:has(> .psg) > .meta{grid-column:1/-1}
  .card:has(> .psg) > .psg{grid-column:1;grid-row:2/span 3;max-height:calc(100vh - 300px);max-height:calc(100dvh - 300px)}
  .card:has(> .psg) > .gq,.card:has(> .psg) > .opts,.card:has(> .psg) > .go{grid-column:2}
  .card:has(> .psg) > .gq.rq{margin-top:0}
}
@media (orientation:portrait){ .card > .psg{max-height:40vh;max-height:40dvh} }
@media (max-height:860px) and (orientation:landscape){ .wrap{padding-top:16px} .head{margin-bottom:12px;padding-bottom:10px} .lscale{margin-bottom:10px} .card{padding:18px 20px} }
@media (pointer:coarse){ .opt{min-height:54px;align-items:center} .go{min-height:54px} .tile{padding:11px 16px;font-size:19px} }

/* ── 시작·결과 ── */
.name{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--sunk);
       border:1px solid transparent;border-radius:10px;padding:12px 14px;margin:14px 0 0}
.name:focus{outline:none;border-color:var(--acc);background:var(--surface)}
.name::placeholder{color:var(--ink3)}
.who2{font-size:12.5px;color:var(--ink3);text-align:center;margin:0 0 16px}
.who2 b{color:var(--ink);font-weight:600;font-size:14px}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;margin:16px 0 0}
.pick button{padding:11px 0;font-size:14px;font-weight:600;border-radius:9px;
             background:var(--surface);border:1px solid var(--line);color:var(--ink);cursor:pointer}
.pick button:hover{border-color:var(--acc);color:var(--acc)}
.go{display:block;width:100%;margin-top:18px;padding:14px;font-size:15px;font-weight:600;
    border:0;border-radius:11px;background:var(--ink);color:var(--ground);cursor:pointer}
p.lead{font-size:14px;color:var(--ink2);margin:0 0 4px}
p.small{font-size:12.5px;color:var(--ink3);margin:8px 0 0}

.verdict{text-align:center;padding:8px 0 20px}
.verdict .lv{font-family:var(--serifko);font-size:44px;font-weight:700;letter-spacing:-.02em;
             color:var(--acc);margin:0;font-variant-numeric:tabular-nums}
.verdict .cap{font-size:13px;color:var(--ink3);margin:2px 0 0}
.stats{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 20px}
.stats div{flex:1;padding:11px 12px;border-right:1px solid var(--line2);text-align:center}
.stats div:last-child{border-right:0}
.stats dt{font-size:10.5px;letter-spacing:.07em;color:var(--ink3);margin:0 0 2px}
.stats dd{margin:0;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line2);text-align:left}
th{font-size:10.5px;letter-spacing:.06em;color:var(--ink3);font-weight:600;
   border-bottom:1px solid var(--line)}
td.r{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink3)}
td.w{font-family:var(--serifen);font-size:14.5px}
.mark{display:inline-block;width:17px;height:17px;line-height:16px;border-radius:50%;
      font-size:10.5px;text-align:center;font-weight:700}
.mark.o{background:var(--ok-bg);color:var(--ok)} .mark.x{background:var(--no-bg);color:var(--no)}
.tbl{overflow-x:auto;margin-top:6px}
h2{font-family:var(--serifko);font-size:17px;font-weight:700;margin:26px 0 2px}
h2+p{font-size:12.5px;color:var(--ink3);margin:0 0 8px}
@media (prefers-reduced-motion:reduce){.ladder i{transition:none}}
</style>

<div class="wrap">
  <header class="head">
    <h1>영어 레벨테스트</h1>
    <p class="sub">해피트리 · 단어 · 듣기 · 문장 만들기 · 독해 · 적응형</p>
  </header>
  <div id="app"></div>
</div>

<script>/* 적응형 시험용 가벼운 판 — build-bank2.py 산출물에서 예문을 뺐다(아티팩트에 심으려고). */

ed.", "However her customers came back one by one.", "They said the big store did not know their names.", "A price can be low, but a person can not be copied.", "Her chair by the door is still there."], "q1": {"q": "이 글의 중심 내용으로 알맞은 것은?", "c": ["이름을 아는 작은 가게로 손님이 돌아옴", "작은 가게는 매일 여섯 시에 문을 연다", "큰 가게 때문에 작은 가게가 문을 닫음", "값이 싼 가게가 언제나 손님에게 최고다"], "a": 0}, "q2": {"q": "손님들이 작은 가게로 다시 온 까닭은?", "c": ["큰 가게는 손님 이름을 몰라서", "작은 가게 물건값이 더 싸서", "작은 가게 불빛이 더 밝아서", "문 옆에 새 의자를 들여놓아서"], "a": 0}}, {"t": "I Forgot and I Remembered", "s": ["Our memory is not a box that keeps everything.", "For example, I forget names after one meeting.", "Also, I forget where I put my key.", "But I remember a summer day from five years ago.", "Last week I could not remember a friend's name.", "I felt sorry and a little afraid.", "Then I saw her old photo on my desk.", "Her name came back in one second.", "The name was only waiting for a door to open.", "Now I keep small photos and old tickets.", "They are the keys to rooms inside my head.", "Therefore the name was never gone."], "q1": {"q": "이 글의 중심 내용으로 알맞은 것은?", "c": ["잊은 것도 작은 계기로 다시 떠오른다", "열쇠를 어디 두었는지 자주 잊는다", "친구 사진을 잃어버려 이름을 잊은 일", "한번 잊은 것은 다시 떠오르지 않는다"], "a": 0}, "q2": {"q": "글의 내용과 맞는 것은?", "c": ["옛 사진을 보고 이름이 떠올랐다", "오 년 전 여름날은 기억나지 않는다", "친구 이름은 하루 뒤에 떠올랐다", "이제 사진과 표를 모두 버렸다"], "a": 0}}], "5": [{"t": "What a Paragraph Does", "s": ["A paragraph is a group of sentences about one idea.", "For example, a paragraph about rain talks only about rain.", "It does not jump to snow or wind.", "The one idea holds the sentences together.", "A good paragraph usually opens with a topic sentence.", "The sentences after it give examples or reasons.", "Some writers put the topic sentence at the end.", "They show the examples first and then name the idea.", "Both ways are correct in an essay.", "The reader only needs to find the one idea.", "A paragraph without one idea feels like a list.", "Therefore every paragraph should answer one question."], "q1": {"q": "이 글의 중심 내용으로 알맞은 것은?", "c": ["문단은 한 가지 생각으로 문장들을 묶은 것이다", "주제문은 문단 맨 끝에 올 수도 있다", "문단은 비나 눈 같은 날씨를 다루는 글이다", "좋은 문단에는 여러 생각이 골고루 들어가야 한다"], "a": 0}, "q2": {"q": "글의 내용과 맞지 않는 것은?", "c": ["주제문은 반드시 문단 맨 앞에 와야 한다", "비에 관한 문단은 눈이나 바람으로 넘어가지 않는다", "주제문 뒤의 문장들은 예나 까닭을 든다", "한 생각이 없는 문단은 목록처럼 느껴진다"], "a": 0}}, {"t": "Coral Is an Animal", "s": ["Many people think coral is a bright rock.", "For example, it does not move or run away.", "It stands in one place for its whole life.", "Its hard surface feels like stone under the hand.", "But coral is a living animal.", "Thousands of tiny creatures build the hard walls together.", "Each one catches food from the passing water.", "Algae live inside them and give them color.", "Coral looks like a rock because it works slowly.", "A reef can take a thousand years to grow.", "Slow life is still life.", "What looks still is often only patient."], "q1": {"q": "이 글의 중심 내용으로 알맞은 것은?", "c": ["산호는 돌처럼 보이지만 살아 있는 동물이다", "산호 속 조류가 산호에 색을 입혀 준다", "산호는 밝은 빛깔을 띤 단단한 돌이다", "바닷속 생물은 모두 산호처럼 아주 느리게 산다"], "a": 0}, "q2": {"q": "글의 내용과 맞는 것은?", "c": ["산호초는 자라는 데 천 년이 걸리기도 한다", "산호 한 마리가 혼자서 단단한 벽을 다 쌓는다", "조류는 산호 밖에 붙어 먹이를 잡아 준다", "산호는 물결을 따라 천천히 옮겨 다닌다"], "a": 0}}, {"t": "Day and Night on a Spinning Earth", "s": ["The earth turns on its axis once a day.", "For example, the half facing the sun has bright day.", "The other half is in the shadow of the planet.", "The line between them moves as the earth turns.", "People long ago believed the sun moved around us.", "From the ground, that is how it really looks.", "The sun climbs the sky in the morning and drops at night.", "Nothing under our feet seems to move at all.", "Our eyes report the motion of the sun.", "Careful measuring reports the turning of the earth.", "When the two do not agree, measuring wins.", "Science often asks us to trust the number over the feeling."], "q1": {"q": "이 글의 중심 내용으로 알맞은 것은?", "c": ["해가 도는 듯 보여도 재어 보면 지구가 돈다", "해를 향한 쪽은 낮이고 반대쪽은 밤이다", "옛날 생각처럼 해가 지구 둘레를 돈다", "느낌이 잰 숫자보다 더 정확할 때가 많다"], "a": 0}, "q2": {"q": "옛날 사람들이 해가 우리 둘레를 돈다고 믿은 까닭은?", "c": ["땅에서 보면 정말 해가 움직이는 것 같아서", "해가 지구 그림자 속으로 들어가서", "조심스럽게 재어 본 숫자가 늘 그렇게 나와서", "발밑의 땅이 움직이는 것이 느껴져서"], "a": 0}}, {"t": "Jealousy Points at You", "s": ["Jealousy is one of the least comfortable feelings to admit.", "For example, a friend wins a prize and something turns hard inside you.", "You smile and say the right words all the same.", "The feeling seems to be about the other person.", "In fact it is a message about yourself.", "You rarely feel jealous of a skill you do not want.", "Nobody envies a stranger for a hobby they find dull.", "The pain appears only where your own wish lives.", "Jealousy marks the place you care about.", "Read as blame, it makes you smaller.", "Read as a map, it shows you where to work.", "The same feeling can make you smaller or aim you."], "q1": {"q": "이 글의 중심 내용으로 알맞은 것은?", "c": ["질투는 내가 바라는 것이 어디 있는지 알려 준다", "친구가 상을 타면 속이 굳어지기도 한다", "질투는 상대에 대한 감정이니 숨겨야 한다", "질투는 언제나 사람을 더 작게 만들 뿐인 감정이다"], "a": 0}, "q2": {"q": "글의 내용과 맞지 않는 것은?", "c": ["우리는 관심 없는 재주에도 자주 질투한다", "질투가 나도 웃으며 알맞은 말을 하곤 한다", "질투를 탓으로 읽으면 사람이 작아진다", "질투를 지도로 읽으면 노력할 곳이 보인다"], "a": 0}}, {"t": "A Person Is Not One Word", "s": ["We like to sort people into a few kinds.", "For example, we call one child shy and another brave.", "The word then follows the child for years.", "Teachers and friends start to see only that word.", "A realistic picture is harder to draw than a box.", "The same child is shy in a big room and loud at home.", "She is careful with money and careless with time.", "A person is many habits, not one word.", "Sorting helps for a moment and hurts for a year.", "It saves us the work of looking again.", "But people keep changing while the word stays still.", "Therefore the word we choose for a child should stay open."], "q1": {"q": "이 글의 중심 내용으로 알맞은 것은?", "c": ["사람은 낱말 하나로 정해지지 않는다", "같은 아이가 큰 방에선 수줍고 집에선 시끄럽다", "수줍은 아이에겐 용감하다는 말을 붙여야 한다", "사람을 몇 가지로 나누면 오래 도움이 된다"], "a": 0}, "q2": {"q": "글의 내용과 맞는 것은?", "c": ["사람을 나누면 다시 살펴보는 수고를 던다", "아이에게 붙은 낱말은 금방 잊힌다", "사람은 그대로인데 낱말은 계속 바뀐다", "그 아이는 돈과 시간 모두에 늘 조심스럽다"], "a": 0}}, {"t": "Why a Traffic Jam Moves Backward", "s": ["A traffic jam often moves backward while the cars move forward.", "For example, one car slows down on the expressway in the afternoon.", "An hour later the slow place is far behind that car.", "The car itself is long gone.", "Each driver answers the car in front a second late.", "That second becomes two seconds for the car behind.", "The wait grows as it passes back through the line.", "Nothing is moving backward but the waiting itself.", "Congestion is not a place on the road.", "It is a wave that travels through the cars.", "You cannot clear it by looking for the car that started it.", "Therefore the answer is more space between cars, not more anger."], "q1": {"q": "이 글의 중심 내용으로 알맞은 것은?", "c": ["차 막힘은 차들 사이를 뒤로 지나가는 물결이다", "운전자는 앞차에 1초쯤 늦게 반응한다", "차 막힘은 길 위 한 자리에 그대로 머문다", "막힘을 처음 일으킨 차를 찾아내면 길이 뚫린다"], "a": 0}, "q2": {"q": "글쓴이가 말하는 막힘을 푸는 방법은?", "c": ["차와 차 사이를 더 넓게 띄운다", "처음 속도를 줄인 차를 찾아낸다", "오후에는 고속도로를 피해 달린다", "막힘이 시작된 자리를 빨리 치운다"], "a": 0}}, {"t": "Wireless Still Needs Wires", "s": ["A wireless phone is wireless only at the end of its journey.", "For example, your message leaves the phone through the air.", "It reaches a tower a few streets away.", "From there it travels in a cord under the ground.", "Most of the journey happens in wire, not in air.", "A message from one country to another goes under the sea in a long cord.", "Workers put those cords on the sea floor over many years.", "The last short part is wireless; the rest is not.", "Wireless does not mean there is no road.", "It means you do not stand on the road yourself.", "The road is still there, under the water and under the street.", "Therefore the word tells you about the last part of the trip, not the whole trip."], "q1": {"q": "이 글의 중심 내용으로 알맞은 것은?", "c": ["무선은 여정의 마지막 짧은 구간만 가리킨다", "나라 사이 메시지는 바다 밑 줄로 간다", "탑에서 메시지가 공기를 타고 바다를 건넌다", "요즘 통신에는 더 이상 길이 필요 없다"], "a": 0}, "q2": {"q": "글의 내용과 맞지 않는 것은?", "c": ["메시지는 길의 대부분을 공기 속으로 간다", "메시지는 휴대폰을 떠나 가까운 탑에 닿는다", "탑에서부터는 땅속 줄을 따라 이동한다", "일꾼들이 여러 해에 걸쳐 바다에 줄을 놓았다"], "a": 0}}, {"t": "The Eye of a Typhoon", "s": ["The calm middle of a typhoon is called the eye.", "For example, the wind can stop and the sun can come out for half an hour.", "People who do not know the storm walk outside.", "The second half of the wind then arrives from the other way.", "A typhoon turns in a ring around its middle.", "The front of the ring pushes the air one way.", "The back of the ring pushes it the other way.", "Between them the middle is nearly still.", "The eye is not the end of the storm.", "It is the middle of it.", "The worst minutes come right after the calm ones.", "A calm sky is not always a safe sky."], "q1": {"q": "이 글의 중심 내용으로 알맞은 것은?", "c": ["태풍의 눈은 끝이 아니라 폭풍의 한가운데다", "태풍은 가운데를 둘러싸고 고리처럼 돈다", "태풍의 눈이 오면 폭풍은 다 지나간 것이다", "태풍의 눈에서는 바람이 가장 세게 분다"], "a": 0}, "q2": {"q": "태풍의 눈에서 밖에 나간 사람이 위험한 까닭은?", "c": ["곧 바람이 반대쪽에서 다시 불어오므로", "눈 속에서는 바람이 가장 세게 불어서", "반 시간 동안 나온 해가 너무 뜨거워서", "곧 다른 태풍이 새로 찾아와서"], "a": 0}}], "6": [{"t": "The Boastful Runner", "s": ["Minsu was the fastest boy in his class, and he never let anyone forget it.", "He was boastful after every race he won.", "His classmates got along with him, but they had stopped clapping.", "One Friday a new girl turned up at the school gate.", "She said nothing about running at all.", "On the day of the school races Minsu ran his best race and finished second.", "Jenny passed him near the end and then reached back for his hand.", "She was courteous even at the moment she won.", "Minsu looked at her hand for a long time before he took it.", "Something in him gave in.", "She knew how a loss felt, so she did not enjoy his.", "Two years before that day, Jenny had lost every race at her old school.", "She had wanted to give up, but she did not stop.", "Minsu still won often after that, but he stopped talking about it."], "q1": {"q": "이 이야기는 무엇에 대한 이야기인가요?", "c": ["져 본 적 있는 제니의 예의에 자랑하던 민수가 달라진 일", "제니가 달리기 끝에 민수를 앞지른 일", "민수가 경주에 져서 달리기를 그만둔 일", "새로 온 아이가 경주에 이긴 뒤 민수에게 자랑한 일"], "a": 0}, "q2": {"q": "제니가 이긴 순간에 민수의 손을 잡아 준 까닭은?", "c": ["자기도 지는 기분을 잘 알고 있어서", "민수가 반에서 가장 빠른 아이라서", "반 친구들이 박수를 치지 않아서", "예전 학교에서 민수와 함께 달려 봐서"], "a": 0}}, {"t": "The Day She Was Elated", "s": ["Mira picked up the letter on a Thursday and read it twice on the stairs.", "She had been taken into the school she had wanted for two years.", "She was elated in a way that made her want to run somewhere.", "She called her best friend and got no answer.", "She called her mom and heard only that dinner would be late.", "By evening the letter was still in her bag and nobody had found out about it.", "Mira found that a big feeling with nowhere to go turns heavy.", "She went to her grandma, who was slow to hear and slower to speak.", "Her grandma read the letter, put it down, and held both of her hands.", "They sat like that until the room went dark.", "That evening Mira worked out that the holding had never been about the news.", "Some feelings do not need an answer; they need somebody in the room.", "Six months earlier, on the day Mira did badly on her first test, her grandma had done the same thing.", "She had held her hands and said nothing then too."], "q1": {"q": "이 이야기가 전하려는 생각으로 알맞은 것은?", "c": ["큰 마음에는 대답보다 곁에 있을 사람이 필요하다", "미라가 바라던 학교에서 합격 편지를 받았다", "할머니가 합격 소식을 듣고 크게 소리 내 기뻐했다", "기쁜 소식은 여럿에게 알려야 가벼워진다"], "a": 0}, "q2": {"q": "그날 저녁 미라가 깨달은 것은?", "c": ["할머니의 손잡기는 소식과 상관이 없었다", "할머니는 귀가 어두워 편지를 못 읽었다", "할머니는 좋은 소식에만 손을 잡아 준다", "기쁜 마음은 혼자 두면 더 가벼워진다"], "a": 0}}, {"t": "A Setback in the Second Week", "s": ["The library project was supposed to take one month.", "Doyun had drawn the whole plan on one big page.", "In the second week the school said the money would come in the fall instead.", "Half of his team stopped coming to the meetings.", "A setback is not the end of a plan, but it feels like one for about a week.", "Doyun kept the drawing on the wall and crossed out the parts that needed money.", "What was left was a shelf, a board, and a list of books people would lend.", "Four of them built the shelf out of an old desk on a Saturday.", "By the fall the corner already had thirty books in it.", "When the money came, it went into chairs instead of walls.", "This time he did not wait for the plan to be whole again.", "The year before, Doyun had given up a garden plan the first time it rained.", "He had told nobody, and the empty corner had stayed empty all summer.", "A setback takes away part of a plan, and it shows you which part you can live without."], "q1": {"q": "이 글의 중심 내용으로 알맞은 것은?", "c": ["좌절은 계획 중 없어도 되는 부분을 알려 준다", "도윤이네는 낡은 책상으로 책장을 만들었다", "돈이 늦어지자 도서관 계획을 가을로 미뤄 두었다", "좌절이 오면 계획은 거기서 끝이 난다"], "a": 0}, "q2": {"q": "작년과 비교해 도윤이가 달라진 점은?", "c": ["막힌 부분은 지우고 남은 부분부터 해 나갔다", "비가 오자 정원 계획을 바로 그만두었다", "돈이 오자 그 돈으로 벽부터 세웠다", "이번에도 아무에게 말하지 않고 혼자 했다"], "a": 0}}, {"t": "The Endeavor Nobody Watched", "s": ["Seoyeon decided in her second year to read every book in the school library.", "She told two people, and both of them laughed in a friendly way.", "She made a list of eight hundred and forty books and started at the first shelf.", "For the first year she read on the bus and at the table and before sleep.", "An endeavor that long stops being a plan and turns into a habit you forget you have.", "By her fourth year she had read four hundred and ten of them.", "She never finished the list, and she stopped keeping count in the last spring.", "What she had instead was a way of seeing what a book was doing in ten pages.", "She could tell in a chapter whether an idea was going to hold.", "Nobody had given her that; it had come from four hundred books nobody watched her read.", "The list had never been what mattered, and she had needed a list to find that out.", "In her first year a teacher had told her that reading widely was for people with time.", "Seoyeon had not argued and had only gone to the shelf that afternoon.", "Some things can only be learned by doing far more of them than anyone asks."], "q1": {"q": "이 이야기는 무엇에 대한 이야기인가요?", "c": ["아무도 안 본 긴 독서가 책 보는 눈을 길렀다", "서연이는 버스와 식탁에서도 책을 읽었다", "서연이는 840권 목록을 마지막 권까지 다 읽었다", "많이 읽는 건 시간 많은 사람만의 일이다"], "a": 0}, "q2": {"q": "글의 내용과 맞는 것은?", "c": ["서연이는 마지막 봄에 세는 것을 그만두었다", "선생님은 서연이에게 많이 읽으라고 권했다", "서연이는 선생님 말에 그 자리에서 따졌다", "두 친구는 서연이의 계획을 비웃으면서 말렸다"], "a": 0}}, {"t": "The Assertive One Was Not Loud", "s": ["Everyone in the club thought Miso was the quiet one.", "She never made her voice loud and never cut anyone off.", "She also got what she asked for almost every time.", "The loud members did not, and they never worked out why.", "Being assertive is about what you ask for, not about how loudly you ask.", "When the club wanted three rooms and the school gave one, Miso wrote down what each room was for.", "She took the page to the office and asked one question at a time.", "She did not argue with the answer she got; she asked what would change it.", "The school gave the club two rooms by Friday.", "A boy who had shouted at the same office in September had got nothing.", "They gave her the two rooms because she had made it easy to say yes.", "Being loud tells a room how you feel; being assertive tells it what you want.", "In her first year Miso had asked for nothing at all for eleven months.", "She had watched that boy shout, and she had decided to try the other thing."], "q1": {"q": "이 글의 중심 내용으로 알맞은 것은?", "c": ["당당함은 목소리 크기가 아니라 무엇을 청하느냐다", "학교가 금요일까지 동아리에 방 두 개를 주었다", "미소는 큰 목소리로 끝까지 따져서 방을 얻어 냈다", "조용한 사람은 원하는 것을 얻기 어렵다"], "a": 0}, "q2": {"q": "학교가 미소에게 방을 준 까닭은?", "c": ["'그러자'고 말하기 쉽게 만들어 주어서", "받은 대답에 끝까지 따지고 들어서", "9월에 소리친 아이가 먼저 부탁해 두어서", "방 세 개를 한꺼번에 크게 요구해서"], "a": 0}}, {"t": "The Alarming Number on the Board", "s": ["The number on the board said that the class average had fallen by twelve marks.", "Half the room went quiet and the other half started arguing.", "An alarming number does what it is meant to do: it stops the room.", "It does not tell the room what to do next, and people forget that.", "Two children had been away for three weeks and had taken the test all the same.", "Their two papers had pulled the average down by nine of the twelve marks.", "The teacher had gone over the two papers before class and had known this already.", "She wrote the average without them below it, and it had fallen by three.", "Three marks is a real drop and it is not an alarming one.", "The room went from arguing to asking what had changed in the third part of the book.", "A number that frightens a room usually carries the question inside it.", "The class found out what had gone wrong in that part of the book in one afternoon.", "In her first year of teaching she had written an alarming number on a board and had left it there.", "The class had argued about it for a week and had never opened that part of the book at all."], "q1": {"q": "이 글의 중심 내용으로 알맞은 것은?", "c": ["놀라운 숫자를 나눠 보면 진짜 물음이 보인다", "두 아이가 3주 동안 학교에 오지 않았다", "평균이 12점 떨어지자 반이 일주일 내내 다퉜다", "놀라운 숫자는 다음에 할 일을 알려 준다"], "a": 0}, "q2": {"q": "글의 내용과 맞지 않는 것은?", "c": ["선생님은 수업 중에 두 시험지를 처음 알았다", "두 아이의 시험지가 평균을 9점이나 끌어내렸다", "두 아이를 빼면 평균은 3점 떨어졌다", "반은 오후 한나절 만에 문제를 찾아냈다"], "a": 0}}, {"t": "The Thing That Discouraged the Whole Group", "s": ["Six people started a plan to clean the stream behind the school.", "They pulled out four bags of litter on the first Saturday.", "The next week the stream looked the same as it had before.", "Nothing discouraged them faster than seeing the same litter again.", "Three of them did not come back on the third Saturday.", "Minha walked the stream on her own and found where the litter came in.", "A drain from the road brought it down every time it rained.", "Cleaning the stream had never been the job; closing that drain was.", "They put a wire lid over the drain in one afternoon in May.", "The stream stayed clean through the summer with no Saturdays at all.", "People give up when the work they are doing is not the work that would fix it.", "The three who had left came back in June and did not know why it had worked.", "Minha had watched her town clean the same beach every spring for six years.", "She had been eleven the year she asked her dad where the litter came from and got no answer."], "q1": {"q": "이 이야기는 무엇에 대한 이야기인가요?", "c": ["치우는 대신 쓰레기 들어오는 곳을 막아 해결했다", "첫 토요일에 쓰레기 네 자루를 건져 냈다", "여섯 명이 매주 토요일 개울을 치워 깨끗하게 했다", "같은 쓰레기를 보면 더 열심히 하게 된다"], "a": 0}, "q2": {"q": "개울이 여름 내내 깨끗했던 까닭은?", "c": ["길에서 오는 배수구에 철망 뚜껑을 덮어서", "떠났던 세 명이 6월에 다시 돌아와서", "토요일마다 쓰레기를 더 많이 건져서", "그해 여름에는 비가 단 한 번도 오지 않아서"], "a": 0}}], "7": [{"t": "A Number Is Not an Argument", "s": ["Last year the town library lent out sixty thousand books.", "That number appeared in every report about the library.", "A number by itself cannot justify anything.", "People who wanted more funding cited the figure as proof of success.", "People who wanted less funding cited the same figure as proof of waste.", "Sixty thousand books means one thing in a town of five thousand people.", "It means something else entirely in a town of two hundred thousand.", "Nobody in the debate mentioned how many people lived in the town.", "To evaluate a number you have to know what to compare it with.", "A number without a comparison is not an argument at all.", "A figure that cannot be checked should not be allowed to decide anything.", "The town should ask every report to name its comparison.", "That one rule would end half the arguments before they start.", "It costs nothing and it can be adopted this year."], "q1": {"q": "이 글의 요지로 알맞은 것은?", "c": ["비교할 대상이 없는 숫자는 근거가 될 수 없다.", "도서관은 작년에 책을 6만 권이나 빌려주었다.", "대출 권수가 많으니 도서관 예산을 늘려야 한다.", "보고서에는 숫자를 되도록 쓰지 않아야 한다."], "a": 0}, "q2": {"q": "글의 내용과 일치하는 것은?", "c": ["예산 찬반 양쪽이 같은 숫자를 근거로 들었다.", "토론에서 마을 인구가 여러 번 이야기되었다.", "6만 권이라는 숫자는 보고서 한 곳에만 실렸다.", "비교 대상을 밝히는 규칙에는 돈이 많이 든다."], "a": 0}}, {"t": "What Restrains a Good Idea", "s": ["Every teacher in our school may try a new way of teaching.", "The rule says only that they must report it after it happens.", "In four years exactly two teachers have done so.", "The rest keep to the old plan even when they dislike it.", "Nothing forbids them, and something is clearly holding them back.", "A teacher who tries something new and fails must explain it in a meeting.", "A teacher who changes nothing never has to explain anything.", "The cost of trying is public and the cost of not trying is hidden.", "That is not a rule; it is a shape the rules make together.", "Both teachers who tried said the meeting was the hardest part.", "People do not avoid new things because they are lazy.", "They avoid them because only one of the two choices has to be defended.", "The school should ask every teacher to report one thing they kept the same.", "Then standing still would need a reason too."], "q1": {"q": "이 글의 중심 내용은?", "c": ["해 본 쪽만 해명하게 하는 구조가 새 시도를 막는다.", "4년 동안 새 방법을 보고한 교사는 겨우 두 명뿐이다.", "교사들이 게을러서 새로운 수업 방법을 피하고 있다.", "학교 규칙이 새로운 수업 방법을 금지하고 있다."], "a": 0}, "q2": {"q": "글쓴이가 '그대로 둔 것 하나'도 보고하게 하자고 한 까닭은?", "c": ["바꾸지 않은 쪽도 이유를 대야 공평해지기 때문에", "새 방법을 시도한 교사가 너무 많아졌기 때문에", "규칙이 새 방법을 시도하지 못하게 막기 때문에", "회의에서 설명하는 일이 가장 쉬운 일이기 때문에"], "a": 0}}, {"t": "When Praise Compels", "s": ["Our club posts the name of the member who read the most books each month.", "A reward that only one person can win turns the rest into losers.", "Reading numbers rose sharply in the first two months.", "By the fifth month three members had stopped coming.", "All three had been steady readers before the board went up.", "The board did not tell anyone to read less.", "It only told twenty people each month that they were not the one.", "The member who won four times said she had stopped enjoying it.", "She had begun choosing short books to keep the number high.", "Both the winner and the losers ended up reading worse.", "Some will say competition is what made the first two months work.", "It also made the fifth month, and the fifth month is the one that lasted.", "The club should post what the whole club read, not who read most.", "A shared number gives everyone the same thing to add to."], "q1": {"q": "이 글의 요지로 알맞은 것은?", "c": ["한 명만 이기는 게시판이 모두의 독서를 나쁘게 했다.", "게시판을 붙인 뒤 두 달 동안 독서량이 크게 늘었다.", "경쟁이 있어야 독서 모임이 오래 이어질 수 있다.", "독서 모임에서는 읽은 책의 양을 아예 세지 말아야 한다."], "a": 0}, "q2": {"q": "글의 내용과 일치하지 않는 것은?", "c": ["모임을 그만둔 세 명은 원래 책을 잘 안 읽었다.", "네 번 1등한 회원은 숫자를 위해 짧은 책을 골랐다.", "다섯째 달까지 세 명이 모임에 나오지 않게 되었다.", "게시판은 누구에게도 덜 읽으라고 말하지 않았다."], "a": 0}}, {"t": "The Notice Nobody Could Read", "s": ["The town posted a notice about a road closing four weeks in advance.", "Telling everyone in a place nobody looks is not telling anyone.", "It appeared on the town website under a part called Public Records.", "Two hundred and six people saw the page that month.", "Eleven thousand people use that road each week.", "The town met every rule the law sets for notice.", "The law names a place to post; it does not name a number to reach.", "On the morning of the closing, four hundred cars turned back at the barrier.", "The town said after the vote that the information had been available.", "Available and delivered are two different words.", "Notices about roads should go where the road users already are.", "A sign on the road itself would have reached them all for the price of the sign.", "Meeting a rule is not the same as doing the thing the rule was written for.", "The rule asks for a posting; the point of the rule is that people know."], "q1": {"q": "이 글의 요지로 알맞은 것은?", "c": ["규칙을 지키는 것과 실제로 알리는 것은 다르다.", "공지는 누리집의 공공 기록 메뉴 아래에 올라갔다.", "마을은 법이 정한 공지 규칙을 지키지 않았다.", "도로 공지는 누리집에 아예 올리지 말아야 한다."], "a": 0}, "q2": {"q": "글의 내용과 일치하는 것은?", "c": ["공지를 본 사람보다 도로 이용자가 훨씬 많다.", "법은 공지가 닿아야 할 사람 수를 정해 두었다.", "공지 덕분에 막힌 날 아침에 돌아간 차가 없었다.", "글쓴이는 도로 위 표지판이 너무 비싸다고 했다."], "a": 0}}, {"t": "Capacity, Not Effort", "s": ["Our science club meets after school on Tuesday at four.", "Eleven of the fourteen members live within a short walk of the school.", "The other three ride a bus that leaves at four.", "Those three have missed nine meetings between them this year.", "The club calls them the members who do not try.", "Effort explains almost nothing about who is in the room at four.", "The bus is the whole story, and the bus is not a choice.", "A club that meets at four is a club for people who live near it.", "Nobody planned it, and everyone can see it once it is said.", "The word for that is capacity, not effort.", "Moving the meeting to the middle of the day would cost the club nothing.", "Judging the three by effort costs them their place.", "Our club should meet in the middle of the day and stop calling the bus a lack of effort.", "A group that mistakes capacity for effort slowly becomes a group of neighbors."], "q1": {"q": "이 글의 요지로 알맞은 것은?", "c": ["세 회원이 빠진 것은 노력이 아니라 여건 때문이다.", "동아리 회원 14명 중 11명은 학교 가까이 산다.", "버스 타는 세 회원이 더 노력해야 모임에 올 수 있다.", "과학 동아리는 학교 근처에 사는 학생만 받아야 한다."], "a": 0}, "q2": {"q": "글의 내용과 일치하지 않는 것은?", "c": ["세 회원은 스스로 원해서 네 시 버스를 탄다.", "세 회원은 올해 모두 합쳐 아홉 번 모임에 빠졌다.", "동아리는 그 세 명을 노력하지 않는 회원이라 부른다.", "모임을 한낮으로 옮겨도 동아리에 드는 비용은 없다."], "a": 0}}, {"t": "Autonomy on Paper", "s": ["Our student council has autonomy over the club budget by school rule.", "Autonomy that another office may cancel is not autonomy.", "The rule is printed in the rule book every year.", "Every budget the council has passed since it began has needed the office stamp.", "The office has refused the stamp four times in three years.", "The office says the stamp only checks for errors in math.", "Three of the four times mentioned no math at all.", "One of them said only that the plan was not wise.", "A check that may refuse for any reason is a power, not a check.", "Nobody set out to take the power; it simply was never given away.", "The rule book should say what the stamp may and may not refuse for.", "A named limit turns a power back into a check.", "Our council should ask for that one sentence and nothing more.", "Autonomy on paper is a promise; a written limit is the keeping of it."], "q1": {"q": "글쓴이의 주장으로 알맞은 것은?", "c": ["도장이 거절할 수 있는 까닭을 규칙 책에 적자.", "사무실은 3년 동안 네 번이나 도장을 거부했다.", "학생회 예산에서 도장 검사를 완전히 없애야 한다.", "도장은 계산 실수만 보니 지금 그대로 두어도 된다."], "a": 0}, "q2": {"q": "글쓴이가 '도장은 검사가 아니라 권한'이라고 본 근거는?", "c": ["네 번 거부 중 세 번은 계산 이야기가 없었다.", "사무실이 네 번 모두 계산 실수를 찾아냈다.", "학생회가 도장 없이 예산을 쓴 적이 있었다.", "규칙 책에 자치 규칙이 빠져 있던 해가 있었다."], "a": 0}}, {"t": "Typical Is Not Average", "s": ["The city says a typical student in our part of the city walks twelve minutes to school.", "Twelve minutes is the average, not the typical walk.", "Most students in that part of the city walk between four and seven minutes.", "Nine students walk more than fifty minutes each way.", "Those nine pull the average up where nobody actually stands.", "The city uses the average because one number fits in one line.", "The line then appears in every plan about bus routes.", "A plan made from twelve minutes works for a student who does not exist.", "The nine long walkers are the reason the bus route matters at all.", "They are also the group the average hides most completely.", "The city should report the common range and the longest walk together.", "Two numbers take one more line and change what the plan is for.", "An average answers how much in total.", "A range answers who, and the plan is always about who."], "q1": {"q": "이 글의 요지로 알맞은 것은?", "c": ["평균 하나만 쓰면 버스가 정말 필요한 학생들이 가려진다.", "대부분 학생은 4~7분을 걸어서 학교에 간다.", "평균 12분이 이 지역의 흔한 등굣길을 잘 보여 준다.", "시는 버스 계획을 세울 때 숫자를 쓰지 말아야 한다."], "a": 0}, "q2": {"q": "글의 내용과 일치하는 것은?", "c": ["50분 넘게 걷는 아홉 명이 평균을 끌어올렸다.", "대부분 학생이 12분쯤 걸어서 학교에 간다.", "시는 평균이 가장 정확하기 때문에 그 숫자를 쓴다.", "숫자 두 개를 써도 계획은 달라지지 않는다."], "a": 0}}, {"t": "Entitled but Not Told", "s": ["Every student in our school may qualify for the book fund.", "The fund paid for two hundred books last year.", "It could have paid for six hundred.", "A right that nobody hears about is a right on paper only.", "The office has never told students that the fund exists.", "The rule appears on page forty of the school rule book.", "Nine of the ten students we asked had never opened that book.", "The office says the rule is public and available to all.", "Public and known are two different states of a fact.", "The office made no error and produced the same result an error would.", "Our school should print the fund in the first letter of each term.", "One line in a letter that families already read costs nothing.", "A fund that spends a third of itself is not a careful fund.", "It is a fund that most students were never invited to use."], "q1": {"q": "이 글의 요지로 알맞은 것은?", "c": ["알리지 않은 지원금은 종이 위에만 있는 권리다.", "도서 지원금은 작년에 책 200권 값을 냈다.", "사무실이 규칙을 어기는 바람에 지원금이 남게 되었다.", "남은 지원금은 줄여서 다른 곳에 써야 한다."], "a": 0}, "q2": {"q": "글의 내용과 일치하지 않는 것은?", "c": ["물어본 학생 열 명 중 아홉이 규칙 책을 읽었다.", "지원금은 책 600권 값까지 낼 수 있었다.", "그 규칙은 학교 규칙 책 40쪽에 실려 있다.", "글쓴이는 학기 첫 편지에 지원금 안내를 싣자고 했다."], "a": 0}}], "8": [{"t": "The Late Pass", "s": ["Our school gives a late pass to any student who arrives after class has begun.", "The pass takes about four minutes to write out at the front desk.", "A student who is five minutes late therefore misses nine minutes of class.", "The office says the pass keeps a clear record of who came in late.", "That record has never once been used for anything.", "Last term the office wrote out six hundred passes.", "Nobody read them, and in March they were thrown away.", "A rule that produces a record nobody reads is a rule that only produces work.", "The teachers who hand out the passes lose the same four minutes.", "Two of them now wave students in without one.", "They are breaking a rule that everybody agrees has stopped working.", "The pass could be replaced by a mark in the class list.", "A mark takes three seconds and keeps the same record.", "Our school should drop the late pass and mark the class list instead.", "The rule was written to know who was late.", "It now mostly makes people later."], "q1": {"q": "글쓴이의 주장으로 알맞은 것은?", "c": ["지각증 대신 출석부에 표시해 같은 기록을 남기자.", "지난 학기에 지각증이 600장이나 쓰였다.", "지각증을 없애고 지각 기록도 남기지 말자.", "지각증 없이 들여보내는 교사도 규칙을 지키게 하자."], "a": 0}, "q2": {"q": "글쓴이가 '규칙이 사람들을 더 늦게 만든다'고 한 까닭은?", "c": ["지각증을 쓰는 4분 동안 수업을 더 놓치기 때문에", "학생들이 지각증을 받으려고 일부러 늦기 때문에", "지각증 기록을 3월에 모두 다시 읽어야 하기 때문에", "출석부에 표시하는 데에도 4분이 걸리기 때문에"], "a": 0}}, {"t": "What a Request Costs", "s": ["A friend in our class asks to copy my notes about once a week.", "I write my notes in a way that only makes sense to me.", "Copying them takes me twenty minutes because I have to explain the marks.", "He thinks he is asking for a page.", "He is actually asking for twenty minutes and does not know it.", "Last month I said yes six times and got home late four of them.", "I never told him what the asking cost, so he could not weigh it.", "When the price of a request is hidden, it cannot really be accepted or refused.", "He would have asked less often if he had known.", "I know this because he stopped after I finally said it out loud.", "The problem was never his asking; it was my silence about the price.", "Saying what a request costs is not the same as refusing it.", "It gives the other person the same facts I already have.", "When someone asks me for something, I should say what it will take.", "Then a yes means yes and a no hurts no one.", "A hidden price turns a friend into someone who owes you without knowing."], "q1": {"q": "이 글의 요지로 알맞은 것은?", "c": ["부탁의 값을 말해야 상대가 제대로 정할 수 있다.", "친구는 일주일에 한 번쯤 공책을 베끼자고 한다.", "값이 큰 부탁은 처음부터 거절하는 편이 서로 좋다.", "친구가 자꾸 부탁한 것 자체가 문제였다."], "a": 0}, "q2": {"q": "글의 내용과 일치하는 것은?", "c": ["값을 말하고 나서 친구는 부탁을 그만두었다.", "친구는 부탁에 20분이 든다는 것을 알았다.", "글쓴이는 지난달 부탁을 여섯 번 모두 거절했다.", "글쓴이의 공책은 누가 봐도 알아보기 쉽다."], "a": 0}}, {"t": "The Deposit Nobody Gets Back", "s": ["Our school lends a music stand for a deposit of five thousand won.", "The deposit comes back when the stand is returned in June.", "Forty two stands went out last year and thirty one came back.", "The eleven that stayed out were not lost or broken.", "They were in the bags of students who did not know June was the date.", "The date is printed on the form that families sign in March.", "Nobody reads a form in March for something that happens in June.", "The school kept fifty five thousand won that it never meant to keep.", "A rule that collects money by being forgotten is collecting the wrong thing.", "The office says the deposit is what makes stands come back at all.", "That is true, and a message in June would do the same work.", "One message costs nothing and returns eleven stands.", "It also returns fifty five thousand won to the families who paid it.", "Our school should send a June message before it keeps a single deposit.", "The deposit was built to remind people.", "A rule that only works when people forget has stopped reminding anyone."], "q1": {"q": "글쓴이의 주장으로 알맞은 것은?", "c": ["보증금을 갖기 전에 6월에 안내부터 보내야 한다.", "작년에 보면대 42개 중 31개만 돌아왔다.", "보증금이 있어야 보면대가 돌아오니 지금이 옳다.", "보증금을 아예 없애고 보면대를 그냥 빌려주어야 한다."], "a": 0}, "q2": {"q": "글의 내용과 일치하지 않는 것은?", "c": ["돌아오지 않은 11개는 잃어버리거나 부서졌다.", "반납 날짜는 3월에 서명하는 서류에 적혀 있다.", "학교는 뜻하지 않게 5만 5천 원을 갖게 되었다.", "사무실은 보증금 덕분에 보면대가 돌아온다고 한다."], "a": 0}}, {"t": "Fifty Minutes in One Chair", "s": ["A class in our school runs for fifty minutes without a break.", "The chairs were bought when the school opened, twenty two years ago.", "They are one size, and the students in our year are not.", "A chair that fits nobody in particular fits the shortest and tallest worst.", "Six students in our class sit forward on the edge for most of a lesson.", "Our science teacher lets us stand at the back whenever we want.", "Four of the six use that every lesson she teaches.", "The same four sit still in every other room in the building.", "They are not restless students; they are students in a chair that does not fit.", "Standing at the back costs the school nothing at all.", "It is a rule that one teacher made and nobody else has copied.", "Any teacher could allow it tomorrow without asking anyone.", "New chairs would cost more than this school can spend at once.", "Every room in our school should allow standing at the back.", "Permission costs one sentence.", "The cheapest fix is often the one nobody thinks to name."], "q1": {"q": "글쓴이의 주장으로 알맞은 것은?", "c": ["모든 교실에서 뒤에 서서 수업을 듣게 허락하자.", "교실 의자는 22년 전 학교가 열 때 산 것이다.", "학생 몸에 맞는 새 의자를 이번에 모두 사자.", "가만히 못 앉는 학생은 과학 시간에만 서게 하자."], "a": 0}, "q2": {"q": "글쓴이가 네 학생을 '산만한 학생이 아니다'라고 본 근거는?", "c": ["그 네 명이 다른 교실에서는 가만히 앉아 있다.", "과학 선생님이 그 네 명에게만 서도 된다고 했다.", "그 네 명은 과학 시간에 한 번도 서지 않았다.", "그 네 명은 몸에 맞는 새 의자를 받았다."], "a": 0}}, {"t": "Where the Baskets Are", "s": ["Our town put twenty waste baskets along the river path last year.", "The baskets stand at every corner where two paths meet.", "The town chose corners because a corner is easy to find on a map.", "People drop waste where they finish something, not where paths meet.", "Most of what people finish on that path is finished on a seat.", "There are fourteen seats and not one of them has a basket beside it.", "The cleaning team collects most of the loose waste within four steps of a seat.", "They have known this for a year and have not been asked.", "A basket placed by a map catches what a map would drop.", "Moving eight baskets from corners to seats costs one morning of work.", "The corners would still have twelve, which is more than they ever fill.", "Our town should move eight baskets from the corners to the seats.", "The cleaning team could have said where to put them a year ago.", "They were never the ones the town asked.", "A map knows where the paths are.", "The people who sweep know where the waste is."], "q1": {"q": "이 글의 요지로 알맞은 것은?", "c": ["쓰레기통은 지도가 아니라 쓰레기가 나오는 곳에 두어야 한다.", "강변길에는 모퉁이마다 쓰레기통이 놓여 있다.", "사람들은 길이 만나는 모퉁이에 쓰레기를 가장 많이 버린다.", "강변길에 쓰레기통을 스무 개 더 사서 놓아야 한다."], "a": 0}, "q2": {"q": "글의 내용과 일치하는 것은?", "c": ["흩어진 쓰레기는 대부분 의자 가까이에서 나온다.", "의자 열네 개 중 몇 개 옆에만 쓰레기통이 있다.", "청소 팀이 1년 전에 쓰레기통 자리를 정했다.", "여덟 개를 옮기면 모퉁이에는 하나도 안 남는다."], "a": 0}}, {"t": "The Job Nobody Named", "s": ["Someone in our school opens eleven doors before seven every morning.", "Someone checks that twenty two rooms are warm.", "Someone finds the room where a window was left open all night.", "No plan in the building has a line for any of this.", "The work appears in no plan and shows up only when it is missed.", "In March that person was away for two days.", "Four lessons started fifteen minutes late and one room stayed cold.", "The school then learned in two days what the job was.", "Work that is only seen when it stops is work nobody can plan around.", "Nobody hid it; there was simply never a page to write it on.", "One page would list the eleven doors and the twenty two rooms.", "Anyone could then do it for two days without the building noticing.", "Our school should write that page and keep it by the office key box.", "A job with no name cannot be shared, taught, or thanked.", "It can only be missed.", "A page costs nothing and lasts longer than the person who wrote it."], "q1": {"q": "이 글의 요지로 알맞은 것은?", "c": ["이름 없는 일은 적어 두어야 나누고 가르칠 수 있다.", "그 사람은 아침 7시 전에 문 열한 개를 연다.", "누군가 그 일을 일부러 숨겨 왔기 때문에 문제가 생겼다.", "그 일을 맡은 사람은 하루도 쉬지 않아야 한다."], "a": 0}, "q2": {"q": "글의 내용과 일치하지 않는 것은?", "c": ["그 사람이 쉰 3월에도 수업은 제때 시작했다.", "그 일은 학교 계획 어디에도 적혀 있지 않다.", "그 사람이 쉰 이틀 동안 교실 하나가 추웠다.", "글쓴이는 그 쪽지를 열쇠함 옆에 두자고 했다."], "a": 0}}, {"t": "A Tool for One Hand", "s": ["Our art room has fourteen pairs of scissors in one box.", "Thirteen of them are made for a right hand.", "One left handed pair was bought four years ago and has a broken screw.", "Four students in our class write with their left hand.", "They use right handed scissors and cut a line that wanders.", "Our art teacher marks a wandering line as a lack of care.", "A tool made for one hand teaches the other hand that it is careless.", "The four have been told to slow down every year since they were seven.", "Slowing down does not fix a line cut with the wrong tool.", "Nobody chose to buy thirteen of one kind; the box came that way.", "A left handed pair costs the same as a right handed one.", "Our art room should buy four left handed pairs this term.", "Four of them would cost less than one large sheet of good paper.", "A wandering line has been read as a wandering student for six years.", "The box was the only thing that needed changing.", "Four pairs of scissors would end six years of a wrong word."], "q1": {"q": "이 글의 요지로 알맞은 것은?", "c": ["도구 탓에 삐뚤어진 선을 학생 탓으로 잘못 보았다.", "미술실 가위 14개 중 13개가 오른손용이다.", "왼손잡이 학생들은 더 천천히 조심해서 자르기만 하면 된다.", "미술 선생님은 선을 보고 점수를 매기면 안 된다."], "a": 0}, "q2": {"q": "글의 내용과 일치하는 것은?", "c": ["왼손용 가위는 오른손용 가위와 값이 같다.", "4년 전 산 왼손용 가위는 지금도 잘 쓰인다.", "누군가 일부러 오른손용 가위만 골라 샀다.", "네 학생은 천천히 자르자 선이 곧아졌다."], "a": 0}}, {"t": "The Word That Changed Meaning", "s": ["Our school rule book uses the word device in four places.", "The book was written in two thousand four.", "A device then meant a calculator or a music player.", "A device now means the thing a student reads a book on.", "The rule says devices are not allowed in the reading room.", "The reading room therefore does not allow reading on a screen.", "Nobody wrote that rule to keep books out of the reading room.", "The word moved and the rule stayed where it was.", "A rule written in old words keeps its shape and loses its aim.", "Two teachers now read the rule two different ways in the same week.", "Writing the four lines again would take one meeting of thirty minutes.", "Our school should write the four device lines again this term.", "A rule book is not a record of what we once thought.", "It is a set of orders people follow tomorrow.", "Words that move under a rule leave the rule standing in the wrong place.", "The book has not changed in twenty two years, so the reading room has."], "q1": {"q": "이 글의 요지로 알맞은 것은?", "c": ["낱말 뜻이 바뀌면 옛 규칙이 엉뚱하게 작동한다.", "학교 규칙 책은 2004년에 쓰인 것이다.", "처음부터 독서실에서 화면 읽기를 막으려던 규칙이다.", "규칙 책은 해마다 처음부터 새로 써야 한다."], "a": 0}, "q2": {"q": "글의 내용과 일치하는 것은?", "c": ["두 교사가 같은 주에 그 규칙을 서로 다르게 읽는다.", "2004년에 기기는 책을 읽는 화면을 뜻했다.", "네 줄을 다시 쓰려면 긴 회의를 여러 번 해야 한다.", "규칙 책에 '기기'라는 말은 한 번만 나온다."], "a": 0}}], "9": [{"t": "The Attendance Figure", "s": ["Our school reports attendance as a single figure at the end of each term.", "Last term the figure was ninety four percent.", "The town uses that number to compare our school with eleven others.", "Ninety four percent sounds like a school where almost everyone comes.", "It is also what you get when twenty eight students miss forty days between them.", "The same figure covers both of those schools.", "We looked at who the missing days belonged to.", "Two hundred and ten students missed no more than two days each.", "Nineteen students missed more than fifteen days.", "Those nineteen account for more than half of the days lost.", "A single number cannot hold a group that is split like that.", "The office is not hiding the split; nobody has ever asked for it.", "The town form has one box, so the school fills one box.", "Our school should report attendance as two numbers, not one.", "A figure that fits a box decides what anyone can see.", "The nineteen are the students a school would most want to find.", "They are also the only ones the reported number makes invisible.", "Adding a second line would take the office about ten minutes a term.", "The first number would say how the school is doing.", "The second would say who needs somebody to notice."], "q1": {"q": "이 글의 요지로 가장 알맞은 것은?", "c": ["출석을 두 숫자로 알려 결석이 몰린 학생들이 보이게 해야 한다.", "열아홉 명이 잃어버린 수업일의 절반 넘게를 차지하고 있다.", "사무실이 결석 분포를 숨기고 있으니 따로 점검을 받아야 한다.", "출석률 같은 숫자 하나로 학교를 서로 비교하는 일은 그만두어야 한다."], "a": 0}, "q2": {"q": "글의 내용과 일치하는 것은?", "c": ["이틀 이하로 빠진 학생은 이백열 명이었다.", "열닷새 넘게 빠진 학생은 스물여덟 명이었다.", "마을은 이 학교를 다른 열다섯 학교와 비교한다.", "두 번째 숫자를 더하려면 학기마다 한 시간쯤 든다."], "a": 0}}, {"t": "Who Grants the Exception", "s": ["Our club rules say a member may miss two meetings a term.", "Missing a third means leaving the club.", "The rule adds that the leader may allow more in a special case.", "It does not say what a special case is.", "Last term the leader allowed four extra absences and refused three.", "The seven students had reasons that a stranger could not tell apart.", "One refused case was a student who works in a family shop on Fridays.", "One allowed case was a student who plays in the town band on Fridays.", "The leader knew about the band and had never heard about the shop.", "A rule that depends on what a leader happens to know is not one rule.", "It is as many rules as there are things the leader has been told.", "Nobody was treated unfairly on purpose.", "The gap was in what had reached the leader, not in what she thought.", "A short list of what counts would take one meeting to write.", "Work, family duty, health, and travel would cover almost every case.", "Our club should write down what counts as a special case.", "Then a member would know before asking, and so would the leader.", "A written list can be argued with and changed.", "What a leader happens to know cannot be argued with.", "It can only be guessed at by everyone who does not have it."], "q1": {"q": "글쓴이가 제안하는 것은?", "c": ["어떤 경우가 특별한 사정인지 목록으로 적어 두자.", "가게 일을 돕는 학생의 결석도 똑같이 허락해 주자.", "대표가 불공평했으니 예외 결정권을 회원에게 넘기자.", "예외를 없애고 세 번 빠지면 모두 탈퇴하게 하자."], "a": 0}, "q2": {"q": "글의 내용과 일치하는 것은?", "c": ["대표는 밴드 활동은 알았지만 가게 일은 몰랐다.", "지난 학기 대표는 일곱 명 모두의 결석을 허락했다.", "대표는 가게 일 하는 학생을 일부러 불리하게 대했다.", "회원은 한 학기에 세 번까지 모임에 빠질 수 있다."], "a": 0}}, {"t": "The Shared Folder", "s": ["Our year group keeps its lesson materials in one shared folder.", "Anyone can add a file and anyone can move one.", "The folder has grown to about nine hundred files in three years.", "There is no rule about naming a file.", "Sixty of the files are called something like new or final or copy.", "Teachers now keep a private copy of anything they need to find again.", "The shared folder is used to put things in and not to take things out.", "A shared place with no naming rule becomes a place people stop searching.", "Nobody broke a rule, because there was no rule to break.", "Two teachers told us they had made a lesson sheet again that already existed.", "One of them made it again twice, a year apart.", "The time that goes into making things again is invisible on every plan.", "It shows up only as a teacher staying late in September.", "A naming rule of three parts would fit on one line.", "Year, subject, and what the file is would be enough.", "Giving nine hundred files new names is too much, and new files are not.", "Our year group should agree one naming rule for files added from now on.", "The old nine hundred can stay as they are.", "A shared folder is only shared if two people can find the same thing.", "Until then it is nine hundred private folders in one place."], "q1": {"q": "이 글의 요지로 가장 알맞은 것은?", "c": ["새로 넣는 파일부터 이름 규칙을 정해야 함께 쓰는 폴더가 된다.", "같은 학습지를 한 해 간격으로 두 번 다시 만든 선생님이 있다.", "옛 파일 구백 개의 이름을 모두 바꿔야 찾기 쉬워진다.", "공유 폴더는 쓸모가 없으니 각자 따로 보관하는 게 낫다."], "a": 0}, "q2": {"q": "글의 내용과 일치하지 않는 것은?", "c": ["폴더의 파일은 세 해 동안 약 육백 개로 늘었다.", "누구나 파일을 넣을 수 있고 옮길 수도 있다.", "new, final, copy 같은 이름의 파일이 육십 개쯤 있다.", "선생님들은 다시 찾을 자료를 따로 복사해 둔다."], "a": 0}}, {"t": "Two Minutes Late", "s": ["Our first lesson closes its door at eight thirty exactly.", "A student who arrives after that waits in the corridor until the next lesson.", "The rule was made to stop late students walking in through the first ten minutes.", "It has worked; they no longer walk in.", "Fourteen students in our year now miss a whole lesson about once every two weeks.", "Almost all of them arrive between eight thirty and eight thirty five.", "A student who is two minutes late loses fifty minutes.", "The lesson loses the student for fifty minutes as well.", "The rule solved a small problem and made a larger one.", "Nobody built it to cost fifty minutes; it was built to protect the first ten.", "A door that closes is easy to run and easy to describe.", "A door that opens quietly at the back needs a rule about how to enter.", "That rule is harder to write and it is the one that fits the problem.", "Late students could enter through the back and sit in a marked seat.", "They would miss the first minutes and keep the other forty five.", "Our school should let late students enter quietly instead of waiting outside.", "The teacher would not have to stop teaching to let anyone in.", "Fifty minutes is a heavy price for two.", "It is also a price the lesson pays and not only the student.", "Both of them are standing outside that door."], "q1": {"q": "이 글의 요지로 가장 알맞은 것은?", "c": ["늦은 학생을 밖에 세우지 말고 뒤로 조용히 들어오게 해야 한다.", "늦은 학생 대부분은 여덟 시 반부터 삼십오 분 사이에 온다.", "지각이 잦은 열네 명에게는 지금보다 훨씬 더 엄한 벌을 주어야 한다.", "수업이 시작되면 늦은 학생은 모두 막는 것이 옳다."], "a": 0}, "q2": {"q": "글쓴이가 지금의 규칙을 문제로 보는 까닭은?", "c": ["이 분 늦은 학생이 수업 오십 분을 통째로 잃어서", "늦은 학생들이 첫 십 분 동안 계속 걸어 들어와서", "선생님이 문을 열어 주느라 수업을 자주 멈추어서", "문 닫는 규칙으로도 늦게 걸어 들어오는 일이 줄지 않아서"], "a": 0}}, {"t": "Teaching the Same Lesson Twice", "s": ["Our science teacher teaches the same lesson to two classes on a Tuesday.", "The first class has it at nine and the second at two.", "She has taught this pair of lessons for six years.", "The second class marks about seven percent higher on the unit test.", "The gap has been there in each of the six years.", "She noticed it in the second year and has changed nothing since.", "The second lesson is the same lesson taught by somebody who has just taught it.", "The first class is not being taught worse; it is being taught first.", "Every teacher has a first class and somebody has to be in it.", "What the first class pays for is the teacher finding the best way through.", "That cost has fallen on the morning class for six years running.", "Nobody could have removed it without removing the first lesson.", "The order of two lessons could simply swap each term.", "The morning class would then be second for half of the year.", "Nothing else about the plan would have to move.", "The seven percent would be shared instead of always falling on one room.", "Our school should swap the order of repeated lessons each term.", "A first lesson is where a teacher learns the lesson.", "That learning is worth having and somebody always pays for it.", "The only question is whether the same class pays every time."], "q1": {"q": "글쓴이가 제안하는 것은?", "c": ["반복 수업의 순서를 학기마다 바꿔 첫 수업의 몫을 나누자.", "오후 반 점수가 높으니 오후 반 방식을 아침 반에 쓰자.", "아침 반이 손해이므로 아침 수업을 없애고 오후로 몰자.", "같은 수업을 두 번 하지 말고 두 반을 한 번에 가르치자."], "a": 0}, "q2": {"q": "글의 내용과 일치하는 것은?", "c": ["선생님은 둘째 해에 차이를 알았지만 아무것도 바꾸지 않았다.", "점수 차이는 여섯 해 가운데 몇 해에만 나타났다.", "첫 반은 아홉 시에, 둘째 반은 열한 시에 수업을 듣는다.", "첫 반 점수가 낮은 까닭은 선생님이 아침에 덜 열심히 가르쳐서이다."], "a": 0}}, {"t": "Ten Thousand Won", "s": ["Our year goes on a museum trip in October.", "The trip costs ten thousand won for the bus.", "The museum itself is free.", "A hundred and four students went last year.", "Twenty nine did not go.", "Nineteen of the twenty nine gave no reason on the form.", "A form with a box for a reason is not an easy box to fill in.", "The school has a fund that pays the ten thousand for anyone who asks.", "Four students asked last year.", "Asking means telling an office that your family cannot find ten thousand won.", "The fund is not small; it could have paid for all twenty nine.", "It is not the money that was missing.", "It is the asking, and asking was made the price of the help.", "The trip could be paid for out of the fund for everybody.", "Families who can pay would be asked to give ten thousand towards it.", "The money would come from the same places it comes from now.", "Nobody would have to say anything at an office window.", "Our school should pay for the trip first and ask for the money after.", "Help that has to be asked for out loud is not help for everyone.", "It is help for the people who can bear the asking."], "q1": {"q": "이 글의 요지로 가장 알맞은 것은?", "c": ["부탁해야 받는 도움은 모두를 못 도우니 비용을 먼저 내 주자.", "지난해 기금에 도움을 청한 학생은 네 명뿐이었다.", "기금이 모자라므로 가정마다 돈을 더 걷어서 기금을 늘려야 한다.", "견학 비용이 부담되니 박물관 견학을 없애는 것이 낫다."], "a": 0}, "q2": {"q": "글의 내용과 일치하지 않는 것은?", "c": ["학교 기금으로는 스물아홉 명의 비용을 다 댈 수 없었다.", "박물관 입장료는 없고 버스비로 만 원이 든다.", "가지 않은 스물아홉 중 열아홉은 이유를 적지 않았다.", "지난해에는 학년 학생 가운데 백네 명이 박물관 견학에 갔다."], "a": 0}}, {"t": "The Tap That Works", "s": ["Our school has four water taps for six hundred students.", "Two of them are by the playing field.", "One is by the office and one is by the science rooms.", "The two by the field are turned off from November to March.", "That leaves two taps for the whole winter.", "We counted forty one students waiting at the office tap one morning.", "The line took eleven minutes to clear.", "Eleven minutes is most of a break spent standing still.", "Twenty of the forty one left the line before they reached the tap.", "Students who bring a bottle from home do not stand in that line.", "Students who do not bring one drink less in winter than in summer.", "Nobody turned the field taps off to make people thirsty.", "They were turned off because the water lines broke twice four years ago.", "The water line by the field could be covered for about thirty thousand won.", "The school covered the water line by the kitchen in the same way last year.", "That tap has run all winter since.", "Two more taps in winter would make four instead of two.", "Our school should cover the field water lines and leave those taps on.", "A tap that is off for four months is off for a third of the year.", "The line at the other tap is where those four months get paid for."], "q1": {"q": "이 글의 요지로 가장 알맞은 것은?", "c": ["운동장 수도관을 감싸 겨울에도 꼭지 넷을 다 쓰게 해야 한다.", "겨울 아침 사무실 꼭지의 줄이 비는 데 십일 분이 걸렸다.", "줄이 기니 학생들은 집에서 물병을 챙겨 와야 한다.", "수도관이 또 터질 수 있으니 겨울에는 운동장 꼭지를 잠그는 게 옳다."], "a": 0}, "q2": {"q": "글의 내용과 일치하는 것은?", "c": ["부엌 쪽 수도관은 작년에 감싼 뒤 겨울 내내 물이 나왔다.", "운동장 꼭지는 십일월부터 오월까지 잠겨 있다.", "아침에 줄 선 마흔한 명은 모두 끝까지 기다려 물을 마셨다.", "운동장 수도관을 감싸는 데 약 삼십만 원이 든다."], "a": 0}}, {"t": "Who Reads the Notice", "s": ["Our school puts club notices on a board by the main door.", "The board holds about twenty sheets.", "New notices go on top of old ones.", "A notice stays on top for about two days.", "Eleven clubs put a notice up last term.", "The three clubs that put theirs up on a Monday got most of the new members.", "Those three took ninety of the hundred and forty new members.", "A board where new covers old is a board about timing, not about clubs.", "The chess club put its notice up on a Thursday and got four members.", "It had thirty one members three years ago.", "Nothing about the club itself changed in those three years.", "Nobody decided that Monday clubs should be bigger.", "The board decided it, two days at a time.", "Each club could have its own numbered space on the board.", "Twenty spaces would hold the eleven clubs twice over.", "A notice would stay where it was put for the whole term.", "A student would look in the same place each time.", "Nothing would cover anything.", "Our school should give each club a fixed space on the board.", "A place where everything is put on top of everything is not a board."], "q1": {"q": "이 글의 요지로 가장 알맞은 것은?", "c": ["고정 자리를 주어 공지 붙인 날이 회원 수를 가르지 않게 하자.", "월요일에 공지를 붙인 세 동아리가 신입 대부분을 데려갔다.", "체스 동아리는 인기를 잃었으니 활동 내용부터 새로 바꿔야 한다.", "동아리 공지는 모두 월요일에 붙여야 회원을 모을 수 있다."], "a": 0}, "q2": {"q": "글의 내용과 일치하는 것은?", "c": ["체스 동아리는 목요일에 공지를 붙여 네 명을 얻었다.", "공지 하나는 보통 일주일쯤 맨 위에 남아 있다.", "월요일에 붙인 세 동아리는 신입 백사십 명 가운데 쉰 명을 얻었다.", "지난 학기 공지를 붙인 동아리는 스무 곳이었다."], "a": 0}}], "10": [{"t": "What the Attendance Number Holds", "s": ["Our school reports one attendance number to the office each month.", "It is the share of lessons that students were present for.", "Last month the number was ninety four percent.", "The month before it was ninety four as well.", "Two hundred and forty students are counted in it.", "The number has moved less than one point in three years.", "A number that does not move is easy to report and hard to learn from.", "Behind last month there are two different groups.", "Two hundred and eleven students missed fewer than three lessons.", "Twenty nine missed more than fifteen.", "The same twenty nine appear in almost every month we checked.", "One number cannot say both of those things at once.", "Our school should report the share of students missing more than fifteen lessons as well.", "It is one more line on the same sheet.", "It would move when the twenty nine change and stay still when they do not.", "The ninety four would still be reported beside it.", "A single number is a summary, and a summary hides what it holds.", "The thing worth watching has been inside it all along."], "q1": {"q": "이 글의 요지로 가장 알맞은 것은?", "c": ["출석률 옆에 열다섯 번 넘게 빠진 학생 비율도 함께 알려야 한다.", "지난달 출석률은 그 전달과 같은 구십사 퍼센트였다.", "출석률은 늘 같으니 그만 알리고 결석이 많은 학생 수만 따로 알리자.", "출석률이 변하지 않으니 학교 출석에는 문제가 없다."], "a": 0}, "q2": {"q": "글의 내용과 일치하는 것은?", "c": ["열다섯 번 넘게 빠진 스물아홉 명은 거의 매달 같은 학생이다.", "학교 출석률은 지난 세 해 동안 다섯 점이 넘게 오르고 내리기를 되풀이했다.", "출석률은 학기마다 한 번씩 사무실에 보고된다.", "세 번 미만 빠진 학생은 이백사십 명 전부였다."], "a": 0}}, {"t": "The Form With One Box", "s": ["Our school asks families to report a change of address on a form.", "The form has one box for a new address.", "It has no box for a second address.", "Fourteen students in our year live in two homes.", "Their families write one address and hope the right post arrives.", "Six of them told us a letter went to the wrong home last year.", "A form with one box says a student has one home.", "It says so without a word, to every family that fills it in.", "The office keeps what the box holds and sends everything there.", "Nobody in the office chose which home to write to.", "The form chose, four years ago, when somebody drew one box.", "A second box costs one line of paper and no more.", "Fourteen families would use it this year.", "The rest would leave it empty as they do now.", "Our school should put a second address box on the form.", "The office would send two copies where two are needed.", "A form is a picture of the families a school expects.", "Six letters last year went to a home that picture did not have."], "q1": {"q": "이 글의 요지로 가장 알맞은 것은?", "c": ["주소 서식에 둘째 칸을 두어 두 집에 사는 학생을 담아야 한다.", "지난해 여섯 가정의 편지가 엉뚱한 집으로 갔다.", "사무실 직원이 편지 보낼 집을 잘못 골랐으니 그것부터 바로잡아야 한다.", "서식은 꼭 필요한 칸만 두고 짧게 유지해야 한다."], "a": 0}, "q2": {"q": "글쓴이가 지금의 서식을 문제로 보는 까닭은?", "c": ["칸이 하나뿐이라 학생의 집을 하나로 정해 버려서", "둘째 칸을 넣으려면 종이 한 장이 더 들어서", "두 집에 사는 열네 가정이 모두 편지를 잘못 받아서", "사무실이 두 집 중 한 곳을 일부러 골라 보내서"], "a": 0}}, {"t": "Who Locks the Door", "s": ["The last person out of our music room locks it.", "The rule is written on a card by the light switch.", "It does not say who the last person is.", "The room is used until six on four days a week.", "It was left open eleven times last term.", "Nine of those eleven were on a Thursday.", "Thursday is the day the room empties in twos and threes.", "A room that empties all at once has a last person.", "A room that empties slowly has nobody who knows they are last.", "Two guitars went missing in March.", "Nobody was careless; everybody was second to last.", "The rule names a person who does not exist on Thursdays.", "A named student could hold the key on Thursday.", "The club already has a member who stays until six every week.", "She would lock it whether or not she was last.", "The rule would name somebody who is always there.", "Our music club should give one named student the Thursday key.", "A rule that describes a person is only a rule when that person exists."], "q1": {"q": "이 글의 요지로 가장 알맞은 것은?", "c": ["목요일 열쇠를 정해진 학생 한 명에게 맡겨야 한다.", "지난 학기 음악실이 열린 채 남은 것은 열한 번이었다.", "기타를 잃었으니 부주의한 학생을 찾아 벌해야 한다.", "마지막 사람이 잠그는 규칙만 잘 지키면 문제는 없다."], "a": 0}, "q2": {"q": "글의 내용과 일치하는 것은?", "c": ["열린 채 남은 열한 번 가운데 아홉 번은 목요일이었다.", "음악실 카드에는 규칙과 함께 누가 마지막 사람인지 적혀 있다.", "음악실은 일주일에 닷새, 여섯 시까지 쓰인다.", "목요일에는 음악실 학생들이 한꺼번에 나간다."], "a": 0}}, {"t": "The Coat That Has To Last", "s": ["Our school asks students to come in a dark coat in winter.", "The school shop sells one for forty thousand won.", "Eleven students in our year nee eds a person who works on clocks.", "Nobody at our school works on clocks, and the company that does comes in July.", "The clock could be taken down in five minutes.", "Any teacher could do it standing on a chair.", "A wall with nothing on it is honest.", "It would stay honest until July.", "Our school should take the clock down until it can be mended.", "A broken thing left in place does not stop answering; it answers wrongly."], "q1": {"q": "이 글의 요지로 가장 알맞은 것은?", "c": ["고칠 수 있을 때까지 멈춘 시계를 벽에서 내려 두어야 한다.", "멈춘 시계 탓에 늦었다는 학생이 아홉 명이었다.", "고장 신고를 지금보다 더 자주 해서 시계를 빨리 고쳐 받아야 한다.", "학교 벽에는 시계를 아예 걸지 않는 것이 좋다."], "a": 0}, "q2": {"q": "글의 내용과 일치하지 않는 것은?", "c": ["시계를 고치는 업체는 구월에 학교에 온다.", "시계는 삼월에 두 시 십 분에서 멈췄다.", "시계가 고장 났다는 신고는 네 번 있었다.", "교사 누구나 의자에 올라 시계를 내릴 수 있다."], "a": 0}}, {"t": "The Rule That Is Never Used", "s": ["Our school has a rule that a student may ask to change class once a year.", "The rule is printed in the book every family gets in September.", "It says a student should write to the head of year.", "Nobody has used it in four years.", "The head of year told us she has never had a letter like that.", "Sixty one students said in a survey that they would like to change class.", "A rule that sixty one people want and nobody uses is a rule with something in front of it.", "What is in front of it is a letter to a person most students have not met.", "Our head of year teaches no lessons in our year.", "Students see her at assembly, and at no other time.", "Nobody made the letter hard on purpose.", "A letter is simply how the rule was written.", "A form with three lines could take the place of the letter.", "Our school should replace the letter with a short form.", "The form could go to the same person.", "It would ask for a name, a class and a reason.", "A rule is only as open as the hardest step inside it.", "Ours has been closed by one letter for four years."], "q1": {"q": "이 글의 요지로 가장 알맞은 것은?", "c": ["반 바꾸기 신청을 편지 대신 짧은 서식으로 받아야 한다.", "설문에서 예순한 명이 반을 바꾸고 싶다
