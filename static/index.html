<script type="text/babel" src="/games.js"></script>
<script type="text/babel" src="/sgames.js"></script>
<script type="text/babel" src="/student.js"></script>
<script>
/* ★뒤로 막기(2026-11-09 원장 "학습중 로그아웃이 되면 안 돼") — 포털 카드는 앱을 새 탭으로 연다. 안드로이드 태블릿에서
   '뒤로'(가장자리 밀기·◁)를 하면 앱 안 이전 화면이 아니라 탭이 통째로 닫혀 포털로 돌아갔다.
   아이들은 문제 중간에 뒤로를 하고, 포털에서 다시 눌러 들어오기를 1분마다 반복했다(htt011·htt028, 학원 태블릿).
   그래서 포털에서 들어온 화면(?sid=)에서는 '뒤로'를 누르면 먼저 묻고, [취소]면 그 자리에 머문다.
   ※크롬은 손대지 않고 넣은 기록은 '뒤로' 때 건너뛰므로, 화면을 만질 때마다(처음·취소 뒤) 한 칸 넣어 둔다. */
(function(){
  try{
    if(!/[?&]sid=/.test(location.search) || !window.history || !history.pushState) return;
    var PORTAL = 'https://student.happytreeacademy.com/';
    var armed = false, again = false;
    function push(){ try{ history.pushState({ htBack: 1 }, '', location.href); armed = true; }catch(e){} }
    function onTouch(){ if(!armed || again){ again = false; push(); } }
    ['pointerdown', 'touchstart', 'keydown'].forEach(function(ev){ document.addEventListener(ev, onTouch, true); });
    window.addEventListener('popstate', function(){
      armed = false;
      if(confirm('학습을 그만하고 학생 포털로 나갈까요?\n계속 공부하려면 [취소]를 눌러요.')){
        try{ window.close(); }catch(e){}
        setTimeout(function(){ location.href = PORTAL; }, 300);
      } else { push(); again = true; }
    });
  }catch(e){}
})();
</script>
</body>
</html>
