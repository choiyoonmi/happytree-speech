<script type="text/babel">
const { useState, useEffect, useRef } = React;

pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const TAKES = 3;

/* 관리자 비밀번호는 관리자 API 를 여는 열쇠이기도 하다.
   선생님이 로그인할 때 받아 두고, 이후 모든 요청에 x-ht-admin 으로 붙여 보낸다.
   (전교생 명단·백업·과제 지우기 같은 동작은 서버가 이 헤더를 확인한다.)
   sessionStorage 라서 탭을 닫으면 사라진다 — 학생 기기에 남지 않는다. */
let ADMIN_KEY = "";
try { ADMIN_KEY = sessionStorage.getItem("tt_admin") || ""; } catch (e) {}
function setAdminKey(pw) {
  ADMIN_KEY = pw || "";
  try { pw ? sessionStorage.setItem("tt_admin", pw) : sessionStorage.removeItem("tt_admin"); } catch (e) {}
}

/* 관리자 화면에는 api() 를 안 거치고 fetch 를 직접 부르는 곳이 여남은 군데 있다
   (과제 삭제·수정 등). 한 곳씩 고치면 빠뜨리기 쉬워서, /api 로 나가는 요청 전부에
   여기서 열쇠를 붙인다. 학생 화면은 ADMIN_KEY 가 비어 있으니 아무것도 붙지 않는다. */
const _fetch = window.fetch.bind(window);
window.fetch = function (input, init) {
  try {
    const u = typeof input === "string" ? input : (input && input.url) || "";
    if (ADMIN_KEY && u.indexOf("/api") === 0) {
      init = { ...(init || {}) };
      init.headers = { ...(init.headers || {}), "x-ht-admin": ADMIN_KEY };
    }
  } catch (e) {}
  return _fetch(input, init);
};

async function api(path, opts) {
  const res = await fetch("/api" + path, opts);
  if (!res.ok) {
    let msg = "요청에 실패했어요.";
    try { const j = await res.json(); msg = j.detail || msg; } catch (e) {}
    throw new Error(msg);
  }
  return res.json();
}
const apiGet = (p) => api(p);
const apiPost = (p, body) => api(p, {
  method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {})
});
const apiDelete = (p) => api(p, { method: "DELETE" });

const STUDENT_PORTAL = "https://student.happytreeacademy.com/";   // 학생 포털(허브) — 문해숨·수학숨 등

// ---- 웹 푸시 ----
function urlB64ToUint8(base64String) {
  const pad = "=".repeat((4 - base64String.length % 4) % 4);
  const b64 = (base64String + pad).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(b64);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
const pushSupported = () => ("serviceWorker" in navigator) && ("PushManager" in window) && ("Notification" in window);
async function enablePush(studentId) {
  if (!pushSupported()) throw new Error("이 기기(브라우저)는 알림을 지원하지 않아요. 크롬으로 열거나, 아이폰은 홈 화면에 추가한 뒤 다시 시도해주세요.");
  const perm = await Notification.requestPermission();
  if (perm !== "granted") throw new Error("알림이 허용되지 않았어요. 브라우저 설정에서 알림을 허용해주세요.");
  const reg = await navigator.serviceWorker.ready;
  const { publicKey } = await apiGet("/push/key");
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8(publicKey) });
  await apiPost(`/push/subscribe/${studentId}`, sub.toJSON());
  return true;
}
async function disablePush(studentId) {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) { await apiPost(`/push/unsubscribe/${studentId}`, sub.toJSON()); await sub.unsubscribe(); }
  } catch (e) {}
}
// 학생이 학습을 시작하면 실시간 현황판에 알림 (실패해도 무시)
const pingActivity = (sid, kind, title) => apiPost(`/activity/${sid}`, { kind, title }).catch(()=>{});

function normalizeTakes(v) {
  const arr = Array.isArray(v) ? v.slice(0, TAKES) : [];
  while (arr.length < TAKES) arr.push(null);
  return arr;
}
function formatDue(d) {
  if (!d) return null;
  const [y, m, day] = d.split("-").map(Number);
  return `${m}/${day}`;
}
// 교재 이름이 따로 없을 때, 제목 끝의 "Day/Unit/Lesson N"을 떼어 같은 시리즈로 묶는다.
function seriesOf(title) {
  return (title || "").replace(/\s*(?:day|unit|lesson|lec|chapter)\s*\d+\s*$/i, "")
    .replace(/\s*\d+\s*(?:일차|유닛|레슨|과|강|주차|챕터|단원)\s*$/, "").trim() || (title || "");
}
// 제목의 "Day/Unit/Lesson/과 N"에서 숫자만 뽑는다(정렬용). 없으면 null.
function dayNum(title) {
  const t = title || "";
  const m = /(?:day|unit|lesson|lec|chapter)\s*(\d+)/i.exec(t)
    || /(?:유닛|레슨|단원|챕터)\s*(\d+)/.exec(t)
    || /(\d+)\s*(?:일차|과|강|주차)/.exec(t);
  return m ? parseInt(m[1], 10) : null;
}
function dueStatus(d) {
  if (!d) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  const [y, m, day] = d.split("-").map(Number);
  const due = new Date(y, m - 1, day); due.setHours(0,0,0,0);
  const diff = Math.round((due - t) / 86400000);
  return diff < 0 ? "overdue" : diff === 0 ? "today" : "upcoming";
}
function scoreTone(s) {
  if (s == null) return "b-gray";
  if (s >= 85) return "b-navy";
  if (s >= 60) return "b-gold";
  return "b-danger";
}
function nowStr() {
  const d = new Date();
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

function splitMeaning(line) {
  // "apple / 사과" 또는 "apple - 사과" 형태를 분리
  const m = line.split(/\s+[/|\-–]\s+/);
  if (m.length >= 2) return { text: m[0].trim(), meaning: m.slice(1).join(" ").trim() };
  return { text: line.trim(), meaning: "" };
}

// ---------- 문장 다루기 ----------
// 문장 끝처럼 보이지만 아닌 것들(Mr. Dr. e.g. U.S. …)
const SENT_ABBR = /(?:^|[\s("'“‘])(?:mr|mrs|ms|dr|prof|st|mt|sgt|jr|sr|vs|etc|e\.g|i\.e|a\.m|p\.m|u\.s|u\.k|fig|no|vol|approx|inc|ltd|ave|dept)$/i;

// PDF·문서에서 줄바꿈으로 잘린 문장을 다시 이어 붙인다. (빈 줄 = 문단 경계)
function reflowLines(text) {
  const out = [];
  String(text || "").replace(/\r/g, "").split("\n").forEach(raw => {
    const line = raw.trim();
    if (!line) { out.push(""); return; }
    const prev = out.length ? out[out.length - 1] : "";
    // 앞 줄이 문장부호로 끝나지 않았으면 = 문장이 이어지는 중
    const cont = prev && !/[.!?…:;][")\]'”’]?$/.test(prev);
    // 단, 앞 줄이 짧은 제목처럼 보이고(8단어 이하) 다음 줄이 대문자로 새 문장을 시작하면 → 제목이므로 붙이지 않음
    const headingBreak = cont && prev.split(/\s+/).length <= 8 && /^["'“‘(\[]?[A-Z]/.test(line);
    if (cont && !headingBreak) out[out.length - 1] = (prev + " " + line).replace(/\s{2,}/g, " ");
    else out.push(line);
  });
  return out.filter(Boolean).join("\n");
}

// 글을 문장 단위로 자른다. (한 줄에 여러 문장 / 여러 줄에 한 문장 모두 처리)
function splitSentences(text) {
  const out = [];
  reflowLines(text).split("\n").forEach(para => {
    let buf = "";
    for (let i = 0; i < para.length; i++) {
      const ch = para[i];
      buf += ch;
      if (ch !== "." && ch !== "!" && ch !== "?" && ch !== "…") continue;
      let j = i + 1;
      while (j < para.length && /["')\]”’]/.test(para[j])) { buf += para[j]; j++; }   // 닫는 따옴표까지
      const rest = para.slice(j);
      i = j - 1;
      if (rest && !/^\s/.test(rest)) continue;                       // 3.5 / Level 5.1 → 문장 끝 아님
      if (ch === ".") {
        const before = buf.replace(/["')\]”’]*$/, "").slice(0, -1);
        if (SENT_ABBR.test(before)) continue;                        // Mr. Dr. etc.
        if (/(?:^|\s)[A-Z]$/.test(before)) continue;                 // 이니셜 J. K.
      }
      if (rest && !/^\s+["'“‘(\[]?[A-Z0-9가-힣]/.test(rest)) continue; // 다음이 새 문장처럼 안 보이면 계속
      if (buf.trim()) out.push(buf.trim());
      buf = "";
    }
    if (buf.trim()) out.push(buf.trim());
  });
  return out;
}

// 문장 + 한글 뜻 분리. 문장 안의 '-' 는 건드리지 않는다. (첫 한글 글자에서 자름)
function splitSentenceMeaning(line) {
  const s = String(line || "").trim();
  const idx = s.search(/[가-힣]/);
  if (idx <= 0) return { text: s, meaning: "" };
  const text = s.slice(0, idx).replace(/[\s/|·]+$/, "").trim();      // 끝의 구분자만 정리 (마침표는 유지)
  if (!/[a-zA-Z]/.test(text)) return { text: s, meaning: "" };
  return { text, meaning: s.slice(idx).trim() };
}

// 문장 단위로 다시 나눌지 판단.
// ① 문장이 줄보다 많아지거나(한 줄에 여러 문장), ② 줄을 이어 붙였고 결과가 모두 문장부호로 끝날 때만 다시 나눈다.
// (마침표 없이 한 줄에 하나씩 쓴 목록은 그대로 둔다)
function sentencesOrLines(text) {
  const lines = String(text || "").split("\n").map(s => s.trim()).filter(Boolean);
  const sents = splitSentences(text);
  if (!sents.length) return lines;
  if (sents.length > lines.length) return sents;
  const merged = reflowLines(text).split("\n").filter(Boolean).length < lines.length;
  const allEnd = sents.every(t => /[.!?…][")\]'”’]?$/.test(t));
  return (merged && allEnd) ? sents : lines;
}

// 과제 목록 텍스트 → [{text, meaning}]
// 문장 유형은 문장 단위로(sentencesOrLines), 단어 유형은 지금처럼 줄 단위로 읽는다.
function parseItemList(text, type) {
  const lines = String(text || "").split("\n").map(s => s.trim()).filter(Boolean);
  if (type !== "sentence") return lines.map(splitMeaning);
  return sentencesOrLines(text).map(splitSentenceMeaning);
}

// 페이지마다 되풀이되는 줄 = 머리말/꼬리말(교재명·레벨·페이지) → 제거.
// 반복된 단어(복습 유닛)까지 지워지지 않도록 '전체 페이지의 절반 이상'에 나올 때만 버린다.
function dropRunningHeaders(lines, pages) {
  const need = Math.max(3, Math.ceil((pages || 0) * 0.5));
  const count = {};
  lines.forEach(l => { count[l] = (count[l] || 0) + 1; });
  return lines.filter(l => !(count[l] >= need && l.length <= 60));
}

// PDF 한 줄 안의 조각들을 붙인다. 글자 사이 간격이 벌어진 곳에만 공백을 넣는다.
// (그냥 공백으로 이으면 "sunglass es", 그냥 붙이면 단어가 들러붙는다)
function joinPdfItems(items) {
  let line = "", prevEnd = null;
  items.slice().sort((a, b) => a.transform[4] - b.transform[4]).forEach(it => {
    const s = it.str;
    if (!s) return;
    const x = it.transform[4];
    if (prevEnd !== null) {
      const size = Math.abs(it.transform[0]) || it.height || 10;
      if (x - prevEnd > size * 0.2 && !/\s$/.test(line) && !/^\s/.test(s)) line += " ";
    }
    line += s;
    prevEnd = x + (it.width || 0);
  });
  return line.replace(/\s+/g, " ").trim();
}

// PDF 전체를 줄 배열로 (모든 업로드 경로가 이걸 씀)
async function pdfToLines(file) {
  const buf = await file.arrayBuffer();
  const doc = await pdfjsLib.getDocument({ data: buf }).promise;
  const lines = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const content = await (await doc.getPage(p)).getTextContent();
    const byRow = {};
    content.items.forEach(it => { const y = Math.round(it.transform[5]); (byRow[y] = byRow[y] || []).push(it); });
    Object.keys(byRow).map(Number).sort((a, b) => b - a).forEach(y => {
      const line = joinPdfItems(byRow[y]);
      if (line) lines.push(line);
    });
  }
  return { lines, pages: doc.numPages };
}

function useVoice() {
  const [voice, setVoice] = useState(null);
  useEffect(() => {
    if (!window.speechSynthesis) return;
    const pick = () => {
      const vs = speechSynthesis.getVoices();
      if (!vs.length) return;
      setVoice(vs.find(v => v.lang === "en-US") || vs.find(v => v.lang && v.lang.startsWith("en")) || vs[0]);
    };
    pick();
    speechSynthesis.onvoiceschanged = pick;
  }, []);
  return voice;
}
function speak(text, voice, rate) {
  if (!window.speechSynthesis) return alert("이 브라우저는 음성 재생을 지원하지 않아요.");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice;
  u.lang = "en-US";
  u.rate = rate || 0.7;
  u.pitch = 1.05;
  speechSynthesis.speak(u);
}
// 선생님이 올린 음원(url)이 있으면 그걸 재생, 없으면 TTS로 읽기
function playModel(url, text, voice, rate) {
  if (url) { try { const a = new Audio(url); a.play(); return; } catch (e) {} }
  speak(text, voice, rate);
}

function Badge({ tone, children }) {
  return <span className={"badge " + tone}>{children}</span>;
}

// ---------- Login ----------
function Login({ onStudent, onAdmin, onBattle }) {
  const [mode, setMode] = useState("student");
  const [sid, setSid] = useState(""); const [spw, setSpw] = useState("");
  const [apw, setApw] = useState(""); const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const go = async () => {
    setErr(""); setBusy(true);
    try {
      if (mode === "student") {
        const r = await apiPost("/login/student", { id: sid, pw: spw });
        onStudent(r.student);
      } else {
        await apiPost("/login/admin", { pw: apw });

// ---------- Recorder ----------
function Recorder({ index, text, meaning, take, round, onSaved, voice, audioUrl, label }) {
  const [rec, setRec] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const mrRef = useRef(null); const chunksRef = useRef([]);

  const start = async () => {
    setErr("");
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setErr("이 브라우저는 녹음을 지원하지 않아요.");
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      chunksRef.current = [];
      const mr = new MediaRecorder(stream);
      mrRef.current = mr;
      mr.ondataavailable = e => { if (e.data && e.data.size) chunksRef.current.push(e.data); };
      mr.onstop = async () => {
        const blob = new Blob(chunksRef.current, { type: mr.mimeType || "audio/webm" });
        stream.getTracks().forEach(t => t.stop());
        try {
          const fd = new FormData();
          fd.append("audio", blob, "take.webm");
          const up = await fetch("/api/audio", { method: "POST", body: fd });
          const upJson = await up.json();

          let score = null, recognized = null, detail = null, words = null, durationMs = null, assessError = null, assessDebug = null;
          // 채점이 몰려서(502) 실패하면 저장된 녹음으로 잠깐 쉬었다 다시 채점 요청(최대 3회).
          // 순간 몰림은 이 사이 대부분 풀려 결국 점수가 나온다. 200 응답(점수 있음/무음·NoMatch 등
          // '진짜 인식 실패')이면 재시도하지 않는다(헛대기 방지).
          const ASSESS_TRIES = 3;
          for (let attempt = 0; attempt < ASSESS_TRIES; attempt++) {
            try {
              const fd2 = new FormData();
              fd2.append("audio", blob, "take.webm");
              fd2.append("text", text);
              const as = await fetch("/api/assess", { method: "POST", body: fd2 });
              if (as.ok) {
                const d = await as.json();
                durationMs = d.audio && d.audio.durationMs != null ? Math.round(d.audio.durationMs) : null;
                recognized = d.recognizedText || null;
                score = d.pronScore != null ? Math.round(d.pronScore) : null;
                words = d.words || null;
                detail = {
                  accuracy: d.accuracyScore != null ? Math.round(d.accuracyScore) : null,
                  fluency: d.fluencyScore != null ? Math.round(d.fluencyScore) : null,
                  completeness: d.completenessScore != null ? Math.round(d.completenessScore) : null,
                };
                assessError = null; assessDebug = null;
                if (score == null) {
                  assessError = d.note || "인식되지 않았어요. 다시 녹음해볼까요?";
                  assessDebug = [
                    d.status ? `상태 ${d.status}` : null,
                    d.audio ? `길이 ${(d.audio.durationMs/1000).toFixed(1)}초` : null,
                    d.audio && d.audio.dBFS != null ? `음량 ${d.audio.dBFS}dB` : null,
                    d.recognizedText ? `들린 내용 "${d.recognizedText}"` : null,
                  ].filter(Boolean).join(" · ");
                }
                break;   // 200 = 서버가 판정 끝냄 → 재시도 안 함
              } else {
                let m = `발음평가 오류 (${as.status})`;
                try { const j = await as.json(); if (j.detail) m = j.detail; } catch (e) {}
                assessError = m;
                if (attempt < ASSESS_TRIES - 1) { await new Promise(r => setTimeout(r, 1500 * (attempt + 1))); continue; }
              }
            } catch (e) {
              assessError = "발음평가 서버에 연결하지 못했어요.";
              if (attempt < ASSESS_TRIES - 1) { await new Promise(r => setTimeout(r, 1500 * (attempt + 1))); continue; }
            }
          }

          onSaved(index, round, { audio: upJson.url, recognized, score, detail, words, durationMs, assessError, assessDebug });
        } catch (e) {
          setErr("업로드에 실패했어요. 인터넷 연결을 확인해주세요.");
        }
        setBusy(false);
      };
      mr.start();
      setRec(true);
    } catch (e) {
      setErr("마이크 접근이 거부되었어요. 주소창 왼쪽 자물쇠 아이콘에서 마이크를 허용해주세요.");
    }
  };

  const stop = () => {
    if (mrRef.current && rec) { setBusy(true); mrRef.current.stop(); setRec(false); }
  };

  return (
    <div className="card" style={ take ? { borderLeft:"4px solid var(--gold)" } : {} }>
      <div style={{ display:"flex", justifyContent:"space-between", gap:10 }}>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontSize:11, fontWeight:700, color:"var(--gold)" }}>
            {label || (index+1)}{take ? " · 완료" : ""}
          </div>
          <div style={{ fontSize:20, fontWeight:600, wordBreak:"break-word", lineHeight:1.5, whiteSpace:"pre-line" }}>{text}</div>
          {meaning && (
            <div style={{ fontSize:15, color:"var(--navy-soft)", marginTop:4, fontWeight:500 }}>{meaning}</div>
          )}
        </div>
        <div style={{ display:"flex", flexDirection:"column", gap:6, flexShrink:0 }}>
          <button onClick={()=>playModel(audioUrl, text, voice, 0.7)}
            style={{ background:"var(--cream-deep)", color:"var(--navy)", borderRadius:9, padding:"8px 12px", fontSize:13, fontWeight:600, whiteSpace:"nowrap" }}>
            {audioUrl ? "🔊 선생님 발음" : "🔊 듣기"}
          </button>
          <button onClick={()=> audioUrl ? playModel(audioUrl, text, voice) : speak(text, voice, 0.45)}
            style={{ background:"#fff", color:"var(--navy)", border:"1px solid var(--line)", borderRadius:9, padding:"7px 12px", fontSize:12, whiteSpace:"nowrap" }}>
            {audioUrl ? "🔁 다시" : "🐢 천천히"}
          </button>
        </div>
      </div>

      <div className="row" style={{ marginTop:12 }}>
        {!rec ? (
          <button className={take ? "btn-ghost" : "btn"} onClick={start} disabled={busy}>
            🎤 {busy ? "처리 중..." : take ? "다시 녹음" : "녹음 시작"}
          </button>
        ) : (
          <button className="btn-danger" onClick={stop}>■ 녹음 중지</button>
        )}
        {take && <audio controls src={take.audio} />}
      </div>

      {take && take.score != null && (
        <div style={{ marginTop:12, background:"var(--cream)", borderRadius:10, padding:12 }}>
          <div style={{ display:"flex", alignItems:"center", gap:14 }}>
            <div style={{ textAlign:"center", minWidth:70 }}>
              <div style={{ fontSize:30, fontWeight:800, lineHeight:1,
                color: take.score>=85 ? "#2E7D5B" : take.score>=60 ? "#8A6D0F" : "var(--danger)" }}>
                {take.score}
              </div>
              <div style={{ fontSize:10, color:"var(--navy-soft)", marginTop:2 }}>종합 점수</div>
            </div>
            {take.detail && (
              <div style={{ flex:1, display:"flex", gap:6 }}>
                {[["정확도",take.detail.accuracy],["유창성",take.detail.fluency],["완성도",take.detail.completeness]].map(([l,v])=>(
                  <div key={l} style={{ flex:1, textAlign:"center" }}>
                    <div style={{ fontSize:16, fontWeight:700, color:"var(--navy)" }}>{v != null ? v : "-"}</div>
                    <div style={{ fontSize:10, color:"var(--navy-soft)" }}>{l}</div>
                    <div style={{ height:4, background:"#E3DCC8", borderRadius:2, marginTop:3, overflow:"hidden" }}>
                      <div style={{ width:`${v||0}%`, height:"100%", background:"var(--gold)" }} />
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
          {take.recognized && (
            <div className="muted" style={{ marginTop:8 }}>이렇게 들렸어요: "{take.recognized}"</div>
          )}
        </div>
      )}
      {take && take.score == null && take.assessError && (
        <div style={{ marginTop:10, fontSize:12, color:"var(--danger)" }}>⚠ {take.assessError}</div>
      )}
      {err && <div className="err">{err}</div>}
    </div>
  );
}

// ---------- Student ----------
function PushBell({ studentId }) {
  const [state, setState] = useState("checking");   // checking | on | off | unsupported
  const [busy, setBusy] = useState(false);
  useEffect(() => {
    if (!pushSupported()) { setState("unsupported"); return; }
    (async () => {
      try {
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription();
        setState(sub && Notification.permission === "granted" ? "on" : "off");
      } catch (e) { setState("off"); }
    })();
  }, []);
  const turnOn = async () => {
    setBusy(true);
    try {
      await enablePush(studentId);
      setState("on");
      try { await apiPost(`/push/test/${studentId}`); } catch (e) {}   // 바로 테스트 알림
      alert("알림을 켰어요! 🔔 방금 테스트 알림을 보냈으니 확인해보세요. 숙제 있는 날 폰으로 알려줄게요.");
    }
    catch (e) { alert(e.message); }
    setBusy(false);
  };
  const turnOff = async () => { setBusy(true); try { await disablePush(studentId); setState("off"); } catch (e) {} setBusy(false); };
  if (state === "checking") return null;
  if (state === "unsupported") return (
    <div className="card" style={{ padding:"10px 14px", background:"var(--cream)" }}>
      <div className="muted" style={{ fontSize:12 }}>🔔 숙제 알림을 받으려면 <b>크롬</b>으로 열거나, 아이폰은 <b>공유 → 홈 화면에 추가</b> 후 그 아이콘으로 들어와 주세요.</div>
    </div>
  );
  return (
    <div className="card" style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:10, padding:"12px 14px" }}>
      <div style={{ minWidth:0 }}>
        <div style={{ fontWeight:700, fontSize:14 }}>🔔 숙제 알림</div>
        <div className="muted" style={{ fontSize:12, marginTop:2 }}>
          {state==="on" ? "켜짐 — 숙제 있는 날 폰으로 알려줘요." : "켜두면 숙제 있는 날 폰으로 알려줘요!"}
        </div>
      </div>
      {state==="on"
        ? <button className="btn-ghost" style={{ fontSize:12, padding:"7px 12px", flexShrink:0 }} onClick={turnOff} disabled={busy}>{busy?"...":"끄기"}</button>
        : <button className="btn" style={{ fontSize:13, padding:"8px 14px", flexShrink:0 }} onClick={turnOn} disabled={busy}>{busy?"켜는 중...":"알림 켜기"}</button>}
    </div>
  );
}

function StudentView({ student, onLogout }) {
  const voice = useVoice();
  const [assignments, setAssignments] = useState([]);
  const [statusMap, setStatusMap] = useState({});
  const [open, setOpen] = useState(null);
  const [sub, setSub] = useState(null);
  const [round, setRound] = useState(0);
  const [loading, setLoading] = useState(true);
  const [msg, setMsg] = useState("");
  const [saveMsg, setSaveMsg] = useState("");
  const [done, setDone] = useState(false);
  const [openVocab, setOpenVocab] = useState(null);
  const [openSentence, setOpenSentence] = useState(null);
  const [openExam, setOpenExam] = useState(null);
  const [vocabProgress, setVocabProgress] = useState({});

  const mine = assignments.filter(a =>
    a.published !== false &&
    ((!a.assignedIds || !a.assignedIds.length) || a.assignedIds.includes(student.id)));

  const reloadVocab = () => apiGet(`/vocab/${student.id}`).then(setVocabProgress).catch(()=>{});

  useEffect(() => {
    reloadVocab();
    (async () => {
      // 과제 목록 + 제출상태를 각각 1번씩만 호출 (과제마다 따로 부르지 않음 → 접속 로딩 대폭 단축)
      // ?student= 를 붙이는 이유: 서버가 '이 학생이 속한 학원'의 과제만 골라 주기 위해서다.
      // 학생은 관리자 열쇠가 없어서 이게 없으면 해피트리 과제만 보인다.
      const [list, subs] = await Promise.all([
        apiGet(`/assignments?student=${encodeURIComponent(student.id)}`),
        apiGet(`/student-submissions/${student.id}`).catch(() => ({})),
      ]);
      setAssignments(list);
      const map = {};
      list.forEach(a => {
        const s = subs[a.id];
        map[a.id] = (s && s.status) ? s.status : "none";
      });
      setStatusMap(map);
      setLoading(false);
    })();
  }, []);

  const openA = async (a) => {
    setOpen(a);
    pingActivity(student.id, "record", a.title);
    const s = await apiGet(`/submission/${a.id}/${student.id}`);
    const items = a.items.map((_, i) => normalizeTakes((s.items || [])[i]));
    const n = a.rounds || 3;
    const isWhole = a.type === "sentence" && a.recordMode === "whole";
    const whole = Array.from({ length: n }, (_, k) => (s.whole || [])[k] || null);
    setSub({ items, whole, comment: s.comment || "", status: s.status || "none" });
    let r = 0;
    if (isWhole) {
      for (let k = 0; k < n; k++) { if (whole[k]) r = Math.min(k + 1, n - 1); else { r = k; break; } }
    } else {
      for (let k = 0; k < n; k++) { if (items.every(it => it[k])) r = Math.min(k + 1, n - 1); else { r = k; break; } }
    }
    setRound(r);
  };

  const onSaved = (idx, take, val) => {
    setSub(prev => {
      const items = prev.items.map(x => x.slice());
      items[idx][take] = val;
      const next = { ...prev, items };
      // 녹음할 때마다 서버에 바로 저장 (제출 전이라도 유실되지 않도록)
      apiPost(`/submission/${open.id}/${student.id}`, { items })
        .then(() => setSaveMsg("자동 저장됨"))
        .catch(() => setSaveMsg("자동 저장 실패 — 인터넷 연결을 확인해주세요"));
      setTimeout(()=>setSaveMsg(""), 2500);
      return next;
    });
  };

  // 통문장 말하기 모드: 회차별 통문장 녹음 저장
  const onSavedWhole = (roundIdx, val) => {
    setSub(prev => {
      const whole = (prev.whole || []).slice();
      whole[roundIdx] = val;
      const next = { ...prev, whole };
      apiPost(`/submission/${open.id}/${student.id}`, { whole })
        .then(() => setSaveMsg("자동 저장됨"))
        .catch(() => setSaveMsg("자동 저장 실패 — 인터넷 연결을 확인해주세요"));
      setTimeout(()=>setSaveMsg(""), 2500);
      return next;
    });
  };

  const submit = async () => {
    const isWhole = open.type==="sentence" && open.recordMode==="whole";
    const parts = [];
    for (let r = 0; r < (open.rounds || 3); r++) {
      if (isWhole) { if (!(sub.whole||[])[r]) parts.push(`${r+1}회차`); }
      else { const miss = sub.items.filter(it => !it[r]).length; if (miss) parts.push(`${r+1}회차 ${miss}개`); }
    }
    if (parts.length && !confirm(`아직 녹음하지 않은 ${isWhole ? "회차" : "항목"}가 있어요 (${parts.join(", ")}). 그래도 제출할까요?`)) return;
    setMsg("제출 중...");
    try {
      await apiPost(`/submission/${open.id}/${student.id}`,
        isWhole
          ? { whole: sub.whole, status: "submitted", submittedAt: nowStr() }
          : { items: sub.items, status: "submitted", submittedAt: nowStr() });
      setStatusMap(m => ({ ...m, [open.id]: "submitted" }));
      setMsg("");
      setDone(true);
    } catch (e) { setMsg("제출 실패: " + e.message); }
  };

  if (loading) return <div className="center"><div className="spin" /></div>;

  if (open && sub) {
    return (
      <div className="wrap">
        <div className="hdr">
          <div className="row" style={{ gap:12 }}>
            <button onClick={()=>{ setOpen(null); setSub(null); }} style={{ background:"none", color:"var(--cream)", fontSize:22 }}>‹</button>
            <div>
              <div style={{ fontWeight:700, fontSize:15 }}>{open.title}</div>
              <div style={{ fontSize:11, color:"var(--gold-soft)" }}>
                {open.type==="word"?"단어":"문장"} {open.items.length}개 · {open.rounds || 3}회 녹음{open.dueDate ? ` · 마감 ${formatDue(open.dueDate)}` : ""}
              </div>
            </div>
          </div>
        </div>
        <div className="body" style={{ paddingBottom:100 }}>
          {sub.status === "reviewed" && sub.comment && (
            <div className="card" style={{ background:"#F3E4B8" }}>
              <div style={{ fontSize:11, fontWeight:700, color:"#8A6D0F", marginBottom:4 }}>선생님 코멘트</div>
              <div style={{ fontSize:14 }}>{sub.comment}</div>
            </div>
          )}

          {(open.rounds || 3) > 1 && (
            <div className="card" style={{ padding:12 }}>
              <div className="label" style={{ marginBottom:8 }}>몇 회차를 녹음할까요?</div>
              <div className="seg" style={{ marginTop:0 }}>
                {Array.from({length: open.rounds || 3}, (_,r) => {
                  const isWhole = open.type==="sentence" && open.recordMode==="whole";
                  const label = isWhole
                    ? `${r+1}회차 (${(sub.whole||[])[r] ? "완료" : "미완료"})`
                    : `${r+1}회차 (${sub.items.filter(it => it[r]).length}/${sub.items.length})`;
                  return (
                    <button key={r} className={round===r ? "on" : ""} onClick={()=>setRound(r)}>{label}</button>
                  );
                })}
              </div>
            </div>
          )}

          {open.type==="sentence" && open.recordMode==="whole" ? (
            <>
              <div className="card" style={{ background:"var(--cream)", padding:12 }}>
                <div style={{ fontSize:11, fontWeight:700, color:"var(--navy-soft)", marginBottom:6 }}>📖 통문장 — 처음부터 끝까지 한 번에 읽어요</div>
                <div style={{ fontSize:15, lineHeight:1.7, color:"var(--navy)" }}>
                  {open.items.map((t,i)=>(<div key={i}>{i+1}. {t}</div>))}
                </div>
              </div>
              <Recorder key={`whole-${round}`} index={0} label="통문장 말하기"
                text={open.items.join("\n")}
                take={(sub.whole||[])[round]} round={round}
                onSaved={(_,r,v)=>onSavedWhole(r,v)} voice={voice} />
            </>
          ) : (
            open.items.map((t,i) => (
              <Recorder key={`${round}-${i}`} index={i} text={t} meaning={(open.meanings||[])[i]}
                take={sub.items[i][round]} round={round} onSaved={onSaved} voice={voice}
                audioUrl={(open.exampleAudio||[])[i]} />
            ))
          )}
        </div>
        <div style={{ position:"fixed", bottom:0, left:0, right:0, padding:14, background:"var(--cream)", borderTop:"1px solid var(--line)" }}>
          <div style={{ maxWidth:640, margin:"0 auto" }}>
            {msg && <div style={{ textAlign:"center", fontSize:12, fontWeight:700, color:"var(--navy)", marginBottom:8 }}>{msg}</div>}
            {!msg && saveMsg && <div style={{ textAlign:"center", fontSize:11, color:"var(--navy-soft)", marginBottom:8 }}>{saveMsg}</div>}
            <button className="btn full" onClick={submit}>제출하기</button>
          </div>
        </div>

        {done && (
          <div onClick={()=>{ setDone(false); setOpen(null); setSub(null); }}
            style={{ position:"fixed", inset:0, background:"rgba(27,46,76,0.75)", zIndex:100,
              display:"flex", alignItems:"center", justifyContent:"center", padding:24 }}>
            <div style={{ background:"#fff", borderRadius:20, padding:"36px 28px", textAlign:"center",
              maxWidth:340, width:"100%", boxShadow:"0 20px 60px rgba(0,0,0,0.3)" }}>
              <div style={{ fontSize:56, lineHeight:1, marginBottom:14 }}>🎉</div>
              <div style={{ fontSize:28, fontWeight:800, color:"var(--navy)", marginBottom:8 }}>제출 완료!</div>
              <div style={{ fontSize:15, color:"var(--navy-soft)", lineHeight:1.6, marginBottom:22 }}>
                {student.name} 학생, 오늘도 잘했어요.<br/>선생님이 확인하고 알려줄게요.
              </div>
              <button className="btn full" onClick={()=>{ setDone(false); setOpen(null); setSub(null); }}>
                확인
              </button>
            </div>
          </div>
        )}
      </div>
    );
  }

  if (openVocab) {
    return (
      <div className="wrap">
        <div className="hdr">
          <div className="row" style={{ gap:12 }}>
            <button onClick={()=>{ setOpenVocab(null); reloadVocab(); }} style={{ background:"none", color:"var(--cream)", fontSize:22 }}>‹</button>
            <div>
              <div style={{ fontWeight:700, fontSize:15 }}>{openVocab.title}</div>
              <div style={{ fontSize:11, color:"var(--gold-soft)" }}>단어 자습 · {openVocab.items.length}단어</div>
            </div>
          </div>
        </div>
        <div className="body">
          <VocabSetStudy assignment={openVocab} student={student} voice={voice}
            onClose={()=>{ setOpenVocab(null); reloadVocab(); }} />
        </div>
      </div>
    );
  }

  if (openSentence) {
    return (
      <div className="wrap">
        <div className="hdr">
          <div className="row" style={{ gap:12 }}>
            <button onClick={()=>{ setOpenSentence(null); reloadVocab(); }} style={{ background:"none", color:"var(--cream)", fontSize:22 }}>‹</button>
            <div>
              <div style={{ fontWeight:700, fontSize:15 }}>{openSentence.title}</div>
              <div style={{ fontSize:11, color:"var(--gold-soft)" }}>문장 자습 · {openSentence.items.length}문장</div>
            </div>
          </div>
        </div>
        <div className="body">
          <SentenceStudy assignment={openSentence} student={student} voice={voice}
            onClose={()=>{ setOpenSentence(null); reloadVocab(); }} />
        </div>
      </div>
    );
  }

  if (openExam) {
    return (
      <div className="wrap">
        <div className="hdr">
          <div className="row" style={{ gap:12 }}>
            <button onClick={()=>{ setOpenExam(null); }} style={{ background:"none", color:"var(--cream)", fontSize:22 }}>‹</button>
            <div>
              <div style={{ fontWeight:700, fontSize:15 }}>{openExam.title}</div>
              <div style={{ fontSize:11, color:"var(--gold-soft)" }}>권말 진급 시험</div>
            </div>
          </div>
        </div>
        <div className="body">
          <ExamPlay assignment={openExam} student={student}
            onClose={()=>{ setOpenExam(null); }} />
        </div>
      </div>
    );
  }

  return (
    <div className="wrap">
      <div className="hdr">
        <div>
          <div style={{ fontSize:11, color:"var(--gold-soft)" }}>반갑습니다</div>
          <h1>{student.name} 학생</h1>
        </div>
        <button onClick={onLogout} style={{ background:"none", color:"var(--cream)", fontSize:13 }}>로그아웃</button>
      </div>
      <div className="body">
        <a href={STUDENT_PORTAL}
          style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:10, textDecoration:"none",
            background:"var(--navy)", color:"#fff", borderRadius:14, padding:"12px 16px", marginBottom:12 }}>
          <span style={{ fontWeight:800, fontSize:15 }}>🏠 학생 홈으로 돌아가기</span>
          <span style={{ fontSize:12, color:"var(--gold-soft)", fontWeight:700 }}>문해숨 · 수학숨 숙제 →</span>
        </a>
        <div style={{ marginBottom:12 }}><PushBell studentId={student.id} /></div>
        <StudentHome mine={mine} statusMap={statusMap} vocabProgress={vocabProgress}
          onOpenRecord={openA} onOpenVocab={setOpenVocab} onOpenSentence={setOpenSentence} onOpenExam={setOpenExam} />
      </div>
    </div>
  );
}

// ---------- 학생 홈: 달력 + [녹음 숙제 / 단어 자습] 두 탭 (같은 달력 공유) ----------
function StudentHome({ mine, statusMap, vocabProgress, onOpenRecord, onOpenVocab, onOpenSentence, onOpenExam }) {
  const today = new Date();
  const [ym, setYm] = useState({ y: today.getFullYear(), m: today.getMonth() });
  const [tab, setTab] = useState("record");
  const [picked, setPicked] = useState(() =>
    `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`);

  const isVocab = tab === "vocab";
  const isSentence = tab === "sentence";
  const isStudy = isVocab || isSentence;
  const studyLabel = isSentence ? "문장 자습" : "단어 자습";
  const source = isVocab
    ? mine.filter(a => a.type === "exam" ? (a.poolSize || (a.items||[]).length) : ((a.type || "word") === "word" && (a.items || []).length))
    : isSentence
      ? mine.filter(a => a.type === "sentence" && (a.items || []).length)
      : mine.filter(a => a.type !== "exam");

  const byDate = {};
  const noDate = [];
  source.forEach(a => {
    if (a.dueDate) (byDate[a.dueDate] = byDate[a.dueDate] || []).push(a);
    else noDate.push(a);
  });
  const dayCmp = (x, y) => {
    const dx = dayNum(x.title), dy = dayNum(y.title);
    if (dx != null && dy != null && dx !== dy) return dx - dy;
    return (x.title || "").localeCompare(y.title || "");
  };
  Object.keys(byDate).forEach(k => byDate[k].sort(dayCmp));
  noDate.sort(dayCmp);

  // 자습 완료 기준: 단계의 50% 이상 완료 (단어 4단계 중 2개↑, 문장 2단계 중 1개↑)
  const studyDone = (a) => {
    const rec = vocabProgress[a.id];
    if (!rec || !rec.byMode) return false;
    const stages = a.type === "sentence" ? ["smeaning", "unscramble"] : ["flash", "choice", "spell", "test"];
    const done = stages.filter(s => rec.byMode[s]).length;
    return done / stages.length >= 0.5;
  };

  // 달력 완료 배지: 전체 과제 기준으로 그날 완료한 활동 표시 (탭과 무관하게 한눈에)
  const allByDate = {};
  mine.forEach(a => { if (a.dueDate) (allByDate[a.dueDate] = allByDate[a.dueDate] || []).push(a); });
  const dayBadges = (k) => {
    const list = allByDate[k] || [];
    const seen = {};
    list.forEach(a => {
      const L = a.type === "sentence" ? "문" : "단";
      const st = statusMap[a.id] || "none";
      if (st === "submitted" || st === "reviewed") seen[L + "R"] = { label: L, kind: "rec" };
      if (studyDone(a)) seen[L + "S"] = { label: L, kind: "study" };
    });
    return ["단R", "문R", "단S", "문S"].filter(x => seen[x]).map(x => seen[x]);
  };

  const first = new Date(ym.y, ym.m, 1);
  const daysInMonth = new Date(ym.y, ym.m + 1, 0).getDate();
  const startDow = first.getDay();
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const key = (d) => `${ym.y}-${String(ym.m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const todayKey = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;

  const move = (delta) => {
    let m = ym.m + delta, y = ym.y;
    if (m < 0) { m = 11; y--; }
    if (m > 11) { m = 0; y++; }
    setYm({ y, m });
  };

  const doneOf = (a) => isStudy
    ? studyDone(a)
    : (statusMap[a.id] || "none") !== "none";

  const dayState = (d) => {
    const list = byDate[key(d)] || [];
    if (!list.length) return null;
    if (list.every(doneOf)) return "done";
    if (key(d) < todayKey) return "late";
    return "todo";
  };

  const pickedList = byDate[picked] || [];

  const recordCard = (a) => {
    const st = statusMap[a.id] || "none";
    return (
      <button key={a.id} onClick={()=>onOpenRecord(a)} className="card"
        style={{ display:"flex", width:"100%", textAlign:"left", justifyContent:"space-between", alignItems:"center", gap:10 }}>
        <div style={{ minWidth:0 }}>
          <div className="row" style={{ marginBottom:5 }}>
            <Badge tone={a.type==="word"?"b-navy":"b-gold"}>{a.type==="word"?"단어":"문장"}</Badge>
            <span className="muted">{a.items.length}개 · {a.rounds||3}회</span>
          </div>
          <div style={{ fontWeight:700, fontSize:15 }}>{a.title}</div>
        </div>
        <Badge tone={st==="none"?"b-gray":st==="submitted"?"b-gold":"b-navy"}>
          {st==="none"?"미제출":st==="submitted"?"제출완료":"확인완료"}
        </Badge>
      </button>
    );
  };
  const vocabCard = (a) => {
    const rec = vocabProgress[a.id];
    return (
      <button key={a.id} onClick={()=>onOpenVocab(a)} className="card"
        style={{ display:"flex", width:"100%", textAlign:"left", justifyContent:"space-between", alignItems:"center", gap:10 }}>
        <div style={{ minWidth:0 }}>
          <div className="row" style={{ marginBottom:5 }}>
            <Badge tone="b-navy">단어</Badge>
            <span className="muted">{a.items.length}단어</span>
          </div>
          <div style={{ fontWeight:700, fontSize:15 }}>{a.title}</div>
        </div>
        <Badge tone={rec ? "b-navy" : "b-gray"}>{rec ? `최고 ${rec.best}점` : "시작 전"}</Badge>
      </button>
    );
  };
  const sentenceCard = (a) => {
    const rec = vocabProgress[a.id];
    return (
      <button key={a.id} onClick={()=>onOpenSentence(a)} className="card"
        style={{ display:"flex", width:"100%", textAlign:"left", justifyContent:"space-between", alignItems:"center", gap:10 }}>
        <div style={{ minWidth:0 }}>
          <div className="row" style={{ marginBottom:5 }}>
            <Badge tone="b-gold">문장</Badge>
            <span className="muted">{a.items.length}문장</span>
          </div>
          <div style={{ fontWeight:700, fontSize:15 }}>{a.title}</div>
        </div>
        <Badge tone={rec ? "b-navy" : "b-gray"}>{rec && rec.best!=null ? `최고 ${rec.best}점` : rec ? "학습중" : "시작 전"}</Badge>
      </button>
    );
  };
  const examCard = (a) => {
    const rec = vocabProgress; // placeholder unused
    return (
      <button key={a.id} onClick={()=>onOpenExam(a)} className="card"
        style={{ display:"flex", width:"100%", textAlign:"left", justifyContent:"space-between", alignItems:"center", gap:10,
          border:"1.5px solid var(--gold)", background:"var(--cream-deep, #fbf6ea)" }}>
        <div style={{ minWidth:0 }}>
          <div className="row" style={{ marginBottom:5 }}>
            <Badge tone="b-gold">진급시험</Badge>
            <span className="muted">{a.poolSize || a.items.length}단어 · 40문항</span>
          </div>
          <div style={{ fontWeight:800, fontSize:15, color:"var(--navy)" }}>🎯 {a.title}</div>
        </div>
        <span style={{ color:"var(--navy)", fontSize:20 }}>›</span>
      </button>
    );
  };
  const vocabOrExam = (a) => a.type === "exam" ? examCard(a) : vocabCard(a);
  const card = isVocab ? vocabOrExam : isSentence ? sentenceCard : recordCard;

  return (
    <>
      <div className="seg" style={{ marginBottom:12 }}>
        <button className={tab==="record" ? "on" : ""} onClick={()=>setTab("record")}>📅 녹음</button>
        <button className={tab==="vocab" ? "on" : ""} onClick={()=>setTab("vocab")}>📚 단어</button>
        <button className={tab==="sentence" ? "on" : ""} onClick={()=>setTab("sentence")}>📝 문장</button>
      </div>

      <div className="card" style={{ padding:14 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
          <button onClick={()=>move(-1)} style={{ background:"none", fontSize:22, color:"var(--navy)", padding:"0 10px" }}>‹</button>
          <div style={{ fontWeight:800, fontSize:17, color:"var(--navy)" }}>{ym.y}년 {ym.m+1}월</div>
          <button onClick={()=>move(1)} style={{ background:"none", fontSize:22, color:"var(--navy)", padding:"0 10px" }}>›</button>
        </div>

        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:4, marginBottom:6 }}>
          {["일","월","화","수","목","금","토"].map((n,i) => (
            <div key={n} style={{ textAlign:"center", fontSize:11, fontWeight:700,
              color: i===0 ? "var(--danger)" : i===6 ? "#3B6FA0" : "var(--navy-soft)" }}>{n}</div>
          ))}
        </div>

        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:4 }}>
          {cells.map((d,i) => {
            if (!d) return <div key={"e"+i} />;
            const k = key(d);
            const st = dayState(d);
            const isToday = k === todayKey;
            const isPicked = k === picked;
            const bs = dayBadges(k);
            const hasBadges = bs.length > 0;
            const colors = { done:"#2E7D5B", todo:"var(--gold)", late:"var(--danger)" };
            return (
              <button key={k} onClick={()=>setPicked(k)}
                style={{ minHeight:54, padding:"5px 0", borderRadius:10, position:"relative",
                  background: isPicked ? "var(--navy)" : hasBadges ? "#E7F1EA" : isToday ? "var(--cream-deep)" : "transparent",
                  border: isPicked ? "none" : hasBadges ? "1px solid #BFE0CC" : isToday ? "1px solid var(--gold)" : "1px solid transparent",
                  color: isPicked ? "#fff" : "var(--ink)",
                  fontSize:15, fontWeight: (st || hasBadges) ? 700 : 400,
                  display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:3 }}>
                {d}
                {(() => {
                  const showDot = st && st !== "done" && !bs.length;
                  return <>
                    {bs.length > 0 && (
                      <div style={{ display:"flex", flexWrap:"wrap", gap:3, justifyContent:"center", maxWidth:"100%" }}>
                        {bs.map((b,bi) => (
                          <span key={bi} style={{ fontSize:12, fontWeight:800, lineHeight:1.15, padding:"1px 5px", borderRadius:5,
                            background: b.kind==="rec" ? (isPicked ? "#9FB0CC" : "var(--navy)") : "var(--good)",
                            color:"#fff", border: isPicked ? "1px solid rgba(255,255,255,.6)" : "none" }}>{b.label}</span>
                        ))}
                      </div>
                    )}
                    {showDot && <span style={{ width:6, height:6, borderRadius:"50%", background: isPicked ? "#fff" : colors[st] }} />}
                  </>;
                })()}
              </button>
            );
          })}
        </div>

        <div style={{ marginTop:12, display:"flex", flexDirection:"column", gap:6, alignItems:"center" }}>
          <div className="row" style={{ gap:10, justifyContent:"center", flexWrap:"wrap" }}>
            <span style={{ fontSize:11, color:"var(--navy-soft)", display:"inline-flex", alignItems:"center", gap:4 }}>
              <span style={{ fontSize:11, fontWeight:800, color:"#fff", background:"var(--navy)", borderRadius:4, padding:"1px 4px" }}>단</span>
              <span style={{ fontSize:11, fontWeight:800, color:"#fff", background:"var(--navy)", borderRadius:4, padding:"1px 4px" }}>문</span>
              🎤 녹음 완료
            </span>
            <span style={{ fontSize:11, color:"var(--navy-soft)", display:"inline-flex", alignItems:"center", gap:4 }}>
              <span style={{ fontSize:11, fontWeight:800, color:"#fff", background:"var(--good)", borderRadius:4, padding:"1px 4px" }}>단</span>
              <span style={{ fontSize:11, fontWeight:800, color:"#fff", background:"var(--good)", borderRadius:4, padding:"1px 4px" }}>문</span>
              📚 자습 완료
            </span>
          </div>
          <div className="row" style={{ gap:12, justifyContent:"center" }}>
            {[["var(--gold)", isStudy?"할 수 있어요":"해야 해요"],["var(--danger)","기한 지남"]].map(([c,l]) => (
              <span key={l} style={{ fontSize:11, color:"var(--navy-soft)", display:"inline-flex", alignItems:"center", gap:4 }}>
                <span style={{ width:7, height:7, borderRadius:"50%", background:c, display:"inline-block" }} />{l}
              </span>
            ))}
          </div>
        </div>
      </div>

      <div style={{ fontWeight:700, color:"var(--navy)", margin:"14px 4px 8px", fontSize:14 }}>
        {picked.slice(5).replace("-","월 ")}일 {isStudy ? studyLabel : "숙제"}
      </div>
      {!pickedList.length && (
        <div className="card" style={{ textAlign:"center", padding:24 }}>
          <span className="muted">이 날은 {isStudy ? studyLabel+"이" : "숙제가"} 없어요 🎈</span>
        </div>
      )}
      {pickedList.map(card)}

      {noDate.length > 0 && (
        <>
          <div style={{ fontWeight:700, color:"var(--navy)", margin:"18px 4px 8px", fontSize:14 }}>날짜 없는 {isStudy ? (isSentence?"문장":"단어장") : "숙제"}</div>
          {noDate.map(card)}
        </>
      )}
    </>
  );
}

// ---------- Admin: students ----------
const SCHOOL_GRADES = ["초1","초2","초3","초4","초5","초6","중1","중2","중3"];
function AdminStudents({ students, reload }) {
  const [name, setName] = useState(""); const [cls, setCls] = useState("");
  const [id, setId] = useState(""); const [pw, setPw] = useState(""); const [grade, setGrade] = useState("");
  const [err, setErr] = useState(""); const [busy, setBusy] = useState(false);
  const [preview, setPreview] = useState(null); const [bulkBusy, setBulkBusy] = useState(false);
  const [editSid, setEditSid] = useState(null); const [editCls, setEditCls] = useState(""); const [editGrade, setEditGrade] = useState("");

  const saveClass = async (sid) => {
    try {
      await fetch("/api/students/" + sid, { method:"PATCH", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ className: editCls, grade: editGrade }) });
      setEditSid(null); await reload();
    } catch (e) { setErr(e.message); }
  };

  const readStudentsFile = async (file) => {
    if (!file) return;
    setErr(""); setPreview(null);
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type:"array" });
      const rows = [];
      const idxOf = (h, keys) => h.findIndex(v => keys.some(k => v.replace(/\s/g,"").toLowerCase().includes(k)));
      for (const sh of wb.SheetNames) {
        const raw = XLSX.utils.sheet_to_json(wb.Sheets[sh], { header:1 });
        if (!raw.length) continue;
        let cName = 0, cClass = 1, cId = -1, cPw = -1, start = 0;
        const h = (raw[0] || []).map(x => String(x ?? "").trim());
        const ni = idxOf(h, ["이름","name","성명","학생"]);
        if (ni >= 0) { cName = ni; start = 1;
          const ci = idxOf(h, ["반","class","클래스"]); if (ci>=0) cClass = ci;
          const ii = idxOf(h, ["아이디","id"]); if (ii>=0) cId = ii;
          const pi = idxOf(h, ["비밀","비번","pw","password"]); if (pi>=0) cPw = pi;
        }
        for (let r = start; r < raw.length; r++) {
          const row = raw[r] || [];
          const nm = String(row[cName] ?? "").trim();
          if (!nm) continue;
          rows.push({ name: nm, className: String(row[cClass] ?? "").trim(),
            id: cId>=0 ? String(row[cId] ?? "").trim() : "", pw: cPw>=0 ? String(row[cPw] ?? "").trim() : "" });
        }
      }
      if (!rows.length) return setErr("파일에서 학생 이름을 찾지 못했어요. (첫 열에 이름, 둘째 열에 반)");
      setPreview(rows);
    } catch (e) { setErr("엑셀을 읽는 데 실패했어요."); }
  };
  const downloadTemplate = () => {
    const data = [
      ["이름","반","아이디","비밀번호"],
      ["홍길동","초등5반","",""],
      ["김철수","초등5반","",""],
      ["이영희","초등3반","",""],
    ];
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws["!cols"] = [{ wch:12 },{ wch:12 },{ wch:14 },{ wch:12 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "학생명단");
    XLSX.writeFile(wb, "학생명단_예시.xlsx");
  };

  const submitBulk = async () => {
    if (!preview || !preview.length) return;
    setBulkBusy(true); setErr("");
    try {
      const r = await apiPost("/students/bulk", { students: preview });
      setPreview(null);
      await reload();
      alert(`${r.created}명을 등록했어요!`);

        <div style={{height:10}} />
        <label className="label">반 (선택)</label>
        <input className="field" value={cls} onChange={e=>setCls(e.target.value)} placeholder="초등3반" />
        <div style={{height:10}} />
        <label className="label">학년 (진급시험 동학년 백분위용)</label>
        <select className="field" value={grade} onChange={e=>setGrade(e.target.value)}>
          <option value="">학년 선택</option>
          {SCHOOL_GRADES.map(g => <option key={g} value={g}>{g}</option>)}
        </select>
        <div style={{height:10}} />
        <label className="label">아이디 (비워두면 자동 발급)</label>
        <input className="field" value={id} onChange={e=>setId(e.target.value)} placeholder="기존 학원 아이디" />
        <div style={{height:10}} />
        <label className="label">비밀번호 (비워두면 자동 발급)</label>
        <input className="field" value={pw} onChange={e=>setPw(e.target.value)} placeholder="기존 비밀번호" />
        {err && !preview && <div className="err">{err}</div>}
        <div style={{height:14}} />
        <button className="btn" onClick={add} disabled={busy}>아이디 발급</button>

      <div className="card">

        <div className="muted" style={{ marginBottom:10, fontSize:13, lineHeight:1.6 }}>
          첫 줄 머리글: <b>이름 · 반 · 아이디 · 비밀번호</b> (반·아이디·비번은 없어도 됨 → 자동 발급).<br/>
          머리글이 없으면 <b>1열=이름, 2열=반</b>으로 읽어요.

        <button className="btn full" style={{ marginBottom:8 }} onClick={downloadTemplate}>📥 예시 엑셀 먼저 받기</button>
        <div className="muted" style={{ marginBottom:8, fontSize:12 }}>예시 파일을 받아 <b>틀 안에 채운 뒤</b> 아래로 올리면 오류가 없어요.</div>
        <label className="btn-ghost full" style={{ display:"block", textAlign:"center", cursor:"pointer" }}>
          📄 학생 명단 엑셀 올리기
          <input type="file" accept=".xlsx,.xls,.csv" style={{ display:"none" }}

        {preview && (
          <>
            <div style={{ marginTop:12, marginBottom:8, fontWeight:700, color:"var(--navy)", fontSize:13 }}>

                <div key={i} style={{ display:"flex", justifyContent:"space-between", gap:8, padding:"7px 10px",

                  <span style={{ fontWeight:600 }}>{s.name}</span>

            <div className="row" style={{ marginTop:12, gap:6 }}>
              <button className="btn" style={{ flex:1 }} onClick={submitBulk} disabled={bulkBusy}>

      {(() => {

        students.forEach(s => { const c = s.className || "반 미지정"; (byClass[c] = byClass[c] || []).push(s); });
        const keys = Object.keys(byClass).sort((a,b) => a==="반 미지정" ? 1 : b==="반 미지정" ? -1 : a.localeCompare(b));
        return keys.map(c => (
          <div key={c}>
            <div style={{ fontWeight:800, color:"var(--navy)", margin:"18px 4px 8px", fontSize:15 }}>
              📚 {c} <span className="muted" style={{ fontWeight:500, fontSize:13 }}>{byClass[c].length}명</span>
            </div>
            {byClass[c].slice().sort((a,b)=>(a.name||"").localeCompare(b.name||"")).map(s => (
              <div key={s.id} className="card">
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:8 }}>
                  <div>
                    <div style={{ fontWeight:700, fontSize:14 }}>{s.name}
                      <span className="muted" style={{ fontWeight:500 }}> · {s.className || "반 미지정"}</span>
                      {s.grade ? <span style={{ fontWeight:700, fontSize:12, color:"var(--navy)", background:"var(--cream-deep,#f3ecd9)", borderRadius:6, padding:"1px 7px", marginLeft:6 }}>{s.grade}</span>
                        : <span style={{ fontSize:12, color:"var(--danger)", marginLeft:6 }}>학년 미지정</span>}</div>
                    <div className="muted" style={{ marginTop:3 }}>
                      아이디 <b style={{color:"var(--navy)"}}>{s.id}</b> / 비밀번호 <b style={{color:"var(--navy)"}}>{s.pw}</b>
                    </div>
                  </div>
                  <div className="row" style={{ gap:8, flexShrink:0 }}>
                    <button onClick={()=>{ setEditSid(editSid===s.id?null:s.id); setEditCls(s.className||""); setEditGrade(s.grade||""); }}
                      title="반·학년 변경" style={{ background:"none", fontSize:16 }}>✏️</button>
                    <button onClick={()=>del(s.id)} style={{ background:"none", color:"var(--danger)", fontSize:18 }}>🗑</button>
                  </div>
                </div>
                {editSid===s.id && (
                  <div className="row" style={{ gap:6, marginTop:10, flexWrap:"wrap" }}>
                    <input className="field" style={{ flex:1, minWidth:110, padding:"7px 10px", fontSize:13 }} value={editCls}
                      onChange={e=>setEditCls(e.target.value)} placeholder="반 이름 (예: 초등5반)"
                      list="cls-list" onKeyDown={e=>e.key==="Enter"&&saveClass(s.id)} autoFocus />
                    <select className="field" style={{ width:96, padding:"7px 8px", fontSize:13 }} value={editGrade} onChange={e=>setEditGrade(e.target.value)}>
                      <option value="">학년</option>
                      {SCHOOL_GRADES.map(g => <option key={g} value={g}>{g}</option>)}
                    </select>
                    <button className="btn" style={{ padding:"7px 12px", fontSize:12 }} onClick={()=>saveClass(s.id)}>저장</button>
                    <button className="btn-ghost" style={{ padding:"7px 12px", fontSize:12 }} onClick={()=>setEditSid(null)}>취소</button>
                  </div>
                )}
              </div>
            ))}
          </div>
        ));
      })()}
      {!students.length && <div style={{ textAlign:"center", padding:40 }} className="muted">등록된 학생이 없어요.</div>}
    </div>
  );
}

// ---------- Admin: bulk book upload ----------
function BulkUpload({ students, reload, onClose }) {
  const [rows, setRows] = useState(null);       // [{day, text, meaning}]
  const [title, setTitle] = useState("");
  const [type, setType] = useState("word");
  const [recordMode, setRecordMode] = useState("each");   // 문장 녹음 방식: each | whole
  const [rounds, setRounds] = useState(3);
  const [perDay, setPerDay] = useState(20);
  const [hasDayCol, setHasDayCol] = useState(false);
  const [startDay, setStartDay] = useState(1);
  const [startDate, setStartDate] = useState(() => new Date().toISOString().slice(0,10));
  const [weekdays, setWeekdays] = useState([1,2,3,4,5]);
  const [mode, setMode] = useState("hidden");   // 기본값: 보관함(실수로 전체 배포 방지)
  const [classes, setClasses] = useState([]);
  const [ids, setIds] = useState([]);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [trBusy, setTrBusy] = useState(false);
  const [aiBusy, setAiBusy] = useState(false);
  const [aiSecs, setAiSecs] = useState(0);
  const aiTimer = useRef(null);
  const [needEng, setNeedEng] = useState(false);   // 한글뜻만 있는 파일 → 영어 채워야 함
  const [engBusy, setEngBusy] = useState(false);
  const [sentenceFix, setSentenceFix] = useState(true);   // 문장 자동 정리 (줄바꿈으로 잘린 문장 이어붙이기)
  const [srcKind, setSrcKind] = useState("");             // pdf | excel | ai

  const classNames = [...new Set(students.map(s=>s.className).filter(Boolean))];
  const DAYNAMES = ["일","월","화","수","목","금","토"];

  const [unitLabel, setUnitLabel] = useState("Day");   // Day | Unit | Lesson | 과 | 주차

  // Day/Unit/Lesson/과 등 단위 번호를 인식 (표기 다양)
  const dayNumber = (value) => {
    const text = String(value ?? "").trim();
    const match = text.match(/(?:^|[^a-z])(?:day|unit|lesson|lec|chapter)\s*0*(\d+)(?:\D|$)/i)
      || text.match(/(?:유닛|레슨|단원|챕터)\s*0*(\d+)/)
      || text.match(/(?:^|\D)0*(\d+)\s*(?:일차|유닛|레슨|과|강|주차|챕터|단원)(?:\D|$)/);
    return match ? Number(match[1]) : null;
  };
  // 어떤 단위 표기가 쓰였는지 감지
  const detectLabel = (text) => {
    const t = String(text || "");
    if (/unit/i.test(t) || /유닛/.test(t)) return "Unit";
    if (/lesson|lec/i.test(t) || /레슨/.test(t)) return "Lesson";
    if (/chapter|챕터|단원/i.test(t)) return "Unit";
    if (/주차|강/.test(t)) return "주차";
    if (/일차|과/.test(t)) return "과";
    if (/day/i.test(t)) return "Day";
    return null;
  };

  // 한 줄에서 영어(단어/구)와 한글 뜻을 분리. 영어가 없으면 null.
  const extractEng = (line) => {
    let s = String(line || "").replace(/^\s*\d+\s*[\.\)]?\s*/, "").trim();  // 앞 번호/불릿 제거
    if (!s) return null;
    const idx = s.search(/[가-힣]/);
    let eng = idx >= 0 ? s.slice(0, idx) : s;
    let kor = idx >= 0 ? s.slice(idx) : "";
    eng = eng.replace(/\b(n|v|adj|adv|prep|conj|pron|int|pl)\.\s*$/i, "").trim();  // 끝 영어 품사(n. v.) 제거
    eng = eng.replace(/[\s.\-–]+$/, "").replace(/\s{2,}/g, " ").trim();             // 끝의 … / 공백 정리
    if (!/[a-zA-Z]/.test(eng)) return null;   // 영어가 없으면 버림
    // 뜻 앞에 붙은 한글 품사 열(동/명/형/전/부…) 제거
    kor = kor.replace(/^(?:[동명형부대전접감관수조]|명사|동사|형용사|부사|대명사|전치사|접속사|감탄사|관사|수사|조동사)\s+/, "");
    return { text: eng, meaning: kor.replace(/\s{2,}/g, " ").trim() };
  };

  const parseExcel = async (file) => {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:"array" });
    const parsed = [];
    let label = null;
    for (const sheetName of wb.SheetNames) {
      let currentDay = dayNumber(sheetName);
      if (currentDay !== null) label = label || detectLabel(sheetName);
      const raw = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header:1 });
      for (const r of raw) {
        if (!r || !r.length) continue;
        const c0 = String(r[0] ?? "").trim();
        const c1 = String(r[1] ?? "").trim();
        const c2 = String(r[2] ?? "").trim();
        const rowDay = dayNumber(c0);
        if (/^(?:no\.?|번호)$/i.test(c0) || /^(?:english\s*word|영어\s*단어)$/i.test(c1)) continue;
        if (rowDay !== null) {
          currentDay = rowDay;
          label = label || detectLabel(c0);
          if (!c1) continue;
          parsed.push({ day: currentDay, text: c1, meaning: c2 });
          continue;
        }
        const numberedRow = /^\d+$/.test(c0) && c1;
        const wordCell = numberedRow ? c1 : (c0 || c1);
        if (!wordCell) continue;
        const meaningCell = numberedRow ? c2 : (c0 ? c1 : c2);
        const sp = splitMeaning(wordCell);
        parsed.push({ day: currentDay, text: sp.text || wordCell, meaning: sp.meaning || meaningCell });
      }
    }
    return { parsed, label };
  };

  const parsePdf = async (file) => {
    const pdf = await pdfToLines(file);
    const lines = dropRunningHeaders(pdf.lines, pdf.pages);   // 페이지마다 반복되는 교재명·머리말 제거
    const out = [];
    let curDay = null;
    let label = null;
    let seenWord = false;   // 이번 Day에서 단어 행을 하나라도 봤는지 (머리글 오인 방지)
    // 표 머리글 줄만 걸러낸다. (예전엔 name·class·date가 들어간 문장까지 통째로 버려졌다 — "My name is Tom.")
    const isHeaderish = (t) => {
      const s = String(t || "").trim();
      if (/^(?:no\.?|번호|english\s*word|영어\s*단어|뜻|meaning|단어|의미|page|\d+)$/i.test(s)) return true;
      if (/[.!?]$/.test(s)) return false;                  // 문장부호로 끝나면 문장이다
      if (s.split(/\s+/).length > 6) return false;         // 긴 줄은 머리글이 아니다
      return /단어|품사|어휘\s*리스트|능률|voca/i.test(s) || /^(?:class|name|date)\b/i.test(s);
    };
    lines.forEach(line => {
      const d = dayNumber(line);
      if (d !== null) {
        curDay = d;
        seenWord = false;
        label = label || detectLabel(line);
        const rest = line.replace(/.*(?:day|unit|lesson|lec|chapter)\s*0*\d+/i, "")
          .replace(/.*\d+\s*(?:일차|유닛|레슨|과|강|주차|챕터|단원)/, "")
          .replace(/^\s*[.\-–:)·]\s*/, "").trim();       // Unit 번호 뒤에 남은 구두점 정리
        const e = extractEng(rest);
        if (e) { out.push({ day: curDay, text: e.text, meaning: e.meaning, raw: rest, titleRow: true }); seenWord = true; }
        return;
      }
      if (isHeaderish(line)) return;
      const e = extractEng(line);
      if (e) { out.push({ day: curDay, text: e.text, meaning: e.meaning, raw: line }); seenWord = true; }
      else if (/[가-힣]/.test(line) && !/[a-zA-Z]/.test(line) && !/^\s*\d/.test(line) && out.length && seenWord) {
        // 영어 없이 한글만 있는 줄 = 앞 단어 뜻이 다음 줄로 이어진 것 → 이어붙임
        const last = out[out.length - 1];
        last.meaning = (last.meaning + " " + line).replace(/\s{2,}/g, " ").trim();
      }
    });
    return { parsed: out, label };
  };

  // 복잡한 레이아웃(여러 단·표)은 AI 파서(단어시험지 생성기)로 정확히 읽는다.
  const aiRead = async (file) => {
    if (!file) return;
    setErr(""); setRows(null); setAiBusy(true);
    setSrcKind("ai");
    setAiSecs(0);
    if (aiTimer.current) clearInterval(aiTimer.current);
    aiTimer.current = setInterval(() => setAiSecs(s => s + 1), 1000);
    try {
      const fd = new FormData();
      fd.append("file", file);
      const res = await fetch("/api/parse-book", { method:"POST", body: fd });
      if (!res.ok) { let d = "AI 분석 실패"; try { const j = await res.json(); d = j.detail || d; } catch (_) {} throw new Error(d); }
      const data = await res.json();
      const units = data.units || [];
      const parsed = [];
      let label = null;
      units.forEach(u => {
        const dn = dayNumber(u.unit_title);
        label = label || detectLabel(u.unit_title);
        (u.words || []).forEach(w => { if (w.word) parsed.push({ day: dn, text: w.word, meaning: w.kor || "" }); });
      });
      if (!parsed.length) { setErr("AI가 단어를 찾지 못했어요."); setAiBusy(false); return; }
      setHasDayCol(parsed.some(r => r.day != null));
      setRows(parsed);
      if (label) setUnitLabel(label);
      const dd = parsed.map(r=>r.day).filter(d=>d != null);
      setStartDay(dd.length ? Math.min(...dd) : 1);
      if (!title) setTitle(file.name.replace(/\.[^.]+$/, ""));
    } catch (e) { setErr("AI 분석 실패: " + e.message + " (생성기 서버가 자는 중이면 잠시 후 다시)"); }
    if (aiTimer.current) { clearInterval(aiTimer.current); aiTimer.current = null; }
    setAiBusy(false);
  };

  // 한글뜻만 있는 파일 → 각 줄(칸)을 '뜻'으로 잡고 영어는 비워서 반환
  const isHeaderishKor = (t) =>
    /단어|품사|어휘\s*리스트|능률|voca|class|name|date|번호|의미|^뜻$/i.test(t);
  const parseKorean = async (file) => {
    const name = (file.name || "").toLowerCase();
    let lines = [], label = null;
    if (name.endsWith(".pdf")) {
      lines = (await pdfToLines(file)).lines;
    } else {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type:"array" });
      for (const sheetName of wb.SheetNames) {
        const dn = dayNumber(sheetName);
        if (dn != null) { lines.push("§DAY§" + dn); label = label || detectLabel(sheetName); }
        XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header:1 }).forEach(r => {
          if (!r || !r.length) return;
          lines.push(r.map(x => String(x ?? "").trim()).filter(Boolean).join(" "));
        });
      }
    }
    const out = []; let curDay = null;
    lines.forEach(line => {
      if (line.startsWith("§DAY§")) { curDay = Number(line.slice(5)); return; }
      const d = dayNumber(line);
      if (d != null) { curDay = d; label = label || detectLabel(line); return; }
      if (isHeaderishKor(line)) return;
      const s = line.replace(/^\s*\d+\s*[\.\)]?\s*/, "").trim();   // 앞 번호 제거
      if (!s || !/[가-힣]/.test(s)) return;                        // 한글이 있어야 뜻
      out.push({ day: curDay, text: "", meaning: s });
    });
    return { parsed: out, label };
  };

  // rows의 빈 영어(text)를 한글 뜻으로부터 번역해 채운다
  const fillEnglish = async (src) => {
    const targets = src.map((r,i) => (r.meaning && !r.text) ? i : null).filter(i => i !== null);
    if (!targets.length) return src;
    const { translations } = await apiPost("/translate", { texts: targets.map(i => src[i].meaning), from:"ko", to:"en" });
    const next = src.map(r => ({...r}));
    targets.forEach((idx,k) => { next[idx].text = (translations[k] || "").trim(); });
    return next;
  };

  const readFile = async (file) => {
    setErr(""); setRows(null); setNeedEng(false);
    const name = (file.name || "").toLowerCase();
    const isPdf = name.endsWith(".pdf");
    setSrcKind(isPdf ? "pdf" : "excel");
    try {
      const res = isPdf ? await parsePdf(file) : await parseExcel(file);
      // 영어만: 영문자가 들어간 항목만 남김 (머리글·번호·한글전용 줄 제거)
      const parsed = res.parsed.filter(r => /[a-zA-Z]/.test(r.text || ""));
      if (parsed.length) {
        setHasDayCol(parsed.some(r => r.day != null));
        setRows(parsed);
        if (res.label) setUnitLabel(res.label);
        const detectedDays = parsed.map(r=>r.day).filter(d=>d != null);
        setStartDay(detectedDays.length ? Math.min(...detectedDays) : 1);
        if (!title) setTitle(file.name.replace(/\.[^.]+$/, ""));
        return;
      }
      // 영어가 하나도 없음 → 한글뜻만 있는 파일로 보고 영어를 자동 생성
      const kres = await parseKorean(file);
      if (!kres.parsed.length) return setErr("파일에서 단어를 찾지 못했어요. (엑셀은 A/B열, PDF는 텍스트형인지 확인)");
      setNeedEng(true);
      setHasDayCol(kres.parsed.some(r => r.day != null));
      if (kres.label) setUnitLabel(kres.label);
      const kd = kres.parsed.map(r=>r.day).filter(d=>d != null);
      setStartDay(kd.length ? Math.min(...kd) : 1);
      if (!title) setTitle(file.name.replace(/\.[^.]+$/, ""));
      setRows(kres.parsed);
      // 영어 자동 채우기
      setEngBusy(true);
      try { setRows(await fillEnglish(kres.parsed)); }
      catch (e) { setErr("영어 자동 채우기 실패: " + e.message + " (번역 키 확인)"); }
      setEngBusy(false);
    } catch (e) { setErr("파일을 읽는 데 실패했어요. (PDF는 스캔 이미지형이면 텍스트 추출이 안 돼요)"); }
  };

  // 문장 과제: PDF·엑셀의 '줄'을 문장 단위로 다시 나눈다 (줄바꿈으로 잘린 문장 복구)
  const fixedRows = React.useMemo(() => {
    if (!rows || type !== "sentence" || !sentenceFix) return rows;
    const out = [];
    let bucket = [], bucketDay;
    const flush = () => {
      if (!bucket.length) return;
      // 지문 제목 줄은 문장이 아니니 뒤 문장과 붙이지 않는다
      while (bucket.length && bucket[0].titleRow) out.push(bucket.shift());
      if (!bucket.length) return;
      const raws = bucket.map(r => r.raw || r.text).filter(Boolean);
      const text = raws.join("\n");
      // PDF는 '줄'이 문장 경계가 아니니 항상 문장으로 다시 나눈다. 엑셀·AI는 안전하게 판단해서.
      const sents = srcKind === "pdf" ? splitSentences(text) : sentencesOrLines(text);
      if (bucket.some(r => r.meaning) || !sents.length) out.push(...bucket);
      else sents.forEach(t => {
        const sp = splitSentenceMeaning(t);
        out.push({ day: bucketDay, text: sp.text, meaning: sp.meaning });
      });
      bucket = [];
    };
    rows.forEach(r => {
      if (bucket.length && r.day !== bucketDay) flush();
      bucketDay = r.day; bucket.push(r);
    });
    flush();
    return out;
  }, [rows, type, sentenceFix, srcKind]);

  // Day별로 묶기
  const groups = React.useMemo(() => {
    if (!fixedRows) return [];
    if (hasDayCol) {
      const m = {};
      fixedRows.filter(r => (r.day ?? 1) >= startDay)
        .forEach(r => { const d = r.day ?? 1; (m[d] = m[d] || []).push(r); });
      return Object.keys(m).map(Number).sort((a,b)=>a-b).map(d => ({ day:d, rows:m[d] }));
    }
    const out = [];
    for (let i=0; i<fixedRows.length; i+=perDay) {
      out.push({ day: out.length+1, rows: fixedRows.slice(i, i+perDay) });
    }
    return out;
  }, [fixedRows, hasDayCol, perDay, startDay]);

  // 선택한 요일에 맞춰 마감일 계산
  const dueDates = React.useMemo(() => {
    if (!groups.length || !weekdays.length) return [];
    const out = [];
    const [y,m,d] = startDate.split("-").map(Number);
    let cur = new Date(y, m-1, d);
    let guard = 0;
    while (out.length < groups.length && guard < 400) {
      if (weekdays.includes(cur.getDay())) {
        out.push(`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,"0")}-${String(cur.getDate()).padStart(2,"0")}`);
      }
      cur.setDate(cur.getDate()+1);
      guard++;
    }
    return out;
  }, [groups.length, startDate, weekdays]);

  const autoTranslate = async () => {
    if (!rows) return;
    const need = rows.map((r,i) => r.meaning ? null : i).filter(i => i !== null);
    if (!need.length) return setErr("이미 모든 항목에 한글 뜻이 있어요.");
    setTrBusy(true); setErr("");
    try {
      const r = await apiPost("/translate", { texts: need.map(i => rows[i].text) });
      const next = rows.map(x => ({...x}));
      need.forEach((idx,k) => { next[idx].meaning = r.translations[k] || ""; });
      setRows(next);
    } catch (e) { setErr(e.message); }
    setTrBusy(false);
  };

  const submit = async () => {
    if (!groups.length) return setErr("먼저 파일을 올려주세요.");
    if (!title.trim()) return setErr("교재 이름을 입력해주세요.");
    const hidden = mode === "hidden";
    if (!hidden && !weekdays.length) return setErr("숙제 요일을 하나 이상 선택해주세요.");
    let assignedIds = [];
    if (mode === "class") {
      if (!classes.length) return setErr("반을 선택해주세요.");
      assignedIds = students.filter(s=>classes.includes(s.className)).map(s=>s.id);
    } else if (mode === "individual") {
      if (!ids.length) return setErr("학생을 선택해주세요.");
      assignedIds = ids;
    }
    setBusy(true); setErr("");
    try {
      // 뜻이 비어 있는 단어는 과제 등록 전에 자동으로 한글 뜻을 생성해요.
      const translatedGroups = groups.map(g => ({
        ...g,
        rows: g.rows.map(r => ({...r})),
      }));
      // 영어(단어)가 비어 있으면 한글 뜻에서 자동 생성
      const missingEng = [];
      translatedGroups.forEach((g,gi) => g.rows.forEach((r,ri) => {
        if (!r.text && r.meaning) missingEng.push({ gi, ri, kor:r.meaning });
      }));
      if (missingEng.length) {
        setEngBusy(true);
        const te = await apiPost("/translate", { texts:missingEng.map(x=>x.kor), from:"ko", to:"en" });
        missingEng.forEach((m,k) => { translatedGroups[m.gi].rows[m.ri].text = (te.translations[k] || "").trim(); });
        setEngBusy(false);
      }
      const missing = [];
      translatedGroups.forEach((g,gi) => g.rows.forEach((r,ri) => {
        if (!r.meaning) missing.push({ gi, ri, text:r.text });
      }));
      if (missing.length) {
        setTrBusy(true);
        const tr = await apiPost("/translate", { texts:missing.map(x=>x.text) });
        missing.forEach((m,k) => {
          translatedGroups[m.gi].rows[m.ri].meaning = tr.translations[k] || "";
        });
        setTrBusy(false);
      }

      const payload = translatedGroups.map((g,i) => ({
        title: `${title.trim()} ${unitLabel} ${g.day}`,
        book: title.trim(),
        type, rounds, recordMode: type==="sentence" ? recordMode : "each",
        items: g.rows.map(r=>r.text),
        meanings: g.rows.map(r=>r.meaning || ""),
        dueDate: hidden ? null : (dueDates[i] || null),
        assignedIds,
        assignedClasses: mode==="class" ? classes : [],
        published: !hidden,
      }));
      const r = await apiPost("/assignments/bulk", { assignments: payload });
      await reload();
      alert(`${r.created}개 과제를 등록했어요!`);
      onClose();
    } catch (e) { setErr(e.message); setTrBusy(false); }
    setBusy(false);
  };

  const toggle = (arr, set, v) => set(arr.includes(v) ? arr.filter(x=>x!==v) : [...arr, v]);

  return (
    <div className="card">
      <div style={{ fontWeight:800, color:"var(--navy)", marginBottom:4 }}>교재 한 권 통째로 등록</div>
      <div className="muted" style={{ marginBottom:12 }}>
        엑셀·PDF를 올리면 영어만 뽑아 Day별로 여러 과제를 한 번에 만들어요.
        Day 표시가 있으면 그대로 쓰고, 없으면 정한 개수씩 자동으로 잘라요.
        <b>한글 뜻만 있는 파일</b>이면 영어를 자동으로 채워줘요.
      </div>

      <label className="btn full" style={{ display:"block", textAlign:"center", cursor:"pointer" }}>
        📗 교재 엑셀·PDF 올리기 (빠름)
        <input type="file" accept=".xlsx,.xls,.csv,.pdf,application/pdf" style={{display:"none"}}
          onChange={e=>{ const f=e.target.files[0]; if(f) readFile(f); e.target.value=""; }} />
      </label>
      <label className="btn-ghost full" style={{ display:"block", textAlign:"center", cursor:"pointer", marginTop:8, opacity: aiBusy?0.6:1 }}>
        {aiBusy ? `🤖 AI가 읽는 중... ${aiSecs}초 (유닛 많으면 최대 5분, 화면 닫지 마세요)` : "🤖 AI로 정확히 읽기 (여러 단·복잡한 표)"}
        <input type="file" accept=".xlsx,.xls,.pdf,application/pdf" style={{display:"none"}} disabled={aiBusy}
          onChange={e=>{ const f=e.target.files[0]; if(f) aiRead(f); e.target.value=""; }} />
      </label>
      <div className="muted" style={{ marginTop:8, fontSize:11, lineHeight:1.6 }}>
        형식 1 — A열: Day1 / B열: 영어 / C열: 한글뜻<br/>
        형식 2 — A열: 영어 (또는 "apple / 사과") / B열: 한글뜻
      </div>

      {err && <div className="err">{err}</div>}

      {rows && (
        <>
          <div style={{ marginTop:14, padding:10, background:"var(--cream)", borderRadius:8 }}>
            <b style={{ color:"var(--navy)" }}>{(fixedRows || rows).length}개</b> {type==="sentence" ? "문장" : "단어"}을 읽었어요 ·
            {hasDayCol ? " 파일의 구분 사용" : ` ${perDay}개씩 나눔`} →
            <b style={{ color:"var(--navy)" }}> {groups.length}개 과제</b>
            <button className="btn-ghost" style={{ fontSize:11, padding:"4px 8px", marginLeft:8 }}
              onClick={autoTranslate} disabled={trBusy}>
              {trBusy ? "번역 중..." : "🇰🇷 한글뜻 자동"}
            </button>
            <button className="btn-ghost" style={{ fontSize:11, padding:"4px 8px", marginLeft:6 }}
              onClick={async()=>{ setEngBusy(true); setErr(""); try { setRows(await fillEnglish(rows)); } catch(e){ setErr("영어 채우기 실패: "+e.message); } setEngBusy(false); }}
              disabled={engBusy}>
              {engBusy ? "영어 채우는 중..." : "🔤 영어 자동"}
            </button>
            {(needEng || rows.some(r=>!r.text)) && (
              <div style={{ marginTop:8, padding:"8px 10px", background:"#fff", borderRadius:8, border:"1px solid var(--line)" }}>
                <div style={{ fontSize:12, fontWeight:700, color:"var(--navy)" }}>
                  {engBusy ? "🔤 영어를 자동으로 채우는 중..." : "🔤 한글뜻으로 영어를 자동으로 채웠어요"}
                </div>
                <div className="muted" style={{ fontSize:11, marginTop:2 }}>자동 번역이라 어색한 게 있으면, 등록 후 과제 카드의 ✏️(단어 목록 수정)에서 고칠 수 있어요.</div>
                <div style={{ marginTop:6, fontSize:12, color:"var(--navy)", lineHeight:1.7 }}>
                  {rows.slice(0,8).map((r,i)=>(<div key={i}><b>{r.text || "?"}</b> <span className="muted">— {r.meaning}</span></div>))}
                  {rows.length>8 && <div className="muted">… 외 {rows.length-8}개</div>}
                </div>
              </div>
            )}
            <div style={{ fontSize:11, color:"var(--navy-soft)", margin:"8px 0 4px", fontWeight:700 }}>{unitLabel}별 {type==="sentence" ? "문장" : "단어"} 수</div>
            <div className="row" style={{ flexWrap:"wrap", gap:5 }}>
              {groups.map(g => {
                const few = g.rows.length < 5;
                return <span key={g.day} title={few ? "단어가 적어요" : ""}
                  style={{ fontSize:11, fontWeight:700, padding:"3px 8px", borderRadius:999,
                    background: few ? "#F6E1DC" : "#fff", color: few ? "var(--danger)" : "var(--navy)", border:"1px solid var(--line)" }}>
                  {unitLabel} {g.day} · {g.rows.length}개
                </span>;
              })}
            </div>
          </div>

          <div style={{height:14}} />
          <label className="label">교재 이름 (과제 제목에 들어가요)</label>
          <input className="field" value={title} onChange={e=>setTitle(e.target.value)} placeholder="예: 초등 필수 영단어" />
          <div className="muted" style={{ marginTop:4 }}>→ "{title || "교재명"} {unitLabel} 1", "{title || "교재명"} {unitLabel} 2" ...</div>

          {!hasDayCol && (
            <>
              <div style={{height:12}} />
              <label className="label">하루에 몇 개씩</label>
              <input className="field" type="number" min="1" max="100" value={perDay}
                onChange={e=>setPerDay(Math.max(1, Number(e.target.value)||1))} />
            </>
          )}

          {hasDayCol && (
            <>
              <div style={{height:12}} />
              <label className="label">시작 Day</label>
              <input className="field" type="number" min="1" value={startDay}
                onChange={e=>setStartDay(Math.max(1, Number(e.target.value)||1))} />
              <div className="muted" style={{ marginTop:4 }}>
                중간에 시작하는 학생은 여기에서 첫 학습 Day를 선택하세요. 선택한 Day가 아래 시작일에 배정돼요.
              </div>
            </>
          )}

          <div style={{height:12}} />
          <label className="label">유형</label>
          <div className="seg" style={{marginTop:0}}>
            {[["word","단어"],["sentence","문장"]].map(([v,l]) => (
              <button key={v} className={type===v?"on":""} onClick={()=>setType(v)}>{l}</button>
            ))}
          </div>

          {type==="sentence" && <>
            <div style={{height:12}} />
            <label className="label">문장 정리</label>
            <button onClick={()=>setSentenceFix(!sentenceFix)}
              style={{ width:"100%", textAlign:"left", padding:"10px 12px", borderRadius:8, fontSize:13, fontWeight:700,
                border:"1px solid var(--line)", background: sentenceFix ? "var(--navy)" : "#fff", color: sentenceFix ? "var(--cream)" : "var(--navy)" }}>
              {sentenceFix ? "✅" : "⬜"} 줄바꿈으로 잘린 문장 이어 붙이기
            </button>
            <div className="muted" style={{ marginTop:4, fontSize:12 }}>
              PDF는 한 문장이 두 줄로 잘려 있어요. 켜두면 마침표(. ? !)를 기준으로 문장을 온전하게 다시 맞춰요.
            </div>
            {groups[0] && (
              <div style={{ marginTop:8, padding:"8px 10px", background:"#fff", border:"1px solid var(--line)", borderRadius:8 }}>
                <div style={{ fontSize:11, fontWeight:700, color:"var(--navy)" }}>{unitLabel} {groups[0].day} 미리보기 ({groups[0].rows.length}문장)</div>
                <div style={{ marginTop:4, fontSize:12, color:"var(--navy)", lineHeight:1.7 }}>
                  {groups[0].rows.slice(0,4).map((r,i)=>(<div key={i}>{i+1}. {r.text}</div>))}
                  {groups[0].rows.length>4 && <div className="muted">… 외 {groups[0].rows.length-4}문장</div>}
                </div>
              </div>
            )}
            <div style={{height:12}} />
            <label className="label">녹음 방식</label>
            <div className="seg" style={{marginTop:0}}>
              <button className={recordMode==="each"?"on":""} onClick={()=>setRecordMode("each")}>문장별 끊어읽기</button>
              <button className={recordMode==="whole"?"on":""} onClick={()=>setRecordMode("whole")}>통문장 말하기</button>
            </div>
            <div className="muted" style={{ marginTop:4, fontSize:12 }}>
              {recordMode==="whole" ? "통문장을 한 번에 읽고 하나의 점수로 평가 (고학년용)" : "문장을 하나씩 녹음·채점 (저학년용)"}
            </div>
          </>}

          <div style={{height:12}} />
          <label className="label">녹음 횟수</label>
          <div className="seg" style={{marginTop:0}}>
