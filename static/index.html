<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const TAKES = 3;

async function api(path, opts) {
  const res = await fetch("/api" + path, opts);
  if (!res.ok) {
    let msg = "요청에 실패했어요.";
    try { const j = await res.json(); msg = j.detail || msg; } catch (e) {}
    throw new Error(msg);
  }
  return res.json();
}
const apiGet = (p) => api(p);
const apiPost = (p, body) => api(p, {
  method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {})
});
const apiDelete = (p) => api(p, { method: "DELETE" });
// 학생이 학습을 시작하면 실시간 현황판에 알림 (실패해도 무시)
const pingActivity = (sid, kind, title) => apiPost(`/activity/${sid}`, { kind, title }).catch(()=>{});

function normalizeTakes(v) {
  const arr = Array.isArray(v) ? v.slice(0, TAKES) : [];
  while (arr.length < TAKES) arr.push(null);
  return arr;
}
function formatDue(d) {
  if (!d) return null;
  const [y, m, day] = d.split("-").map(Number);
  return `${m}/${day}`;
}
// 교재 이름이 따로 없을 때, 제목 끝의 "Day/Unit/Lesson N"을 떼어 같은 시리즈로 묶는다.
function seriesOf(title) {
  return (title || "").replace(/\s*(?:day|unit|lesson|lec|chapter)\s*\d+\s*$/i, "")
    .replace(/\s*\d+\s*(?:일차|유닛|레슨|과|강|주차|챕터|단원)\s*$/, "").trim() || (title || "");
}
// 제목의 "Day/Unit/Lesson/과 N"에서 숫자만 뽑는다(정렬용). 없으면 null.
function dayNum(title) {
  const t = title || "";
  const m = /(?:day|unit|lesson|lec|chapter)\s*(\d+)/i.exec(t)
    || /(?:유닛|레슨|단원|챕터)\s*(\d+)/.exec(t)
    || /(\d+)\s*(?:일차|과|강|주차)/.exec(t);
  return m ? parseInt(m[1], 10) : null;
}
function dueStatus(d) {
  if (!d) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  const [y, m, day] = d.split("-").map(Number);
  const due = new Date(y, m - 1, day); due.setHours(0,0,0,0);
  const diff = Math.round((due - t) / 86400000);
  return diff < 0 ? "overdue" : diff === 0 ? "today" : "upcoming";
}
function scoreTone(s) {
  if (s == null) return "b-gray";
  if (s >= 85) return "b-navy";
  if (s >= 60) return "b-gold";
  return "b-danger";
}
function nowStr() {
  const d = new Date();
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

function splitMeaning(line) {
  // "apple / 사과" 또는 "apple - 사과" 형태를 분리
  const m = line.split(/\s+[/|\-–]\s+/);
  if (m.length >= 2) return { text: m[0].trim(), meaning: m.slice(1).join(" ").trim() };
  return { text: line.trim(), meaning: "" };
}

function useVoice() {
  const [voice, setVoice] = useState(null);
  useEffect(() => {
    if (!window.speechSynthesis) return;
    const pick = () => {
      const vs = speechSynthesis.getVoices();
      if (!vs.length) return;
      setVoice(vs.find(v => v.lang === "en-US") || vs.find(v => v.lang && v.lang.startsWith("en")) || vs[0]);
    };
    pick();
    speechSynthesis.onvoiceschanged = pick;
  }, []);
  return voice;
}
function speak(text, voice, rate) {
  if (!window.speechSynthesis) return alert("이 브라우저는 음성 재생을 지원하지 않아요.");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice;
  u.lang = "en-US";
  u.rate = rate || 0.7;
  u.pitch = 1.05;
  speechSynthesis.speak(u);
}
// 선생님이 올린 음원(url)이 있으면 그걸 재생, 없으면 TTS로 읽기
function playModel(url, text, voice, rate) {
  if (url) { try { const a = new Audio(url); a.play(); return; } catch (e) {} }
  speak(text, voice, rate);
}

function Badge({ tone, children }) {
  return <span className={"badge " + tone}>{children}</span>;
}

// ---------- Login ----------
function Login({ onStudent, onAdmin, onBattle }) {
  const [mode, setMode] = useState("student");
  const [sid, setSid] = useState(""); const [spw, setSpw] = useState("");
  const [apw, setApw] = useState(""); const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const go = async () => {
    setErr(""); setBusy(true);
    try {
      if (mode === "student") {
        const r = await apiPost("/login/student", { id: sid, pw: spw });
        onStudent(r.student);
      } else {
        await apiPost("/login/admin", { pw: apw });
        onAdmin();
      }
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };

  return (
    <div className="wrap" style={{ display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>
      <div style={{ width:"100%", maxWidth:360 }}>
        <div style={{ textAlign:"center", marginBottom:28 }}>
          <div style={{ fontSize:26, fontWeight:800, color:"var(--navy)" }}>해피트리 낭독 숙제</div>
          <div className="muted" style={{ marginTop:6 }}>단어 · 문장 녹음 제출</div>
        </div>
        <div style={{ display:"flex", background:"var(--cream-deep)", borderRadius:12, padding:4, marginBottom:16 }}>
          {[["student","학생"],["admin","선생님"]].map(([m,l]) => (
            <button key={m} onClick={() => { setMode(m); setErr(""); }}
              style={{ flex:1, padding:9, borderRadius:9, fontWeight:700, fontSize:14,
                background: mode===m ? "var(--navy)" : "transparent", color: mode===m ? "var(--cream)" : "var(--navy-soft)" }}>
              {l}
            </button>
          ))}
        </div>
        <div className="card">
          {mode === "student" ? (
            <>
              <label className="label">아이디</label>
              <input className="field" value={sid} onChange={e=>setSid(e.target.value)} placeholder="아이디" />
              <div style={{height:10}} />
              <label className="label">비밀번호</label>
              <input className="field" type="password" value={spw} onChange={e=>setSpw(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&go()} placeholder="비밀번호" />
            </>
          ) : (
            <>
              <label className="label">관리자 비밀번호</label>
              <input className="field" type="password" value={apw} onChange={e=>setApw(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&go()} placeholder="비밀번호" />
            </>
          )}
          {err && <div className="err">{err}</div>}
          <div style={{height:14}} />
          <button className="btn full" onClick={go} disabled={busy}>{busy ? "확인 중..." : "로그인"}</button>
        </div>
        <button onClick={onBattle}
          style={{ width:"100%", marginTop:12, padding:"12px", borderRadius:12, fontWeight:800, fontSize:15,
            color:"#fff", background:"linear-gradient(135deg,#9B5DE5,#F15BB5,#F4A259)" }}>
          🎮 단어 배틀 참가하기
        </button>
      </div>
    </div>
  );
}

// ---------- Recorder ----------
function Recorder({ index, text, meaning, take, round, onSaved, voice, audioUrl }) {
  const [rec, setRec] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const mrRef = useRef(null); const chunksRef = useRef([]);

  const start = async () => {
    setErr("");
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setErr("이 브라우저는 녹음을 지원하지 않아요.");
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      chunksRef.current = [];
      const mr = new MediaRecorder(stream);
      mrRef.current = mr;
      mr.ondataavailable = e => { if (e.data && e.data.size) chunksRef.current.push(e.data); };
      mr.onstop = async () => {
        const blob = new Blob(chunksRef.current, { type: mr.mimeType || "audio/webm" });
        stream.getTracks().forEach(t => t.stop());
        try {
          const fd = new FormData();
          fd.append("audio", blob, "take.webm");
          const up = await fetch("/api/audio", { method: "POST", body: fd });
          const upJson = await up.json();

          let score = null, recognized = null, detail = null, words = null, assessError = null, assessDebug = null;
          try {
            const fd2 = new FormData();
            fd2.append("audio", blob, "take.webm");
            fd2.append("text", text);
            const as = await fetch("/api/assess", { method: "POST", body: fd2 });
            if (as.ok) {
              const d = await as.json();
              recognized = d.recognizedText || null;
              score = d.pronScore != null ? Math.round(d.pronScore) : null;
              words = d.words || null;
              detail = {
                accuracy: d.accuracyScore != null ? Math.round(d.accuracyScore) : null,
                fluency: d.fluencyScore != null ? Math.round(d.fluencyScore) : null,
                completeness: d.completenessScore != null ? Math.round(d.completenessScore) : null,
              };
              if (score == null) {
                assessError = d.note || "인식되지 않았어요. 다시 녹음해볼까요?";
                assessDebug = [
                  d.status ? `상태 ${d.status}` : null,
                  d.audio ? `길이 ${(d.audio.durationMs/1000).toFixed(1)}초` : null,
                  d.audio && d.audio.dBFS != null ? `음량 ${d.audio.dBFS}dB` : null,
                  d.recognizedText ? `들린 내용 "${d.recognizedText}"` : null,
                ].filter(Boolean).join(" · ");
              }
            } else {
              let m = `발음평가 오류 (${as.status})`;
              try { const j = await as.json(); if (j.detail) m = j.detail; } catch (e) {}
              assessError = m;
            }
          } catch (e) {
            assessError = "발음평가 서버에 연결하지 못했어요.";
          }

          onSaved(index, round, { audio: upJson.url, recognized, score, detail, words, assessError, assessDebug });
        } catch (e) {
          setErr("업로드에 실패했어요. 인터넷 연결을 확인해주세요.");
        }
        setBusy(false);
      };
      mr.start();
      setRec(true);
    } catch (e) {
      setErr("마이크 접근이 거부되었어요. 주소창 왼쪽 자물쇠 아이콘에서 마이크를 허용해주세요.");
    }
  };

  const stop = () => {
    if (mrRef.current && rec) { setBusy(true); mrRef.current.stop(); setRec(false); }
  };

  return (
    <div className="card" style={ take ? { borderLeft:"4px solid var(--gold)" } : {} }>
      <div style={{ display:"flex", justifyContent:"space-between", gap:10 }}>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontSize:11, fontWeight:700, color:"var(--gold)" }}>
            {index+1}{take ? " · 완료" : ""}
          </div>
          <div style={{ fontSize:20, fontWeight:600, wordBreak:"break-word", lineHeight:1.4 }}>{text}</div>
          {meaning && (
            <div style={{ fontSize:15, color:"var(--navy-soft)", marginTop:4, fontWeight:500 }}>{meaning}</div>
          )}
        </div>
        <div style={{ display:"flex", flexDirection:"column", gap:6, flexShrink:0 }}>
          <button onClick={()=>playModel(audioUrl, text, voice, 0.7)}
            style={{ background:"var(--cream-deep)", color:"var(--navy)", borderRadius:9, padding:"8px 12px", fontSize:13, fontWeight:600, whiteSpace:"nowrap" }}>
            {audioUrl ? "🔊 선생님 발음" : "🔊 듣기"}
          </button>
          <button onClick={()=> audioUrl ? playModel(audioUrl, text, voice) : speak(text, voice, 0.45)}
            style={{ background:"#fff", color:"var(--navy)", border:"1px solid var(--line)", borderRadius:9, padding:"7px 12px", fontSize:12, whiteSpace:"nowrap" }}>
            {audioUrl ? "🔁 다시" : "🐢 천천히"}
          </button>
        </div>
      </div>

      <div className="row" style={{ marginTop:12 }}>
        {!rec ? (
          <button className={take ? "btn-ghost" : "btn"} onClick={start} disabled={busy}>
            🎤 {busy ? "처리 중..." : take ? "다시 녹음" : "녹음 시작"}
          </button>
        ) : (
          <button className="btn-danger" onClick={stop}>■ 녹음 중지</button>
        )}
        {take && <audio controls src={take.audio} />}
      </div>

      {take && take.score != null && (
        <div style={{ marginTop:12, background:"var(--cream)", borderRadius:10, padding:12 }}>
          <div style={{ display:"flex", alignItems:"center", gap:14 }}>
            <div style={{ textAlign:"center", minWidth:70 }}>
              <div style={{ fontSize:30, fontWeight:800, lineHeight:1,
                color: take.score>=85 ? "#2E7D5B" : take.score>=60 ? "#8A6D0F" : "var(--danger)" }}>
                {take.score}
              </div>
              <div style={{ fontSize:10, color:"var(--navy-soft)", marginTop:2 }}>종합 점수</div>
            </div>
            {take.detail && (
              <div style={{ flex:1, display:"flex", gap:6 }}>
                {[["정확도",take.detail.accuracy],["유창성",take.detail.fluency],["완성도",take.detail.completeness]].map(([l,v])=>(
                  <div key={l} style={{ flex:1, textAlign:"center" }}>
                    <div style={{ fontSize:16, fontWeight:700, color:"var(--navy)" }}>{v != null ? v : "-"}</div>
                    <div style={{ fontSize:10, color:"var(--navy-soft)" }}>{l}</div>
                    <div style={{ height:4, background:"#E3DCC8", borderRadius:2, marginTop:3, overflow:"hidden" }}>
                      <div style={{ width:`${v||0}%`, height:"100%", background:"var(--gold)" }} />
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
          {take.recognized && (
            <div className="muted" style={{ marginTop:8 }}>이렇게 들렸어요: "{take.recognized}"</div>
          )}
        </div>
      )}
      {take && take.score == null && take.assessError && (
        <div style={{ marginTop:10, fontSize:12, color:"var(--danger)" }}>⚠ {take.assessError}</div>
      )}
      {err && <div className="err">{err}</div>}
    </div>
  );
}

// ---------- Student ----------
function StudentView({ student, onLogout }) {
  const voice = useVoice();
  const [assignments, setAssignments] = useState([]);
  const [statusMap, setStatusMap] = useState({});
  const [open, setOpen] = useState(null);
  const [sub, setSub] = useState(null);
  const [round, setRound] = useState(0);
  const [loading, setLoading] = useState(true);
  const [msg, setMsg] = useState("");
  const [saveMsg, setSaveMsg] = useState("");
  const [done, setDone] = useState(false);
  const [openVocab, setOpenVocab] = useState(null);
  const [vocabProgress, setVocabProgress] = useState({});

  const mine = assignments.filter(a =>
    a.published !== false &&
    ((!a.assignedIds || !a.assignedIds.length) || a.assignedIds.includes(student.id)));

  const reloadVocab = () => apiGet(`/vocab/${student.id}`).then(setVocabProgress).catch(()=>{});

  useEffect(() => {
    reloadVocab();
    (async () => {
      // 과제 목록 + 제출상태를 각각 1번씩만 호출 (과제마다 따로 부르지 않음 → 접속 로딩 대폭 단축)
      const [list, subs] = await Promise.all([
        apiGet("/assignments"),
        apiGet(`/student-submissions/${student.id}`).catch(() => ({})),
      ]);
      setAssignments(list);
      const map = {};
      list.forEach(a => {
        const s = subs[a.id];
        map[a.id] = (s && s.status) ? s.status : "none";
      });
      setStatusMap(map);
      setLoading(false);
    })();
  }, []);

  const openA = async (a) => {
    setOpen(a);
    pingActivity(student.id, "record", a.title);
    const s = await apiGet(`/submission/${a.id}/${student.id}`);
    const items = a.items.map((_, i) => normalizeTakes((s.items || [])[i]));
    setSub({ items, comment: s.comment || "", status: s.status || "none" });
    const n = a.rounds || 3;
    let r = 0;
    for (let k = 0; k < n; k++) {
      if (items.every(it => it[k])) r = Math.min(k + 1, n - 1); else { r = k; break; }
    }
    setRound(r);
  };

  const onSaved = (idx, take, val) => {
    setSub(prev => {
      const items = prev.items.map(x => x.slice());
      items[idx][take] = val;
      const next = { ...prev, items };
      // 녹음할 때마다 서버에 바로 저장 (제출 전이라도 유실되지 않도록)
      apiPost(`/submission/${open.id}/${student.id}`, { items })
        .then(() => setSaveMsg("자동 저장됨"))
        .catch(() => setSaveMsg("자동 저장 실패 — 인터넷 연결을 확인해주세요"));
      setTimeout(()=>setSaveMsg(""), 2500);
      return next;
    });
  };

  const submit = async () => {
    const parts = [];
    for (let r = 0; r < (open.rounds || 3); r++) {
      const miss = sub.items.filter(it => !it[r]).length;
      if (miss) parts.push(`${r+1}회차 ${miss}개`);
    }
    if (parts.length && !confirm(`아직 녹음하지 않은 항목이 있어요 (${parts.join(", ")}). 그래도 제출할까요?`)) return;
    setMsg("제출 중...");
    try {
      await apiPost(`/submission/${open.id}/${student.id}`,
        { items: sub.items, status: "submitted", submittedAt: nowStr() });
      setStatusMap(m => ({ ...m, [open.id]: "submitted" }));
      setMsg("");
      setDone(true);
    } catch (e) { setMsg("제출 실패: " + e.message); }
  };

  if (loading) return <div className="center"><div className="spin" /></div>;

  if (open && sub) {
    return (
      <div className="wrap">
        <div className="hdr">
          <div className="row" style={{ gap:12 }}>
            <button onClick={()=>{ setOpen(null); setSub(null); }} style={{ background:"none", color:"var(--cream)", fontSize:22 }}>‹</button>
            <div>
              <div style={{ fontWeight:700, fontSize:15 }}>{open.title}</div>
              <div style={{ fontSize:11, color:"var(--gold-soft)" }}>
                {open.type==="word"?"단어":"문장"} {open.items.length}개 · {open.rounds || 3}회 녹음{open.dueDate ? ` · 마감 ${formatDue(open.dueDate)}` : ""}
              </div>
            </div>
          </div>
        </div>
        <div className="body" style={{ paddingBottom:100 }}>
          {sub.status === "reviewed" && sub.comment && (
            <div className="card" style={{ background:"#F3E4B8" }}>
              <div style={{ fontSize:11, fontWeight:700, color:"#8A6D0F", marginBottom:4 }}>선생님 코멘트</div>
              <div style={{ fontSize:14 }}>{sub.comment}</div>
            </div>
          )}

          {(open.rounds || 3) > 1 && (
            <div className="card" style={{ padding:12 }}>
              <div className="label" style={{ marginBottom:8 }}>몇 회차를 녹음할까요?</div>
              <div className="seg" style={{ marginTop:0 }}>
                {Array.from({length: open.rounds || 3}, (_,r) => {
                  const done = sub.items.filter(it => it[r]).length;
                  return (
                    <button key={r} className={round===r ? "on" : ""} onClick={()=>setRound(r)}>
                      {r+1}회차 ({done}/{sub.items.length})
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          {open.items.map((t,i) => (
            <Recorder key={`${round}-${i}`} index={i} text={t} meaning={(open.meanings||[])[i]}
              take={sub.items[i][round]} round={round} onSaved={onSaved} voice={voice}
              audioUrl={(open.exampleAudio||[])[i]} />
          ))}
        </div>
        <div style={{ position:"fixed", bottom:0, left:0, right:0, padding:14, background:"var(--cream)", borderTop:"1px solid var(--line)" }}>
          <div style={{ maxWidth:640, margin:"0 auto" }}>
            {msg && <div style={{ textAlign:"center", fontSize:12, fontWeight:700, color:"var(--navy)", marginBottom:8 }}>{msg}</div>}
            {!msg && saveMsg && <div style={{ textAlign:"center", fontSize:11, color:"var(--navy-soft)", marginBottom:8 }}>{saveMsg}</div>}
            <button className="btn full" onClick={submit}>제출하기</button>
          </div>
        </div>

        {done && (
          <div onClick={()=>{ setDone(false); setOpen(null); setSub(null); }}
            style={{ position:"fixed", inset:0, background:"rgba(27,46,76,0.75)", zIndex:100,
              display:"flex", alignItems:"center", justifyContent:"center", padding:24 }}>
            <div style={{ background:"#fff", borderRadius:20, padding:"36px 28px", textAlign:"center",
              maxWidth:340, width:"100%", boxShadow:"0 20px 60px rgba(0,0,0,0.3)" }}>
              <div style={{ fontSize:56, lineHeight:1, marginBottom:14 }}>🎉</div>
              <div style={{ fontSize:28, fontWeight:800, color:"var(--navy)", marginBottom:8 }}>제출 완료!</div>
              <div style={{ fontSize:15, color:"var(--navy-soft)", lineHeight:1.6, marginBottom:22 }}>
                {student.name} 학생, 오늘도 잘했어요.<br/>선생님이 확인하고 알려줄게요.
              </div>
              <button className="btn full" onClick={()=>{ setDone(false); setOpen(null); setSub(null); }}>
                확인
              </button>
            </div>
          </div>
        )}
      </div>
    );
  }

  if (openVocab) {
    return (
      <div className="wrap">
        <div className="hdr">
          <div className="row" style={{ gap:12 }}>
            <button onClick={()=>{ setOpenVocab(null); reloadVocab(); }} style={{ background:"none", color:"var(--cream)", fontSize:22 }}>‹</button>
            <div>
              <div style={{ fontWeight:700, fontSize:15 }}>{openVocab.title}</div>
              <div style={{ fontSize:11, color:"var(--gold-soft)" }}>단어 자습 · {openVocab.items.length}단어</div>
            </div>
          </div>
        </div>
        <div className="body">
          <VocabSetStudy assignment={openVocab} student={student} voice={voice}
            onClose={()=>{ setOpenVocab(null); reloadVocab(); }} />
        </div>
      </div>
    );
  }

  return (
    <div className="wrap">
      <div className="hdr">
        <div>
          <div style={{ fontSize:11, color:"var(--gold-soft)" }}>반갑습니다</div>
          <h1>{student.name} 학생</h1>
        </div>
        <button onClick={onLogout} style={{ background:"none", color:"var(--cream)", fontSize:13 }}>로그아웃</button>
      </div>
      <div className="body">
        <StudentHome mine={mine} statusMap={statusMap} vocabProgress={vocabProgress}
          onOpenRecord={openA} onOpenVocab={setOpenVocab} />
      </div>
    </div>
  );
}

// ---------- 학생 홈: 달력 + [녹음 숙제 / 단어 자습] 두 탭 (같은 달력 공유) ----------
function StudentHome({ mine, statusMap, vocabProgress, onOpenRecord, onOpenVocab }) {
  const today = new Date();
  const [ym, setYm] = useState({ y: today.getFullYear(), m: today.getMonth() });
  const [tab, setTab] = useState("record");
  const [picked, setPicked] = useState(() =>
    `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`);

  const isVocab = tab === "vocab";
  const source = isVocab
    ? mine.filter(a => (a.type || "word") === "word" && (a.items || []).length)
    : mine;

  const byDate = {};
  const noDate = [];
  source.forEach(a => {
    if (a.dueDate) (byDate[a.dueDate] = byDate[a.dueDate] || []).push(a);
    else noDate.push(a);
  });
  const dayCmp = (x, y) => {
    const dx = dayNum(x.title), dy = dayNum(y.title);
    if (dx != null && dy != null && dx !== dy) return dx - dy;
    return (x.title || "").localeCompare(y.title || "");
  };
  Object.keys(byDate).forEach(k => byDate[k].sort(dayCmp));
  noDate.sort(dayCmp);

  const first = new Date(ym.y, ym.m, 1);
  const daysInMonth = new Date(ym.y, ym.m + 1, 0).getDate();
  const startDow = first.getDay();
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const key = (d) => `${ym.y}-${String(ym.m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const todayKey = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;

  const move = (delta) => {
    let m = ym.m + delta, y = ym.y;
    if (m < 0) { m = 11; y--; }
    if (m > 11) { m = 0; y++; }
    setYm({ y, m });
  };

  const doneOf = (a) => isVocab
    ? !!(vocabProgress[a.id] && vocabProgress[a.id].best != null)
    : (statusMap[a.id] || "none") !== "none";

  const dayState = (d) => {
    const list = byDate[key(d)] || [];
    if (!list.length) return null;
    if (list.every(doneOf)) return "done";
    if (key(d) < todayKey) return "late";
    return "todo";
  };

  const pickedList = byDate[picked] || [];

  const recordCard = (a) => {
    const st = statusMap[a.id] || "none";
    return (
      <button key={a.id} onClick={()=>onOpenRecord(a)} className="card"
        style={{ display:"flex", width:"100%", textAlign:"left", justifyContent:"space-between", alignItems:"center", gap:10 }}>
        <div style={{ minWidth:0 }}>
          <div className="row" style={{ marginBottom:5 }}>
            <Badge tone={a.type==="word"?"b-navy":"b-gold"}>{a.type==="word"?"단어":"문장"}</Badge>
            <span className="muted">{a.items.length}개 · {a.rounds||3}회</span>
          </div>
          <div style={{ fontWeight:700, fontSize:15 }}>{a.title}</div>
        </div>
        <Badge tone={st==="none"?"b-gray":st==="submitted"?"b-gold":"b-navy"}>
          {st==="none"?"미제출":st==="submitted"?"제출완료":"확인완료"}
        </Badge>
      </button>
    );
  };
  const vocabCard = (a) => {
    const rec = vocabProgress[a.id];
    return (
      <button key={a.id} onClick={()=>onOpenVocab(a)} className="card"
        style={{ display:"flex", width:"100%", textAlign:"left", justifyContent:"space-between", alignItems:"center", gap:10 }}>
        <div style={{ minWidth:0 }}>
          <div className="row" style={{ marginBottom:5 }}>
            <Badge tone="b-navy">단어</Badge>
            <span className="muted">{a.items.length}단어</span>
          </div>
          <div style={{ fontWeight:700, fontSize:15 }}>{a.title}</div>
        </div>
        <Badge tone={rec ? "b-navy" : "b-gray"}>{rec ? `최고 ${rec.best}점` : "시작 전"}</Badge>
      </button>
    );
  };
  const card = isVocab ? vocabCard : recordCard;

  return (
    <>
      <div className="seg" style={{ marginBottom:12 }}>
        <button className={!isVocab ? "on" : ""} onClick={()=>setTab("record")}>📅 녹음 숙제</button>
        <button className={isVocab ? "on" : ""} onClick={()=>setTab("vocab")}>📚 단어 자습</button>
      </div>

      <div className="card" style={{ padding:14 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
          <button onClick={()=>move(-1)} style={{ background:"none", fontSize:22, color:"var(--navy)", padding:"0 10px" }}>‹</button>
          <div style={{ fontWeight:800, fontSize:17, color:"var(--navy)" }}>{ym.y}년 {ym.m+1}월</div>
          <button onClick={()=>move(1)} style={{ background:"none", fontSize:22, color:"var(--navy)", padding:"0 10px" }}>›</button>
        </div>

        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:4, marginBottom:6 }}>
          {["일","월","화","수","목","금","토"].map((n,i) => (
            <div key={n} style={{ textAlign:"center", fontSize:11, fontWeight:700,
              color: i===0 ? "var(--danger)" : i===6 ? "#3B6FA0" : "var(--navy-soft)" }}>{n}</div>
          ))}
        </div>

        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:4 }}>
          {cells.map((d,i) => {
            if (!d) return <div key={"e"+i} />;
            const k = key(d);
            const st = dayState(d);
            const isToday = k === todayKey;
            const isPicked = k === picked;
            const colors = { done:"#2E7D5B", todo:"var(--gold)", late:"var(--danger)" };
            return (
              <button key={k} onClick={()=>setPicked(k)}
                style={{ aspectRatio:"1", borderRadius:10, position:"relative",
                  background: isPicked ? "var(--navy)" : isToday ? "var(--cream-deep)" : "transparent",
                  border: isToday && !isPicked ? "1px solid var(--gold)" : "none",
                  color: isPicked ? "#fff" : "var(--ink)",
                  fontSize:14, fontWeight: st ? 700 : 400,
                  display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:2 }}>
                {d}
                {st && <span style={{ width:6, height:6, borderRadius:"50%",
                  background: isPicked ? "#fff" : colors[st] }} />}
              </button>
            );
          })}
        </div>

        <div className="row" style={{ gap:12, marginTop:12, justifyContent:"center" }}>
          {[["#2E7D5B", isVocab?"완료":"완료"],["var(--gold)", isVocab?"할 수 있어요":"해야 해요"],["var(--danger)","기한 지남"]].map(([c,l]) => (
            <span key={l} style={{ fontSize:11, color:"var(--navy-soft)", display:"inline-flex", alignItems:"center", gap:4 }}>
              <span style={{ width:7, height:7, borderRadius:"50%", background:c, display:"inline-block" }} />{l}
            </span>
          ))}
        </div>
      </div>

      <div style={{ fontWeight:700, color:"var(--navy)", margin:"14px 4px 8px", fontSize:14 }}>
        {picked.slice(5).replace("-","월 ")}일 {isVocab ? "단어 자습" : "숙제"}
      </div>
      {!pickedList.length && (
        <div className="card" style={{ textAlign:"center", padding:24 }}>
          <span className="muted">이 날은 {isVocab ? "단어 자습이" : "숙제가"} 없어요 🎈</span>
        </div>
      )}
      {pickedList.map(card)}

      {noDate.length > 0 && (
        <>
          <div style={{ fontWeight:700, color:"var(--navy)", margin:"18px 4px 8px", fontSize:14 }}>날짜 없는 {isVocab ? "단어장" : "숙제"}</div>
          {noDate.map(card)}
        </>
      )}
    </>
  );
}

// ---------- Admin: students ----------
function AdminStudents({ students, reload }) {
  const [name, setName] = useState(""); const [cls, setCls] = useState("");
  const [id, setId] = useState(""); const [pw, setPw] = useState("");
  const [err, setErr] = useState(""); const [busy, setBusy] = useState(false);
  const [preview, setPreview] = useState(null); const [bulkBusy, setBulkBusy] = useState(false);
  const [editSid, setEditSid] = useState(null); const [editCls, setEditCls] = useState("");

  const saveClass = async (sid) => {
    try {
      await fetch("/api/students/" + sid, { method:"PATCH", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ className: editCls }) });
      setEditSid(null); await reload();
    } catch (e) { setErr(e.message); }
  };

  const readStudentsFile = async (file) => {
    if (!file) return;
    setErr(""); setPreview(null);
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type:"array" });
      const rows = [];
      const idxOf = (h, keys) => h.findIndex(v => keys.some(k => v.replace(/\s/g,"").toLowerCase().includes(k)));
      for (const sh of wb.SheetNames) {
        const raw = XLSX.utils.sheet_to_json(wb.Sheets[sh], { header:1 });
        if (!raw.length) continue;
        let cName = 0, cClass = 1, cId = -1, cPw = -1, start = 0;
        const h = (raw[0] || []).map(x => String(x ?? "").trim());
        const ni = idxOf(h, ["이름","name","성명","학생"]);
        if (ni >= 0) { cName = ni; start = 1;
          const ci = idxOf(h, ["반","class","클래스"]); if (ci>=0) cClass = ci;
          const ii = idxOf(h, ["아이디","id"]); if (ii>=0) cId = ii;
          const pi = idxOf(h, ["비밀","비번","pw","password"]); if (pi>=0) cPw = pi;
        }
        for (let r = start; r < raw.length; r++) {
          const row = raw[r] || [];
          const nm = String(row[cName] ?? "").trim();
          if (!nm) continue;
          rows.push({ name: nm, className: String(row[cClass] ?? "").trim(),
            id: cId>=0 ? String(row[cId] ?? "").trim() : "", pw: cPw>=0 ? String(row[cPw] ?? "").trim() : "" });
        }
      }
      if (!rows.length) return setErr("파일에서 학생 이름을 찾지 못했어요. (첫 열에 이름, 둘째 열에 반)");
      setPreview(rows);
    } catch (e) { setErr("엑셀을 읽는 데 실패했어요."); }
  };
  const downloadTemplate = () => {
    const data = [
      ["이름","반","아이디","비밀번호"],
      ["홍길동","초등5반","",""],
      ["김철수","초등5반","",""],
      ["이영희","초등3반","",""],
    ];
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws["!cols"] = [{ wch:12 },{ wch:12 },{ wch:14 },{ wch:12 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "학생명단");
    XLSX.writeFile(wb, "학생명단_예시.xlsx");
  };

  const submitBulk = async () => {
    if (!preview || !preview.length) return;
    setBulkBusy(true); setErr("");
    try {
      const r = await apiPost("/students/bulk", { students: preview });
      setPreview(null);
      await reload();
      alert(`${r.created}명을 등록했어요!`);
    } catch (e) { setErr(e.message); }
    setBulkBusy(false);
  };

  const add = async () => {
    if (!name.trim()) return setErr("이름을 입력해주세요.");
    setBusy(true); setErr("");
    try {
      await apiPost("/students", { name, className: cls, id, pw });
      setName(""); setCls(""); setId(""); setPw("");
      await reload();
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };

  const del = async (sid) => {
    if (!confirm("이 학생을 삭제할까요?")) return;
    await apiDelete("/students/" + sid);
    await reload();
  };

  return (
    <div className="body">
      <datalist id="cls-list">
        {[...new Set(students.map(s=>s.className).filter(Boolean))].map(c => <option key={c} value={c} />)}
      </datalist>
      <div className="card">
        <div style={{ fontWeight:700, marginBottom:12, color:"var(--navy)" }}>학생 추가</div>
        <label className="label">이름</label>
        <input className="field" value={name} onChange={e=>setName(e.target.value)} placeholder="홍길동" />
        <div style={{height:10}} />
        <label className="label">반 (선택)</label>
        <input className="field" value={cls} onChange={e=>setCls(e.target.value)} placeholder="초등3반" />
        <div style={{height:10}} />
        <label className="label">아이디 (비워두면 자동 발급)</label>
        <input className="field" value={id} onChange={e=>setId(e.target.value)} placeholder="기존 학원 아이디" />
        <div style={{height:10}} />
        <label className="label">비밀번호 (비워두면 자동 발급)</label>
        <input className="field" value={pw} onChange={e=>setPw(e.target.value)} placeholder="기존 비밀번호" />
        {err && !preview && <div className="err">{err}</div>}
        <div style={{height:14}} />
        <button className="btn" onClick={add} disabled={busy}>아이디 발급</button>
      </div>

      <div className="card">
        <div style={{ fontWeight:700, marginBottom:6, color:"var(--navy)" }}>📋 엑셀로 한꺼번에 등록</div>
        <div className="muted" style={{ marginBottom:10, fontSize:13, lineHeight:1.6 }}>
          첫 줄 머리글: <b>이름 · 반 · 아이디 · 비밀번호</b> (반·아이디·비번은 없어도 됨 → 자동 발급).<br/>
          머리글이 없으면 <b>1열=이름, 2열=반</b>으로 읽어요.
        </div>
        <button className="btn full" style={{ marginBottom:8 }} onClick={downloadTemplate}>📥 예시 엑셀 먼저 받기</button>
        <div className="muted" style={{ marginBottom:8, fontSize:12 }}>예시 파일을 받아 <b>틀 안에 채운 뒤</b> 아래로 올리면 오류가 없어요.</div>
        <label className="btn-ghost full" style={{ display:"block", textAlign:"center", cursor:"pointer" }}>
          📄 학생 명단 엑셀 올리기
          <input type="file" accept=".xlsx,.xls,.csv" style={{ display:"none" }}
            onChange={e=>{ const f=e.target.files[0]; if(f) readStudentsFile(f); e.target.value=""; }} />
        </label>
        {err && preview===null && <div className="err">{err}</div>}
        {preview && (
          <>
            <div style={{ marginTop:12, marginBottom:8, fontWeight:700, color:"var(--navy)", fontSize:13 }}>
              미리보기 · <b>{preview.length}명</b>
            </div>
            <div style={{ maxHeight:200, overflowY:"auto", border:"1px solid var(--line)", borderRadius:8 }}>
              {preview.map((s,i) => (
                <div key={i} style={{ display:"flex", justifyContent:"space-between", gap:8, padding:"7px 10px",
                  borderBottom: i<preview.length-1 ? "1px solid #F0EBDD" : "none", fontSize:13 }}>
                  <span style={{ fontWeight:600 }}>{s.name}</span>
                  <span className="muted">{s.className || "반 미지정"}{s.id ? ` · ${s.id}` : ""}</span>
                </div>
              ))}
            </div>
            {err && <div className="err">{err}</div>}
            <div className="row" style={{ marginTop:12, gap:6 }}>
              <button className="btn" style={{ flex:1 }} onClick={submitBulk} disabled={bulkBusy}>
                {bulkBusy ? "등록 중..." : `${preview.length}명 등록하기`}
              </button>
              <button className="btn-ghost" onClick={()=>setPreview(null)}>취소</button>
            </div>
          </>
        )}
      </div>

      {(() => {
        const byClass = {};
        students.forEach(s => { const c = s.className || "반 미지정"; (byClass[c] = byClass[c] || []).push(s); });
        const keys = Object.keys(byClass).sort((a,b) => a==="반 미지정" ? 1 : b==="반 미지정" ? -1 : a.localeCompare(b));
        return keys.map(c => (
          <div key={c}>
            <div style={{ fontWeight:800, color:"var(--navy)", margin:"18px 4px 8px", fontSize:15 }}>
              📚 {c} <span className="muted" style={{ fontWeight:500, fontSize:13 }}>{byClass[c].length}명</span>
            </div>
            {byClass[c].slice().sort((a,b)=>(a.name||"").localeCompare(b.name||"")).map(s => (
              <div key={s.id} className="card">
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:8 }}>
                  <div>
                    <div style={{ fontWeight:700, fontSize:14 }}>{s.name}
                      <span className="muted" style={{ fontWeight:500 }}> · {s.className || "반 미지정"}</span></div>
                    <div className="muted" style={{ marginTop:3 }}>
                      아이디 <b style={{color:"var(--navy)"}}>{s.id}</b> / 비밀번호 <b style={{color:"var(--navy)"}}>{s.pw}</b>
                    </div>
                  </div>
                  <div className="row" style={{ gap:8, flexShrink:0 }}>
                    <button onClick={()=>{ setEditSid(editSid===s.id?null:s.id); setEditCls(s.className||""); }}
                      title="반 변경" style={{ background:"none", fontSize:16 }}>✏️</button>
                    <button onClick={()=>del(s.id)} style={{ background:"none", color:"var(--danger)", fontSize:18 }}>🗑</button>
                  </div>
                </div>
                {editSid===s.id && (
                  <div className="row" style={{ gap:6, marginTop:10 }}>
                    <input className="field" style={{ flex:1, padding:"7px 10px", fontSize:13 }} value={editCls}
                      onChange={e=>setEditCls(e.target.value)} placeholder="반 이름 (예: 초등5반)"
                      list="cls-list" onKeyDown={e=>e.key==="Enter"&&saveClass(s.id)} autoFocus />
                    <button className="btn" style={{ padding:"7px 12px", fontSize:12 }} onClick={()=>saveClass(s.id)}>저장</button>
                    <button className="btn-ghost" style={{ padding:"7px 12px", fontSize:12 }} onClick={()=>setEditSid(null)}>취소</button>
                  </div>
                )}
              </div>
            ))}
          </div>
        ));
      })()}
      {!students.length && <div style={{ textAlign:"center", padding:40 }} className="muted">등록된 학생이 없어요.</div>}
    </div>
  );
}

// ---------- Admin: bulk book upload ----------
function BulkUpload({ students, reload, onClose }) {
  const [rows, setRows] = useState(null);       // [{day, text, meaning}]
  const [title, setTitle] = useState("");
  const [type, setType] = useState("word");
  const [rounds, setRounds] = useState(3);
  const [perDay, setPerDay] = useState(20);
  const [hasDayCol, setHasDayCol] = useState(false);
  const [startDay, setStartDay] = useState(1);
  const [startDate, setStartDate] = useState(() => new Date().toISOString().slice(0,10));
  const [weekdays, setWeekdays] = useState([1,2,3,4,5]);
  const [mode, setMode] = useState("all");
  const [classes, setClasses] = useState([]);
  const [ids, setIds] = useState([]);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [trBusy, setTrBusy] = useState(false);
  const [aiBusy, setAiBusy] = useState(false);

  const classNames = [...new Set(students.map(s=>s.className).filter(Boolean))];
  const DAYNAMES = ["일","월","화","수","목","금","토"];

  const [unitLabel, setUnitLabel] = useState("Day");   // Day | Unit | Lesson | 과 | 주차

  // Day/Unit/Lesson/과 등 단위 번호를 인식 (표기 다양)
  const dayNumber = (value) => {
    const text = String(value ?? "").trim();
    const match = text.match(/(?:^|[^a-z])(?:day|unit|lesson|lec|chapter)\s*0*(\d+)(?:\D|$)/i)
      || text.match(/(?:유닛|레슨|단원|챕터)\s*0*(\d+)/)
      || text.match(/(?:^|\D)0*(\d+)\s*(?:일차|유닛|레슨|과|강|주차|챕터|단원)(?:\D|$)/);
    return match ? Number(match[1]) : null;
  };
  // 어떤 단위 표기가 쓰였는지 감지
  const detectLabel = (text) => {
    const t = String(text || "");
    if (/unit/i.test(t) || /유닛/.test(t)) return "Unit";
    if (/lesson|lec/i.test(t) || /레슨/.test(t)) return "Lesson";
    if (/chapter|챕터|단원/i.test(t)) return "Unit";
    if (/주차|강/.test(t)) return "주차";
    if (/일차|과/.test(t)) return "과";
    if (/day/i.test(t)) return "Day";
    return null;
  };

  // 한 줄에서 영어(단어/구)와 한글 뜻을 분리. 영어가 없으면 null.
  const extractEng = (line) => {
    let s = String(line || "").replace(/^\s*\d+\s*[\.\)]?\s*/, "").trim();  // 앞 번호/불릿 제거
    if (!s) return null;
    const idx = s.search(/[가-힣]/);
    let eng = idx >= 0 ? s.slice(0, idx) : s;
    let kor = idx >= 0 ? s.slice(idx) : "";
    eng = eng.replace(/\b(n|v|adj|adv|prep|conj|pron|int|pl)\.\s*$/i, "").trim();  // 끝 품사 제거
    eng = eng.replace(/\s{2,}/g, " ").trim();
    if (!/[a-zA-Z]/.test(eng)) return null;   // 영어가 없으면 버림
    return { text: eng, meaning: kor.replace(/\s{2,}/g, " ").trim() };
  };

  const parseExcel = async (file) => {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:"array" });
    const parsed = [];
    let label = null;
    for (const sheetName of wb.SheetNames) {
      let currentDay = dayNumber(sheetName);
      if (currentDay !== null) label = label || detectLabel(sheetName);
      const raw = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header:1 });
      for (const r of raw) {
        if (!r || !r.length) continue;
        const c0 = String(r[0] ?? "").trim();
        const c1 = String(r[1] ?? "").trim();
        const c2 = String(r[2] ?? "").trim();
        const rowDay = dayNumber(c0);
        if (/^(?:no\.?|번호)$/i.test(c0) || /^(?:english\s*word|영어\s*단어)$/i.test(c1)) continue;
        if (rowDay !== null) {
          currentDay = rowDay;
          label = label || detectLabel(c0);
          if (!c1) continue;
          parsed.push({ day: currentDay, text: c1, meaning: c2 });
          continue;
        }
        const numberedRow = /^\d+$/.test(c0) && c1;
        const wordCell = numberedRow ? c1 : (c0 || c1);
        if (!wordCell) continue;
        const meaningCell = numberedRow ? c2 : (c0 ? c1 : c2);
        const sp = splitMeaning(wordCell);
        parsed.push({ day: currentDay, text: sp.text || wordCell, meaning: sp.meaning || meaningCell });
      }
    }
    return { parsed, label };
  };

  const parsePdf = async (file) => {
    const buf = await file.arrayBuffer();
    const doc = await pdfjsLib.getDocument({ data: buf }).promise;
    const lines = [];
    for (let p = 1; p <= doc.numPages; p++) {
      const page = await doc.getPage(p);
      const content = await page.getTextContent();
      const byRow = {};
      content.items.forEach(it => { const y = Math.round(it.transform[5]); (byRow[y] = byRow[y] || []).push(it); });
      Object.keys(byRow).map(Number).sort((a,b)=>b-a).forEach(y => {
        const line = byRow[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(" ").replace(/\s+/g," ").trim();
        if (line) lines.push(line);
      });
    }
    const out = [];
    let curDay = null;
    let label = null;
    lines.forEach(line => {
      const d = dayNumber(line);
      if (d !== null) {
        curDay = d;
        label = label || detectLabel(line);
        const rest = line.replace(/.*(?:day|unit|lesson|lec|chapter)\s*0*\d+/i, "")
          .replace(/.*\d+\s*(?:일차|유닛|레슨|과|강|주차|챕터|단원)/, "").trim();
        const e = extractEng(rest);
        if (e) out.push({ day: curDay, text: e.text, meaning: e.meaning });
        return;
      }
      if (/^(?:no\.?|번호|english\s*word|영어\s*단어|뜻|meaning|단어|의미|page|\d+)$/i.test(line)) return;
      const e = extractEng(line);
      if (e) out.push({ day: curDay, text: e.text, meaning: e.meaning });
    });
    return { parsed: out, label };
  };

  // 복잡한 레이아웃(여러 단·표)은 AI 파서(단어시험지 생성기)로 정확히 읽는다.
  const aiRead = async (file) => {
    if (!file) return;
    setErr(""); setRows(null); setAiBusy(true);
    try {
      const fd = new FormData();
      fd.append("file", file);
      const res = await fetch("/api/parse-book", { method:"POST", body: fd });
      if (!res.ok) { let d = "AI 분석 실패"; try { const j = await res.json(); d = j.detail || d; } catch (_) {} throw new Error(d); }
      const data = await res.json();
      const units = data.units || [];
      const parsed = [];
      let label = null;
      units.forEach(u => {
        const dn = dayNumber(u.unit_title);
        label = label || detectLabel(u.unit_title);
        (u.words || []).forEach(w => { if (w.word) parsed.push({ day: dn, text: w.word, meaning: w.kor || "" }); });
      });
      if (!parsed.length) { setErr("AI가 단어를 찾지 못했어요."); setAiBusy(false); return; }
      setHasDayCol(parsed.some(r => r.day != null));
      setRows(parsed);
      if (label) setUnitLabel(label);
      const dd = parsed.map(r=>r.day).filter(d=>d != null);
      setStartDay(dd.length ? Math.min(...dd) : 1);
      if (!title) setTitle(file.name.replace(/\.[^.]+$/, ""));
    } catch (e) { setErr("AI 분석 실패: " + e.message + " (생성기 서버가 자는 중이면 잠시 후 다시)"); }
    setAiBusy(false);
  };

  const readFile = async (file) => {
    setErr(""); setRows(null);
    const name = (file.name || "").toLowerCase();
    try {
      const res = name.endsWith(".pdf") ? await parsePdf(file) : await parseExcel(file);
      // 영어만: 영문자가 들어간 항목만 남김 (머리글·번호·한글전용 줄 제거)
      const parsed = res.parsed.filter(r => /[a-zA-Z]/.test(r.text || ""));
      if (!parsed.length) return setErr("파일에서 영어 단어를 찾지 못했어요. (엑셀은 A/B열, PDF는 텍스트형인지 확인)");
      const dayCol = parsed.some(r => r.day != null);
      setHasDayCol(dayCol);
      setRows(parsed);
      if (res.label) setUnitLabel(res.label);
      const detectedDays = parsed.map(r=>r.day).filter(d=>d != null);
      setStartDay(detectedDays.length ? Math.min(...detectedDays) : 1);
      if (!title) setTitle(file.name.replace(/\.[^.]+$/, ""));
    } catch (e) { setErr("파일을 읽는 데 실패했어요. (PDF는 스캔 이미지형이면 텍스트 추출이 안 돼요)"); }
  };

  // Day별로 묶기
  const groups = React.useMemo(() => {
    if (!rows) return [];
    if (hasDayCol) {
      const m = {};
      rows.filter(r => (r.day ?? 1) >= startDay)
        .forEach(r => { const d = r.day ?? 1; (m[d] = m[d] || []).push(r); });
      return Object.keys(m).map(Number).sort((a,b)=>a-b).map(d => ({ day:d, rows:m[d] }));
    }
    const out = [];
    for (let i=0; i<rows.length; i+=perDay) {
      out.push({ day: out.length+1, rows: rows.slice(i, i+perDay) });
    }
    return out;
  }, [rows, hasDayCol, perDay, startDay]);

  // 선택한 요일에 맞춰 마감일 계산
  const dueDates = React.useMemo(() => {
    if (!groups.length || !weekdays.length) return [];
    const out = [];
    const [y,m,d] = startDate.split("-").map(Number);
    let cur = new Date(y, m-1, d);
    let guard = 0;
    while (out.length < groups.length && guard < 400) {
      if (weekdays.includes(cur.getDay())) {
        out.push(`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,"0")}-${String(cur.getDate()).padStart(2,"0")}`);
      }
      cur.setDate(cur.getDate()+1);
      guard++;
    }
    return out;
  }, [groups.length, startDate, weekdays]);

  const autoTranslate = async () => {
    if (!rows) return;
    const need = rows.map((r,i) => r.meaning ? null : i).filter(i => i !== null);
    if (!need.length) return setErr("이미 모든 항목에 한글 뜻이 있어요.");
    setTrBusy(true); setErr("");
    try {
      const r = await apiPost("/translate", { texts: need.map(i => rows[i].text) });
      const next = rows.map(x => ({...x}));
      need.forEach((idx,k) => { next[idx].meaning = r.translations[k] || ""; });
      setRows(next);
    } catch (e) { setErr(e.message); }
    setTrBusy(false);
  };

  const submit = async () => {
    if (!groups.length) return setErr("먼저 파일을 올려주세요.");
    if (!title.trim()) return setErr("교재 이름을 입력해주세요.");
    const hidden = mode === "hidden";
    if (!hidden && !weekdays.length) return setErr("숙제 요일을 하나 이상 선택해주세요.");
    let assignedIds = [];
    if (mode === "class") {
      if (!classes.length) return setErr("반을 선택해주세요.");
      assignedIds = students.filter(s=>classes.includes(s.className)).map(s=>s.id);
    } else if (mode === "individual") {
      if (!ids.length) return setErr("학생을 선택해주세요.");
      assignedIds = ids;
    }
    setBusy(true); setErr("");
    try {
      // 뜻이 비어 있는 단어는 과제 등록 전에 자동으로 한글 뜻을 생성해요.
      const translatedGroups = groups.map(g => ({
        ...g,
        rows: g.rows.map(r => ({...r})),
      }));
      const missing = [];
      translatedGroups.forEach((g,gi) => g.rows.forEach((r,ri) => {
        if (!r.meaning) missing.push({ gi, ri, text:r.text });
      }));
      if (missing.length) {
        setTrBusy(true);
        const tr = await apiPost("/translate", { texts:missing.map(x=>x.text) });
        missing.forEach((m,k) => {
          translatedGroups[m.gi].rows[m.ri].meaning = tr.translations[k] || "";
        });
        setTrBusy(false);
      }

      const payload = translatedGroups.map((g,i) => ({
        title: `${title.trim()} ${unitLabel} ${g.day}`,
        book: title.trim(),
        type, rounds,
        items: g.rows.map(r=>r.text),
        meanings: g.rows.map(r=>r.meaning || ""),
        dueDate: hidden ? null : (dueDates[i] || null),
        assignedIds,
        assignedClasses: mode==="class" ? classes : [],
        published: !hidden,
      }));
      const r = await apiPost("/assignments/bulk", { assignments: payload });
      await reload();
      alert(`${r.created}개 과제를 등록했어요!`);
      onClose();
    } catch (e) { setErr(e.message); setTrBusy(false); }
    setBusy(false);
  };

  const toggle = (arr, set, v) => set(arr.includes(v) ? arr.filter(x=>x!==v) : [...arr, v]);

  return (
    <div className="card">
      <div style={{ fontWeight:800, color:"var(--navy)", marginBottom:4 }}>교재 한 권 통째로 등록</div>
      <div className="muted" style={{ marginBottom:12 }}>
        엑셀·PDF를 올리면 영어만 뽑아 Day별로 여러 과제를 한 번에 만들어요.
        Day 표시가 있으면 그대로 쓰고, 없으면 정한 개수씩 자동으로 잘라요.
      </div>

      <label className="btn full" style={{ display:"block", textAlign:"center", cursor:"pointer" }}>
        📗 교재 엑셀·PDF 올리기 (빠름)
        <input type="file" accept=".xlsx,.xls,.csv,.pdf,application/pdf" style={{display:"none"}}
          onChange={e=>{ const f=e.target.files[0]; if(f) readFile(f); e.target.value=""; }} />
      </label>
      <label className="btn-ghost full" style={{ display:"block", textAlign:"center", cursor:"pointer", marginTop:8, opacity: aiBusy?0.6:1 }}>
        {aiBusy ? "🤖 AI가 읽는 중... (수십 초)" : "🤖 AI로 정확히 읽기 (여러 단·복잡한 표)"}
        <input type="file" accept=".xlsx,.xls,.pdf,application/pdf" style={{display:"none"}} disabled={aiBusy}
          onChange={e=>{ const f=e.target.files[0]; if(f) aiRead(f); e.target.value=""; }} />
      </label>
      <div className="muted" style={{ marginTop:8, fontSize:11, lineHeight:1.6 }}>
        형식 1 — A열: Day1 / B열: 영어 / C열: 한글뜻<br/>
        형식 2 — A열: 영어 (또는 "apple / 사과") / B열: 한글뜻
      </div>

      {err && <div className="err">{err}</div>}

      {rows && (
        <>
          <div style={{ marginTop:14, padding:10, background:"var(--cream)", borderRadius:8 }}>
            <b style={{ color:"var(--navy)" }}>{rows.length}개</b> 단어를 읽었어요 ·
            {hasDayCol ? " 파일의 구분 사용" : ` ${perDay}개씩 나눔`} →
            <b style={{ color:"var(--navy)" }}> {groups.length}개 과제</b>
            <button className="btn-ghost" style={{ fontSize:11, padding:"4px 8px", marginLeft:8 }}
              onClick={autoTranslate} disabled={trBusy}>
              {trBusy ? "번역 중..." : "🇰🇷 한글뜻 자동"}
            </button>
            <div style={{ fontSize:11, color:"var(--navy-soft)", margin:"8px 0 4px", fontWeight:700 }}>{unitLabel}별 단어 수</div>
            <div className="row" style={{ flexWrap:"wrap", gap:5 }}>
              {groups.map(g => {
                const few = g.rows.length < 5;
                return <span key={g.day} title={few ? "단어가 적어요" : ""}
                  style={{ fontSize:11, fontWeight:700, padding:"3px 8px", borderRadius:999,
                    background: few ? "#F6E1DC" : "#fff", color: few ? "var(--danger)" : "var(--navy)", border:"1px solid var(--line)" }}>
                  {unitLabel} {g.day} · {g.rows.length}개
                </span>;
              })}
            </div>
          </div>

          <div style={{height:14}} />
          <label className="label">교재 이름 (과제 제목에 들어가요)</label>
          <input className="field" value={title} onChange={e=>setTitle(e.target.value)} placeholder="예: 초등 필수 영단어" />
          <div className="muted" style={{ marginTop:4 }}>→ "{title || "교재명"} {unitLabel} 1", "{title || "교재명"} {unitLabel} 2" ...</div>

          {!hasDayCol && (
            <>
              <div style={{height:12}} />
              <label className="label">하루에 몇 개씩</label>
              <input className="field" type="number" min="1" max="100" value={perDay}
                onChange={e=>setPerDay(Math.max(1, Number(e.target.value)||1))} />
            </>
          )}

          {hasDayCol && (
            <>
              <div style={{height:12}} />
              <label className="label">시작 Day</label>
              <input className="field" type="number" min="1" value={startDay}
                onChange={e=>setStartDay(Math.max(1, Number(e.target.value)||1))} />
              <div className="muted" style={{ marginTop:4 }}>
                중간에 시작하는 학생은 여기에서 첫 학습 Day를 선택하세요. 선택한 Day가 아래 시작일에 배정돼요.
              </div>
            </>
          )}

          <div style={{height:12}} />
          <label className="label">유형</label>
          <div className="seg" style={{marginTop:0}}>
            {[["word","단어"],["sentence","문장"]].map(([v,l]) => (
              <button key={v} className={type===v?"on":""} onClick={()=>setType(v)}>{l}</button>
            ))}
          </div>

          <div style={{height:12}} />
          <label className="label">녹음 횟수</label>
          <div className="seg" style={{marginTop:0}}>

// ---------- Admin: assignments ----------
function AdminAssignments({ students, assignments, reload, voice }) {
  const [show, setShow] = useState(false);
  const [showBulk, setShowBulk] = useState(false);
  const [title, setTitle] = useState(""); const [type, setType] = useState("word");
  const [list, setList] = useState(""); const [due, setDue] = useState("");
  const [rounds, setRounds] = useState(3);
  const [mode, setMode] = useState("all");
  const [classes, setClasses] = useState([]); const [ids, setIds] = useState([]);
  const [err, setErr] = useState(""); const [pdfBusy, setPdfBusy] = useState(false);
  const [trBusy, setTrBusy] = useState(false);
  const [fillBusy, setFillBusy] = useState(false);

  const autoTranslate = async () => {
    const lines = list.split("\n").map(s=>s.trim()).filter(Boolean);
    if (!lines.length) return setErr("먼저 목록을 입력해주세요.");
    setTrBusy(true); setErr("");
    try {
      const parsed = lines.map(splitMeaning);
      const need = parsed.map((p,i) => p.meaning ? null : i).filter(i => i !== null);
      if (!need.length) { setErr("이미 모든 항목에 한글 뜻이 있어요."); setTrBusy(false); return; }
      const r = await apiPost("/translate", { texts: need.map(i => parsed[i].text) });
      need.forEach((idx, k) => { parsed[idx].meaning = r.translations[k] || ""; });
      setList(parsed.map(p => p.meaning ? `${p.text} / ${p.meaning}` : p.text).join("\n"));
    } catch (e) { setErr(e.message); }
    setTrBusy(false);
  };

  const classNames = [...new Set(students.map(s=>s.className).filter(Boolean))];

  const readExcel = async (file) => {
    setErr("");
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type:"array" });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1 });
      const lines = rows.map(r => (r && r.length ? String(r[0] ?? "").trim() : "")).filter(Boolean);
      if (!lines.length) return setErr("파일에서 읽을 내용이 없어요. A열을 확인해주세요.");
      setList(p => p.trim() ? p.trim()+"\n"+lines.join("\n") : lines.join("\n"));
    } catch (e) { setErr("엑셀 파일을 읽는 데 실패했어요."); }
  };

  const readPdf = async (file) => {
    setErr(""); setPdfBusy(true);
    try {
      const buf = await file.arrayBuffer();
      const doc = await pdfjsLib.getDocument({ data: buf }).promise;
      let all = [];
      for (let p=1; p<=doc.numPages; p++) {
        const page = await doc.getPage(p);
        const c = await page.getTextContent();
        const rows = {};
        c.items.forEach(it => {
          const y = Math.round(it.transform[5]);
          (rows[y] = rows[y] || []).push(it);
        });
        Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y => {
          const line = rows[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join("").trim();
          if (line) all.push(line);
        });
      }
      if (!all.length) setErr("PDF에서 텍스트를 찾지 못했어요. 스캔 이미지형일 수 있어요.");
      else setList(p => p.trim() ? p.trim()+"\n"+all.join("\n") : all.join("\n"));
    } catch (e) { setErr("PDF를 읽는 데 실패했어요."); }
    setPdfBusy(false);
  };

  const create = async () => {
    const lines = list.split("\n").map(s=>s.trim()).filter(Boolean);
    if (!title.trim() || !lines.length) return setErr("제목과 목록을 입력해주세요.");
    const parsed = lines.map(splitMeaning);
    const items = parsed.map(p => p.text);
    const meanings = parsed.map(p => p.meaning);
    let assignedIds = [];
    if (mode === "class") {
      if (!classes.length) return setErr("반을 선택해주세요.");
      assignedIds = students.filter(s=>classes.includes(s.className)).map(s=>s.id);
    } else if (mode === "individual") {
      if (!ids.length) return setErr("학생을 선택해주세요.");
      assignedIds = ids;
    }
    try {
      await apiPost("/assignments", {
        title, type, items, meanings, dueDate: mode==="hidden" ? null : (due || null), rounds, assignedIds,
        assignedClasses: mode==="class" ? classes : [], published: mode!=="hidden"
      });
      setTitle(""); setList(""); setDue(""); setRounds(3); setMode("all"); setClasses([]); setIds([]);
      setShow(false); setErr("");
      await reload();
    } catch (e) { setErr(e.message); }
  };

  const del = async (aid) => {
    if (!confirm("이 과제를 삭제할까요?")) return;
    await apiDelete("/assignments/" + aid);
    await reload();
  };

  const fillExistingMeanings = async () => {
    if (!assignments.length) return setErr("등록된 과제가 없어요.");
    if (!confirm("기존 과제에서 비어 있는 한글 뜻을 모두 자동 생성할까요?")) return;
    setFillBusy(true); setErr("");
    try {
      const r = await apiPost("/assignments/fill-meanings", {});
      await reload();
      if (r.updatedMeanings) {
        alert(`${r.updatedAssignments}개 과제의 한글 뜻 ${r.updatedMeanings}개를 채웠어요!`);
      } else {
        alert("이미 모든 과제에 한글 뜻이 있어요.");
      }
    } catch (e) { setErr(e.message); }
    setFillBusy(false);
  };

  const toggle = (arr, set, v) => set(arr.includes(v) ? arr.filter(x=>x!==v) : [...arr, v]);

  return (
    <div className="body">
      {!show && !showBulk ? (
        <div className="row" style={{ gap:8 }}>
          <button className="btn" style={{ flex:1 }} onClick={()=>setShow(true)}>+ 새 과제 만들기</button>
          <button className="btn-ghost" style={{ flex:1 }} onClick={()=>setShowBulk(true)}>📗 교재 통째로 등록</button>
          <button className="btn-ghost" style={{ flex:1 }} onClick={fillExistingMeanings} disabled={fillBusy}>
            {fillBusy ? "한글뜻 생성 중..." : "🇰🇷 기존 과제 한글뜻 채우기"}
          </button>
        </div>
      ) : showBulk ? (
        <BulkUpload students={students} reload={reload} onClose={()=>setShowBulk(false)} />
      ) : (
        <div className="card">
          <label className="label">과제 제목</label>
          <input className="field" value={title} onChange={e=>setTitle(e.target.value)} placeholder="예: Unit 3 단어" />
          <div style={{height:10}} />
          <label className="label">마감일 (선택)</label>
          <input className="field" type="date" value={due} onChange={e=>setDue(e.target.value)} />
          <div style={{height:10}} />
          <label className="label">유형</label>
          <div className="seg" style={{marginTop:0}}>
            {[["word","단어"],["sentence","문장"]].map(([v,l]) => (
              <button key={v} className={type===v?"on":""} onClick={()=>setType(v)}>{l}</button>
            ))}
          </div>
          <div style={{height:10}} />
          <label className="label">녹음 횟수 (전체를 몇 번 반복할지)</label>
          <div className="seg" style={{marginTop:0}}>
            {[1,2,3].map(n => (
              <button key={n} className={rounds===n?"on":""} onClick={()=>setRounds(n)}>{n}회</button>
            ))}
          </div>
          <div style={{height:14}} />
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:6 }}>
            <span className="label" style={{marginBottom:0}}>목록 (한 줄에 하나씩)</span>
            <div className="row" style={{gap:6}}>
              <label className="btn-ghost" style={{ fontSize:12, padding:"6px 10px" }}>
                엑셀 업로드
                <input type="file" accept=".xlsx,.xls,.csv" style={{display:"none"}}
                  onChange={e=>{ const f=e.target.files[0]; if(f) readExcel(f); e.target.value=""; }} />
              </label>
              <label className="btn-ghost" style={{ fontSize:12, padding:"6px 10px", opacity: pdfBusy?0.5:1 }}>
                {pdfBusy ? "분석 중..." : "PDF 업로드"}
                <input type="file" accept=".pdf" style={{display:"none"}} disabled={pdfBusy}
                  onChange={e=>{ const f=e.target.files[0]; if(f) readPdf(f); e.target.value=""; }} />
              </label>
              <button className="btn-ghost" style={{ fontSize:12, padding:"6px 10px" }}
                onClick={autoTranslate} disabled={trBusy}>
                {trBusy ? "번역 중..." : "🇰🇷 한글뜻 자동"}
              </button>
            </div>
          </div>
          <div style={{height:6}} />
          <textarea className="field" rows={6} value={list} onChange={e=>setList(e.target.value)}
            placeholder={"apple / 사과\nbanana / 바나나\n\n한글 뜻은 '/' 뒤에 쓰거나, 영어만 넣고 '한글뜻 자동'을 누르세요."} />
          {list.trim() && (
            <div className="row" style={{ marginTop:8 }}>
              {list.split("\n").map(s=>s.trim()).filter(Boolean).slice(0,6).map((w,i)=>(
                <button key={i} onClick={()=>speak(w, voice)}

          <div style={{height:14}} />
          <label className="label">배정 대상</label>
          <div className="seg" style={{marginTop:0}}>
            {[["all","전체"],["class","반별"],["individual","개별"],["hidden","보관"]].map(([v,l]) => (

          {mode==="individual" && (

// ---------- 반 → 교재 → 과제 브라우저 ----------
function AssignmentBrowser({ students, assignments, reload }) {
  const [group, setGroup] = useState(null);   // 선택한 반/대상
  const [book, setBook] = useState(null);     // 선택한 교재

  const classNames = [...new Set(students.map(s=>s.className).filter(Boolean))];

  const groupsOf = (a) => {
    if (a.published === false) return ["📦 보관함"];
    if (a.assignedClasses?.length) return a.assignedClasses;
    if (a.assignedIds?.length) {
      const names = students.filter(s=>a.assignedIds.includes(s.id)).map(s=>s.className || s.name);
      return [...new Set(names)];
    }
    return ["전체"];
  };

  // 반별 집계
  const byGroup = {};
  assignments.forEach(a => groupsOf(a).forEach(g => { (byGroup[g] = byGroup[g] || []).push(a); }));
  const groupKeys = Object.keys(byGroup).sort();

  if (!group) {
    return (
      <>
        <div style={{ fontWeight:700, color:"var(--navy)", margin:"6px 0 10px", fontSize:13 }}>
          반 / 대상별 보기
        </div>
        {!groupKeys.length && <div className="muted" style={{textAlign:"center",padding:30}}>등록된 과제가 없어요.</div>}
        {groupKeys.map(g => {
          const list = byGroup[g];
          const books = new Set(list.map(a => a.book || a.title));
          return (
            <button key={g} className="card" onClick={()=>{setGroup(g); setBook(null);}}
              style={{ display:"flex", width:"100%", justifyContent:"space-between", alignItems:"center", textAlign:"left" }}>
              <div>
                <div style={{ fontWeight:700, fontSize:15 }}>{g}</div>
                <div className="muted" style={{ marginTop:3 }}>교재 {books.size}권 · 과제 {list.length}개</div>
              </div>
              <span style={{ color:"var(--navy-soft)", fontSize:20 }}>›</span>
            </button>
          );
        })}
      </>
    );
  }

  const inGroup = byGroup[group] || [];
  const byBook = {};
  inGroup.forEach(a => { const b = a.book || seriesOf(a.title); (byBook[b] = byBook[b] || []).push(a); });
  const bookKeys = Object.keys(byBook).sort();

  if (!book) {
    return (
      <>
        <button onClick={()=>setGroup(null)} style={{ background:"none", color:"var(--navy)", fontWeight:700, fontSize:16, marginBottom:10 }}>
          ‹ 반 목록으로
        </button>
        <div style={{ fontWeight:800, fontSize:22, marginBottom:12 }}>{group}</div>
        {bookKeys.map(b => {
          const list = byBook[b];
          const dues = list.map(a=>a.dueDate).filter(Boolean).sort();
          return (
            <button key={b} className="card" onClick={()=>setBook(b)}
              style={{ display:"flex", width:"100%", justifyContent:"space-between", alignItems:"center", textAlign:"left" }}>
              <div style={{ minWidth:0 }}>
                <div style={{ fontWeight:700, fontSize:18 }}>📗 {b}</div>
                <div className="muted" style={{ marginTop:4, fontSize:15 }}>
                  과제 {list.length}개
                  {dues.length ? ` · ${formatDue(dues[0])} ~ ${formatDue(dues[dues.length-1])}` : ""}
                </div>
              </div>
              <span style={{ color:"var(--navy-soft)", fontSize:20 }}>›</span>
            </button>
          );
        })}
      </>
    );
  }

  const list = [...(byBook[book] || [])].sort((x,y) => {
    const dx = dayNum(x.title), dy = dayNum(y.title);
    if (dx != null && dy != null && dx !== dy) return dx - dy;   // Day 1 → 마지막 Day
    const dd = (x.dueDate||"").localeCompare(y.dueDate||"");      // Day 번호 없으면 마감일 순
    if (dd !== 0) return dd;
    return (x.title||"").localeCompare(y.title||"");             // (1/2) → (2/2) 순서 유지
  });

  return <BookDetail book={book} group={group} list={list} reload={reload} students={students}
    onBack={()=>setBook(null)} />;
}

// ---------- 교재 상세 + 일정 조정 ----------
function BookDetail({ book, group, list, reload, onBack, students }) {
  const [panel, setPanel] = useState(null);   // 'shift' | 'respread' | null
  const [days, setDays] = useState(7);
