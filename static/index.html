<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>해피트리 낭독 숙제</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --navy: #1B2E4C;
    --navy-soft: #3C5075;
    --cream: #F7F3E9;
    --cream-deep: #EFE7D4;
    --gold: #C9A227;
    --gold-soft: #E4C766;
    --ink: #26241F;
    --danger: #B3432F;
    --line: #D8D0BB;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--cream); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
  }
  button { font-family: inherit; cursor: pointer; border: none; }
  input, textarea, select { font-family: inherit; }
  .wrap { max-width: 640px; margin: 0 auto; min-height: 100vh; }
  .hdr { background: var(--navy); color: var(--cream); padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; }
  .hdr h1 { margin: 0; font-size: 18px; }
  .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .btn { background: var(--navy); color: var(--cream); border-radius: 9px; padding: 11px 16px; font-size: 14px; font-weight: 600; }
  .btn:disabled { opacity: .4; }
  .btn-ghost { background: #fff; color: var(--navy); border: 1px solid var(--line); border-radius: 9px; padding: 9px 14px; font-size: 14px; font-weight: 500; }
  .btn-danger { background: var(--danger); color: #fff; border-radius: 9px; padding: 11px 16px; font-size: 14px; font-weight: 600; }
  .full { width: 100%; }
  .field { width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 11px 12px; font-size: 15px; outline: none; background: #fff; }
  .label { font-size: 12px; font-weight: 600; color: var(--navy-soft); margin-bottom: 5px; display: block; }
  .tabs { display: flex; gap: 4px; padding: 8px; background: var(--cream); position: sticky; top: 0; z-index: 5; }
  .tab { flex: 1; padding: 10px 4px; border-radius: 9px; font-size: 12px; font-weight: 600; background: transparent; color: var(--navy-soft); }
  .tab.on { background: #fff; color: var(--navy); }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .b-gray { background: #E7E3D8; color: #6B6552; }
  .b-gold { background: #F3E4B8; color: #8A6D0F; }
  .b-navy { background: #DCE3EE; color: var(--navy); }
  .b-danger { background: #F3D9D2; color: var(--danger); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { font-size: 12px; color: var(--navy-soft); }
  .err { font-size: 12px; color: var(--danger); margin-top: 6px; }
  .body { padding: 16px; }
  audio { height: 36px; }
  .seg { display: flex; gap: 6px; margin-top: 12px; }
  .seg button { flex: 1; padding: 8px; border-radius: 9px; font-size: 12px; font-weight: 700; border: 1px solid var(--navy); background: #fff; color: var(--navy); }
  .seg button.on { background: var(--navy); color: var(--cream); }
  .spin { display:inline-block; width:18px; height:18px; border:2px solid var(--line); border-top-color: var(--navy); border-radius:50%; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .center { display: flex; align-items: center; justify-content: center; min-height: 60vh; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const TAKES = 3;

async function api(path, opts) {
  const res = await fetch("/api" + path, opts);
  if (!res.ok) {
    let msg = "요청에 실패했어요.";
    try { const j = await res.json(); msg = j.detail || msg; } catch (e) {}
    throw new Error(msg);
  }
  return res.json();
}
const apiGet = (p) => api(p);
const apiPost = (p, body) => api(p, {
  method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {})
});
const apiDelete = (p) => api(p, { method: "DELETE" });

function normalizeTakes(v) {
  const arr = Array.isArray(v) ? v.slice(0, TAKES) : [];
  while (arr.length < TAKES) arr.push(null);
  return arr;
}
function formatDue(d) {
  if (!d) return null;
  const [y, m, day] = d.split("-").map(Number);
  return `${m}/${day}`;
}
function dueStatus(d) {
  if (!d) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  const [y, m, day] = d.split("-").map(Number);
  const due = new Date(y, m - 1, day); due.setHours(0,0,0,0);
  const diff = Math.round((due - t) / 86400000);
  return diff < 0 ? "overdue" : diff === 0 ? "today" : "upcoming";
}
function scoreTone(s) {
  if (s == null) return "b-gray";
  if (s >= 85) return "b-navy";
  if (s >= 60) return "b-gold";
  return "b-danger";
}
function nowStr() {
  const d = new Date();
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

function splitMeaning(line) {
  // "apple / 사과" 또는 "apple - 사과" 형태를 분리
  const m = line.split(/\s+[/|\-–]\s+/);
  if (m.length >= 2) return { text: m[0].trim(), meaning: m.slice(1).join(" ").trim() };
  return { text: line.trim(), meaning: "" };
}

function useVoice() {
  const [voice, setVoice] = useState(null);
  useEffect(() => {
    if (!window.speechSynthesis) return;
    const pick = () => {
      const vs = speechSynthesis.getVoices();
      if (!vs.length) return;
      setVoice(vs.find(v => v.lang === "en-US") || vs.find(v => v.lang && v.lang.startsWith("en")) || vs[0]);
    };
    pick();
    speechSynthesis.onvoiceschanged = pick;
  }, []);
  return voice;
}
function speak(text, voice, rate) {
  if (!window.speechSynthesis) return alert("이 브라우저는 음성 재생을 지원하지 않아요.");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice;
  u.lang = "en-US";
  u.rate = rate || 0.7;
  u.pitch = 1.05;
  speechSynthesis.speak(u);
}

function Badge({ tone, children }) {
  return <span className={"badge " + tone}>{children}</span>;
}

// ---------- Login ----------
function Login({ onStudent, onAdmin }) {
  const [mode, setMode] = useState("student");
  const [sid, setSid] = useState(""); const [spw, setSpw] = useState("");
  const [apw, setApw] = useState(""); const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const go = async () => {
    setErr(""); setBusy(true);
    try {
      if (mode === "student") {
        const r = await apiPost("/login/student", { id: sid, pw: spw });
        onStudent(r.student);
      } else {
        await apiPost("/login/admin", { pw: apw });
        onAdmin();
      }
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };

  return (
    <div className="wrap" style={{ display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>
      <div style={{ width:"100%", maxWidth:360 }}>
        <div style={{ textAlign:"center", marginBottom:28 }}>
          <div style={{ fontSize:26, fontWeight:800, color:"var(--navy)" }}>해피트리 낭독 숙제</div>
          <div className="muted" style={{ marginTop:6 }}>단어 · 문장 녹음 제출</div>
        </div>
        <div style={{ display:"flex", background:"var(--cream-deep)", borderRadius:12, padding:4, marginBottom:16 }}>
          {[["student","학생"],["admin","선생님"]].map(([m,l]) => (
            <button key={m} onClick={() => { setMode(m); setErr(""); }}
              style={{ flex:1, padding:9, borderRadius:9, fontWeight:700, fontSize:14,
                background: mode===m ? "var(--navy)" : "transparent", color: mode===m ? "var(--cream)" : "var(--navy-soft)" }}>
              {l}
            </button>
          ))}
        </div>
        <div className="card">
          {mode === "student" ? (
            <>
              <label className="label">아이디</label>
              <input className="field" value={sid} onChange={e=>setSid(e.target.value)} placeholder="아이디" />
              <div style={{height:10}} />
              <label className="label">비밀번호</label>
              <input className="field" type="password" value={spw} onChange={e=>setSpw(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&go()} placeholder="비밀번호" />
            </>
          ) : (
            <>
              <label className="label">관리자 비밀번호</label>
              <input className="field" type="password" value={apw} onChange={e=>setApw(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&go()} placeholder="비밀번호" />
            </>
          )}
          {err && <div className="err">{err}</div>}
          <div style={{height:14}} />
          <button className="btn full" onClick={go} disabled={busy}>{busy ? "확인 중..." : "로그인"}</button>
        </div>
      </div>
    </div>
  );
}

// ---------- Recorder ----------
function Recorder({ index, text, meaning, take, round, onSaved, voice }) {
  const [rec, setRec] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const mrRef = useRef(null); const chunksRef = useRef([]);

  const start = async () => {
    setErr("");
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setErr("이 브라우저는 녹음을 지원하지 않아요.");
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      chunksRef.current = [];
      const mr = new MediaRecorder(stream);
      mrRef.current = mr;
      mr.ondataavailable = e => { if (e.data && e.data.size) chunksRef.current.push(e.data); };
      mr.onstop = async () => {
        const blob = new Blob(chunksRef.current, { type: mr.mimeType || "audio/webm" });
        stream.getTracks().forEach(t => t.stop());
        try {
          const fd = new FormData();
          fd.append("audio", blob, "take.webm");
          const up = await fetch("/api/audio", { method: "POST", body: fd });
          const upJson = await up.json();

          let score = null, recognized = null, detail = null, words = null, assessError = null, assessDebug = null;
          try {
            const fd2 = new FormData();
            fd2.append("audio", blob, "take.webm");
            fd2.append("text", text);
            const as = await fetch("/api/assess", { method: "POST", body: fd2 });
            if (as.ok) {
              const d = await as.json();
              recognized = d.recognizedText || null;
              score = d.pronScore != null ? Math.round(d.pronScore) : null;
              words = d.words || null;
              detail = {
                accuracy: d.accuracyScore != null ? Math.round(d.accuracyScore) : null,
                fluency: d.fluencyScore != null ? Math.round(d.fluencyScore) : null,
                completeness: d.completenessScore != null ? Math.round(d.completenessScore) : null,
              };
              if (score == null) {
                assessError = d.note || "인식되지 않았어요. 다시 녹음해볼까요?";
                assessDebug = [
                  d.status ? `상태 ${d.status}` : null,
                  d.audio ? `길이 ${(d.audio.durationMs/1000).toFixed(1)}초` : null,
                  d.audio && d.audio.dBFS != null ? `음량 ${d.audio.dBFS}dB` : null,
                  d.recognizedText ? `들린 내용 "${d.recognizedText}"` : null,
                ].filter(Boolean).join(" · ");
              }
            } else {
              let m = `발음평가 오류 (${as.status})`;
              try { const j = await as.json(); if (j.detail) m = j.detail; } catch (e) {}
              assessError = m;
            }
          } catch (e) {
            assessError = "발음평가 서버에 연결하지 못했어요.";
          }

          onSaved(index, round, { audio: upJson.url, recognized, score, detail, words, assessError, assessDebug });
        } catch (e) {
          setErr("업로드에 실패했어요. 인터넷 연결을 확인해주세요.");
        }
        setBusy(false);
      };
      mr.start();
      setRec(true);
    } catch (e) {
      setErr("마이크 접근이 거부되었어요. 주소창 왼쪽 자물쇠 아이콘에서 마이크를 허용해주세요.");
    }
  };

  const stop = () => {
    if (mrRef.current && rec) { setBusy(true); mrRef.current.stop(); setRec(false); }
  };

  return (
    <div className="card" style={ take ? { borderLeft:"4px solid var(--gold)" } : {} }>
      <div style={{ display:"flex", justifyContent:"space-between", gap:10 }}>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontSize:11, fontWeight:700, color:"var(--gold)" }}>
            {index+1}{take ? " · 완료" : ""}
          </div>
          <div style={{ fontSize:20, fontWeight:600, wordBreak:"break-word", lineHeight:1.4 }}>{text}</div>
          {meaning && (
            <div style={{ fontSize:15, color:"var(--navy-soft)", marginTop:4, fontWeight:500 }}>{meaning}</div>
          )}
        </div>
        <div style={{ display:"flex", flexDirection:"column", gap:6, flexShrink:0 }}>
          <button onClick={()=>speak(text, voice, 0.7)}
            style={{ background:"var(--cream-deep)", color:"var(--navy)", borderRadius:9, padding:"8px 12px", fontSize:13, fontWeight:600, whiteSpace:"nowrap" }}>
            🔊 듣기
          </button>
          <button onClick={()=>speak(text, voice, 0.45)}
            style={{ background:"#fff", color:"var(--navy)", border:"1px solid var(--line)", borderRadius:9, padding:"7px 12px", fontSize:12, whiteSpace:"nowrap" }}>
            🐢 천천히
          </button>
        </div>
      </div>

      <div className="row" style={{ marginTop:12 }}>
        {!rec ? (
          <button className={take ? "btn-ghost" : "btn"} onClick={start} disabled={busy}>
            🎤 {busy ? "처리 중..." : take ? "다시 녹음" : "녹음 시작"}
          </button>
        ) : (
          <button className="btn-danger" onClick={stop}>■ 녹음 중지</button>
        )}
        {take && <audio controls src={take.audio} />}
      </div>

      {take && take.score != null && (
        <div style={{ marginTop:12, background:"var(--cream)", borderRadius:10, padding:12 }}>
          <div style={{ display:"flex", alignItems:"center", gap:14 }}>
            <div style={{ textAlign:"center", minWidth:70 }}>
              <div style={{ fontSize:30, fontWeight:800, lineHeight:1,
                color: take.score>=85 ? "#2E7D5B" : take.score>=60 ? "#8A6D0F" : "var(--danger)" }}>
                {take.score}
              </div>
              <div style={{ fontSize:10, color:"var(--navy-soft)", marginTop:2 }}>종합 점수</div>
            </div>
            {take.detail && (
              <div style={{ flex:1, display:"flex", gap:6 }}>
                {[["정확도",take.detail.accuracy],["유창성",take.detail.fluency],["완성도",take.detail.completeness]].map(([l,v])=>(
                  <div key={l} style={{ flex:1, textAlign:"center" }}>
                    <div style={{ fontSize:16, fontWeight:700, color:"var(--navy)" }}>{v != null ? v : "-"}</div>
                    <div style={{ fontSize:10, color:"var(--navy-soft)" }}>{l}</div>
                    <div style={{ height:4, background:"#E3DCC8", borderRadius:2, marginTop:3, overflow:"hidden" }}>
                      <div style={{ width:`${v||0}%`, height:"100%", background:"var(--gold)" }} />
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
          {take.recognized && (
            <div className="muted" style={{ marginTop:8 }}>이렇게 들렸어요: "{take.recognized}"</div>
          )}
        </div>
      )}
      {take && take.score == null && take.assessError && (
        <div style={{ marginTop:10, fontSize:12, color:"var(--danger)" }}>⚠ {take.assessError}</div>
      )}
      {err && <div className="err">{err}</div>}
    </div>
  );
}

// ---------- Student ----------
function StudentView({ student, onLogout }) {
  const voice = useVoice();
  const [assignments, setAssignments] = useState([]);
  const [statusMap, setStatusMap] = useState({});
  const [open, setOpen] = useState(null);
  const [sub, setSub] = useState(null);
  const [round, setRound] = useState(0);
  const [loading, setLoading] = useState(true);
  const [msg, setMsg] = useState("");
  const [saveMsg, setSaveMsg] = useState("");
  const [done, setDone] = useState(false);

  const mine = assignments.filter(a =>
    (!a.assignedIds || !a.assignedIds.length) || a.assignedIds.includes(student.id));

  useEffect(() => {
    (async () => {
      const list = await apiGet("/assignments");
      setAssignments(list);
      const map = {};
      for (const a of list) {
        try {
          const s = await apiGet(`/submission/${a.id}/${student.id}`);
          map[a.id] = s && s.status ? s.status : "none";
        } catch (e) { map[a.id] = "none"; }
      }
      setStatusMap(map);
      setLoading(false);
    })();
  }, []);

  const openA = async (a) => {
    setOpen(a);
    const s = await apiGet(`/submission/${a.id}/${student.id}`);
    const items = a.items.map((_, i) => normalizeTakes((s.items || [])[i]));
    setSub({ items, comment: s.comment || "", status: s.status || "none" });
    const n = a.rounds || 3;
    let r = 0;
    for (let k = 0; k < n; k++) {
      if (items.every(it => it[k])) r = Math.min(k + 1, n - 1); else { r = k; break; }
    }
    setRound(r);
  };

  const onSaved = (idx, take, val) => {
    setSub(prev => {
      const items = prev.items.map(x => x.slice());
      items[idx][take] = val;
      const next = { ...prev, items };
      // 녹음할 때마다 서버에 바로 저장 (제출 전이라도 유실되지 않도록)
      apiPost(`/submission/${open.id}/${student.id}`, { items })
        .then(() => setSaveMsg("자동 저장됨"))
        .catch(() => setSaveMsg("자동 저장 실패 — 인터넷 연결을 확인해주세요"));
      setTimeout(()=>setSaveMsg(""), 2500);
      return next;
    });
  };

  const submit = async () => {
    const parts = [];
    for (let r = 0; r < (open.rounds || 3); r++) {
      const miss = sub.items.filter(it => !it[r]).length;
      if (miss) parts.push(`${r+1}회차 ${miss}개`);
    }
    if (parts.length && !confirm(`아직 녹음하지 않은 항목이 있어요 (${parts.join(", ")}). 그래도 제출할까요?`)) return;
    setMsg("제출 중...");
    try {
      await apiPost(`/submission/${open.id}/${student.id}`,
        { items: sub.items, status: "submitted", submittedAt: nowStr() });
      setStatusMap(m => ({ ...m, [open.id]: "submitted" }));
      setMsg("");
      setDone(true);
    } catch (e) { setMsg("제출 실패: " + e.message); }
  };

  if (loading) return <div className="cente…16837 tokens truncated…
      const r = await apiGet(`/report/${sid}?start=${start}&end=${end}`);
      setRep(r); setNote(r.summary);
    } catch (e) { setMsg("불러오기 실패: " + e.message); }
    setBusy(false);
  };

  const saveImage = async () => {
    if (!sheetRef.current) return;
    setMsg("이미지 만드는 중...");
    try {
      const canvas = await html2canvas(sheetRef.current, {
        backgroundColor: "#ffffff", scale: 2, useCORS: true,
      });
      const link = document.createElement("a");
      link.download = `${rep.student.name}_성적표_${rep.period.start}~${rep.period.end}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
      setMsg("저장했어요!");
      setTimeout(()=>setMsg(""), 2000);
    } catch (e) { setMsg("이미지 저장 실패: " + e.message); }
  };


  return (
    <div className="body">
      <div className="card">
        <label className="label">학생</label>
        <select className="field" value={sid} onChange={e=>setSid(e.target.value)}>
          {students.map(s => <option key={s.id} value={s.id}>{s.name}{s.className?` (${s.className})`:""}</option>)}
        </select>
        <div style={{height:10}} />
        <div className="row" style={{ gap:8 }}>
          <div style={{ flex:1, minWidth:130 }}>
            <label className="label">시작일</label>
            <input className="field" type="date" value={start} onChange={e=>setStart(e.target.value)} />
          </div>
          <div style={{ flex:1, minWidth:130 }}>
            <label className="label">종료일</label>
            <input className="field" type="date" value={end} onChange={e=>setEnd(e.target.value)} />
          </div>
        </div>
        <div style={{height:14}} />
        <div className="row">
          <button className="btn" onClick={load} disabled={busy || !sid}>
            {busy ? "불러오는 중..." : "성적표 만들기"}
          </button>
          {rep && <button className="btn-ghost" onClick={saveImage}>🖼 이미지로 저장</button>}
        </div>
        {msg && <div style={{ marginTop:8, fontSize:12, fontWeight:700, color:"var(--navy)" }}>{msg}</div>}
      </div>

      {rep && (
        <>
          <div className="card">
            <label className="label">총평 (수정하면 성적표에 반영돼요)</label>
            <textarea className="field" rows={4} value={note} onChange={e=>setNote(e.target.value)} />
          </div>

          <div ref={sheetRef} style={{ background:"#fff", padding:24, borderRadius:14 }}>
            <div style={{ borderBottom:`3px solid var(--navy)`, paddingBottom:12, marginBottom:16 }}>
              <div style={{ fontSize:12, color:"var(--gold)", fontWeight:800, letterSpacing:1 }}>HAPPYTREE ACADEMY</div>
              <div style={{ fontSize:22, fontWeight:800, color:"var(--navy)", marginTop:2 }}>낭독 학습 성적표</div>
              <div style={{ fontSize:13, color:"var(--navy-soft)", marginTop:6 }}>
                {rep.student.name} {rep.student.className ? `· ${rep.student.className}` : ""} &nbsp;|&nbsp; {rep.period.start} ~ {rep.period.end}
              </div>
            </div>

            <div style={{ display:"flex", gap:10, marginBottom:10 }}>
              {[
                ["종합 발음", rep.overallAverage != null ? `${rep.overallAverage}점` : "-"],
                ["제출률", `${rep.submitRate}%`],
                ["완료 과제", `${rep.submittedCount} / ${rep.totalAssigned}`],
              ].map(([l,v]) => (
                <div key={l} style={{ flex:1, background:"var(--navy)", borderRadius:10, padding:"12px 8px", textAlign:"center" }}>
                  <div style={{ fontSize:11, color:"var(--gold-soft)", fontWeight:600 }}>{l}</div>
                  <div style={{ fontSize:20, fontWeight:800, color:"#fff", marginTop:4 }}>{v}</div>
                </div>
              ))}
            </div>

            <div style={{ display:"flex", gap:10, marginBottom:18 }}>
              {[
                ["정확도", rep.metrics?.accuracy, "소리를 얼마나 정확히 냈는지"],
                ["유창성", rep.metrics?.fluency, "끊김 없이 자연스럽게 읽는지"],
                ["완성도", rep.metrics?.completeness, "문장을 빠짐없이 읽었는지"],
              ].map(([l,v,desc]) => (
                <div key={l} style={{ flex:1, background:"var(--cream)", borderRadius:10, padding:"10px 8px", textAlign:"center" }}>
                  <div style={{ fontSize:11, color:"var(--navy-soft)", fontWeight:700 }}>{l}</div>
                  <div style={{ fontSize:18, fontWeight:800, color:"var(--navy)", margin:"3px 0" }}>{v != null ? v : "-"}</div>
                  <div style={{ fontSize:9, color:"var(--navy-soft)", lineHeight:1.3 }}>{desc}</div>
                </div>
              ))}
            </div>

            {rep.daily.length > 0 && (
              <div style={{ marginBottom:18 }}>
                <div style={{ fontSize:13, fontWeight:800, color:"var(--navy)", marginBottom:4 }}>일자별 학습 추이</div>
                <div className="row" style={{ gap:12, marginBottom:8 }}>
                  {[["종합 발음","#1B2E4C"],["정확도","#C9A227"],["유창성(억양)","#5B8C7B"],["성실도(제출률)","#B3432F"]].map(([l,c]) => (
                    <span key={l} style={{ fontSize:11, color:"var(--navy-soft)", display:"inline-flex", alignItems:"center", gap:4 }}>
                      <span style={{ width:14, height:3, background:c, borderRadius:2, display:"inline-block" }} />{l}
                    </span>
                  ))}
                </div>
                <LineChart data={rep.daily} />
              </div>
            )}

            <div style={{ marginBottom:18 }}>
              <div style={{ fontSize:13, fontWeight:800, color:"var(--navy)", marginBottom:8 }}>과제별 기록</div>
              <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}>
                <thead>
                  <tr style={{ background:"var(--cream)" }}>
                    {["과제","유형","마감","제출","평균"].map(h => (
                      <th key={h} style={{ padding:"7px 6px", textAlign:"left", color:"var(--navy-soft)", fontWeight:700 }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {rep.assignments.map((r,i) => (
                    <tr key={i} style={{ borderBottom:"1px solid var(--line)" }}>
                      <td style={{ padding:"7px 6px", fontWeight:600 }}>{r.title}</td>
                      <td style={{ padding:"7px 6px" }}>{r.type==="word"?"단어":"문장"} {r.itemCount}개</td>
                      <td style={{ padding:"7px 6px", color:"var(--navy-soft)" }}>{r.dueDate ? formatDue(r.dueDate) : "-"}</td>
                      <td style={{ padding:"7px 6px", color: r.status==="none" ? "var(--danger)" : "var(--navy)" }}>
                        {r.status==="none" ? "미제출" : "제출"}
                      </td>
                      <td style={{ padding:"7px 6px", fontWeight:700 }}>{r.average != null ? `${r.average}점` : "-"}</td>
                    </tr>
                  ))}
                  {!rep.assignments.length && (
                    <tr><td colSpan={5} style={{ padding:14, textAlign:"center", color:"var(--navy-soft)" }}>해당 기간에 과제가 없어요.</td></tr>
                  )}
                </tbody>
              </table>
            </div>

            {rep.weakWords.length > 0 && (
              <div style={{ marginBottom:18 }}>
                <div style={{ fontSize:13, fontWeight:800, color:"var(--navy)", marginBottom:8 }}>더 연습하면 좋은 단어</div>
                <div className="row">
                  {rep.weakWords.map(w => (
                    <span key={w.word} style={{
                      padding:"5px 11px", borderRadius:999, fontSize:12, fontWeight:600,
                      background:"#F3E4B8", color:"#8A6D0F"
                    }}>{w.word} <span style={{opacity:.7}}>{Math.round(w.accuracy)}</span></span>
                  ))}
                </div>
              </div>
            )}

            <div style={{ background:"var(--cream)", borderLeft:"4px solid var(--gold)", padding:"12px 14px", borderRadius:8 }}>
              <div style={{ fontSize:12, fontWeight:800, color:"var(--navy)", marginBottom:5 }}>선생님 총평</div>
              <div style={{ fontSize:13, lineHeight:1.7, whiteSpace:"pre-wrap" }}>{note}</div>
            </div>

            <div style={{ textAlign:"center", fontSize:11, color:"var(--navy-soft)", marginTop:16 }}>
              해피트리학원 · 남천동 국영수 문해력센터
            </div>
          </div>
        </>
      )}
    </div>
  );
}

// ---------- Admin: settings ----------
function AdminSettings({ students, assignments, reload }) {
  const [msg, setMsg] = useState("");
  const [diag, setDiag] = useState(null);
  const [diagBusy, setDiagBusy] = useState(false);
  const [testText, setTestText] = useState("I like apple.");
  const [testRec, setTestRec] = useState(false);
  const [testResult, setTestResult] = useState(null);
  const [testBusy, setTestBusy] = useState(false);
  const tmr = useRef(null); const tchunks = useRef([]);

  const runDiag = async () => {
    setDiagBusy(true); setDiag(null);
    try {
      const r = await apiGet("/diag");
      setDiag(r);
    } catch (e) { setDiag({ azure_message: "진단 실패: " + e.message }); }
    setDiagBusy(false);
  };

  const startTest = async () => {
    setTestResult(null);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      tchunks.current = [];
      const mr = new MediaRecorder(stream);
      tmr.current = mr;
      mr.ondataavailable = e => { if (e.data && e.data.size) tchunks.current.push(e.data); };
      mr.onstop = async () => {
        const blob = new Blob(tchunks.current, { type: mr.mimeType || "audio/webm" });
        stream.getTracks().forEach(t=>t.stop());
        setTestBusy(true);
        try {
          const fd = new FormData();
          fd.append("audio", blob, "test.webm");
          fd.append("text", testText);
          fd.append("debug", "1");
          const res = await fetch("/api/assess", { method:"POST", body: fd });
          const j = await res.json();
          setTestResult({ ok: res.ok, mime: mr.mimeType, size: blob.size, data: j });
        } catch (e) { setTestResult({ ok:false, data:{ detail: e.message } }); }
        setTestBusy(false);
      };
      mr.start();
      setTestRec(true);
    } catch (e) { setTestResult({ ok:false, data:{ detail:"마이크 접근 실패: " + e.message } }); }
  };
  const stopTest = () => { if (tmr.current && testRec) { tmr.current.stop(); setTestRec(false); } };

  const backup = async () => {
    const data = await apiGet("/backup");
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const d = new Date();
    a.href = url;
    a.download = `happytree-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const restore = async (file) => {
    setMsg("");
    try {
      const data = JSON.parse(await file.text());
      if (!confirm("현재 학생·과제 목록을 백업 파일 내용으로 덮어씁니다. 계속할까요?")) return;
      await apiPost("/restore", data);
      await reload();
      setMsg("복원됐어요.");
    } catch (e) { setMsg("복원 실패: " + e.message); }
  };

  return (
    <div className="body">
      <div className="card">
        <div style={{ fontWeight:700, color:"var(--navy)", marginBottom:6 }}>발음평가 진단</div>
        <div className="muted" style={{ marginBottom:12 }}>
          점수가 안 나올 때 여기서 원인을 확인할 수 있어요.
        </div>
        <button className="btn" onClick={runDiag} disabled={diagBusy}>
          {diagBusy ? "확인 중..." : "발음평가 상태 확인"}
        </button>
        {diag && (
          <div style={{ marginTop:12, background:"var(--cream)", borderRadius:8, padding:12, fontSize:13 }}>
            <div style={{ marginBottom:4 }}>Azure 키: <b>{diag.azure_key_set ? "설정됨" : "없음"}</b></div>
            <div style={{ marginBottom:4 }}>지역: <b>{diag.azure_region}</b></div>
            <div style={{ marginBottom:4 }}>ffmpeg: <b>{diag.ffmpeg}</b></div>
            {diag.azure_status != null && <div style={{ marginBottom:4 }}>Azure 응답코드: <b>{diag.azure_status}</b></div>}
            <div style={{ marginTop:8, fontWeight:700,
              color: diag.azure_status === 200 ? "#2E7D5B" : "var(--danger)" }}>
              {diag.azure_message}
            </div>
          </div>
        )}
      </div>

      <div className="card">
        <div style={{ fontWeight:700, color:"var(--navy)", marginBottom:6 }}>녹음 테스트 (원인 찾기)</div>
        <div className="muted" style={{ marginBottom:10 }}>
          직접 녹음해서 Azure가 실제로 뭐라고 응답하는지 그대로 확인할 수 있어요.
        </div>
        <label className="label">읽을 문장</label>
        <input className="field" value={testText} onChange={e=>setTestText(e.target.value)} />
        <div style={{height:12}} />
        {!testRec ? (
          <button className="btn" onClick={startTest} disabled={testBusy}>
            {testBusy ? "분석 중..." : "🎤 테스트 녹음 시작"}
          </button>
        ) : (
          <button className="btn-danger" onClick={stopTest}>■ 중지하고 분석</button>
        )}
        {testResult && (
          <div style={{ marginTop:12, background:"var(--cream)", borderRadius:8, padding:12, fontSize:12 }}>
            {testResult.data.pronScore != null ? (
              <div style={{ fontWeight:800, color:"#2E7D5B", fontSize:15, marginBottom:8 }}>
                ✅ 성공! 종합 {Math.round(testResult.data.pronScore)}점
                (정확도 {Math.round(testResult.data.accuracyScore)} ·
                 유창성 {Math.round(testResult.data.fluencyScore)} ·
                 완성도 {Math.round(testResult.data.completenessScore)})
              </div>
            ) : (
              <div style={{ fontWeight:800, color:"var(--danger)", marginBottom:8 }}>
                ❌ {testResult.data.note || testResult.data.detail || "실패"}
              </div>
            )}
            <div style={{ lineHeight:1.7 }}>
              <div>브라우저 형식: <b>{testResult.mime || "-"}</b> ({testResult.size} bytes)</div>
              {testResult.data.audio && (
                <>
                  <div>디코더: <b>{testResult.data.audio.decoder}</b></div>
                  <div>길이: <b>{(testResult.data.audio.durationMs/1000).toFixed(1)}초</b> ·
                       음량: <b>{testResult.data.audio.dBFS ?? "무음"}dB</b></div>
                  <div>변환된 WAV: <b>{testResult.data.audio.wavBytes} bytes</b></div>
                </>
              )}
              {testResult.data.status && <div>Azure 상태: <b>{testResult.data.status}</b></div>}
              {testResult.data.recognizedText != null &&
                <div>들린 내용: <b>"{testResult.data.recognizedText || "(없음)"}"</b></div>}
            </div>
            {testResult.data.raw && (
              <details style={{ marginTop:8 }}>
                <summary style={{ cursor:"pointer", color:"var(--navy-soft)" }}>Azure 원본 응답</summary>
                <div style={{ marginTop:6, fontSize:10, wordBreak:"break-all", fontFamily:"monospace" }}>
                  {testResult.data.raw}
                </div>
              </details>
            )}
          </div>
        )}
      </div>

      <div className="card">
        <div style={{ fontWeight:700, color:"var(--navy)", marginBottom:6 }}>데이터 백업 / 복원</div>
        <div className="muted" style={{ marginBottom:12 }}>
          학생 명단·과제·제출 기록을 파일로 내려받아 보관할 수 있어요. 정기적으로 한 번씩 받아두시면 안전해요.
        </div>
        <div className="row">
          <button className="btn" onClick={backup}>백업 파일 내려받기</button>
          <label className="btn-ghost">
            백업에서 복원
            <input type="file" accept=".json" style={{display:"none"}}
              onChange={e=>{ const f=e.target.files[0]; if(f) restore(f); e.target.value=""; }} />
          </label>
        </div>
        <div className="muted" style={{ marginTop:10 }}>현재 학생 {students.length}명 · 과제 {assignments.length}개</div>
        {msg && <div style={{ marginTop:8, fontSize:12, fontWeight:700, color:"var(--navy)" }}>{msg}</div>}
      </div>
      <div className="card">
        <div style={{ fontWeight:700, color:"var(--navy)", marginBottom:6 }}>학생 접속 주소</div>
        <div className="muted">학생들에게 이 페이지 주소를 그대로 알려주세요. 각자 발급받은 아이디로 로그인하면 됩니다.</div>
        <div style={{ marginTop:8, padding:10, background:"var(--cream-deep)", borderRadius:8, fontSize:13, wordBreak:"break-all" }}>
          {window.location.origin}
        </div>
      </div>
    </div>
  );
}

// ---------- Admin shell ----------
function AdminView({ onLogout }) {
  const [tab, setTab] = useState("students");
  const [students, setStudents] = useState([]);
  const [assignments, setAssignments] = useState([]);
  const [loading, setLoading] = useState(true);
  const voice = useVoice();

  const reload = async () => {
    const [s, a] = await Promise.all([apiGet("/students"), apiGet("/assignments")]);
    setStudents(s); setAssignments(a);
  };
  useEffect(() => { reload().finally(()=>setLoading(false)); }, []);

  if (loading) return <div className="center"><div className="spin" /></div>;

  return (
    <div className="wrap">
      <div className="hdr">
        <h1>해피트리 관리자</h1>
        <button onClick={onLogout} style={{ background:"none", color:"var(--cream)", fontSize:13 }}>로그아웃</button>
      </div>
      <div className="tabs">
        {[["students","학생관리"],["assignments","과제관리"],["review","제출확인"],["report","성적표"],["settings","설정"]].map(([id,l]) => (
          <button key={id} className={"tab" + (tab===id?" on":"")} onClick={()=>setTab(id)}>{l}</button>
        ))}
      </div>
      {tab==="students" && <AdminStudents students={students} reload={reload} />}
      {tab==="assignments" && <AdminAssignments students={students} assignments={assignments} reload={reload} voice={voice} />}
      {tab==="review" && <AdminReview students={students} assignments={assignments} />}
      {tab==="report" && <AdminReport students={students} />}
      {tab==="settings" && <AdminSettings students={students} assignments={assignments} reload={reload} />}
    </div>
  );
}

// ---------- Root ----------
function App() {
  const [role, setRole] = useState(null);
  const [student, setStudent] = useState(null);

  if (!role) return <Login onStudent={s=>{setStudent(s); setRole("student");}} onAdmin={()=>setRole("admin")} />;
  if (role === "student") return <StudentView student={student} onLogout={()=>{setRole(null); setStudent(null);}} />;
  return <AdminView onLogout={()=>setRole(null)} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
