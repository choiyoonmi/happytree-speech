<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>트리톡 파닉스 · 10개월 과정</title>
<link rel="icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@700&family=Jua&display=swap" rel="stylesheet">
<style>
/* 트리톡 파닉스 LV1 10개월 과정 지도 — 수학숨 k7.html 과 같은 틀(오늘의 학습 + 달별 카드).
   원장 커리큘럼 2026-10-30: 1달 알파벳 / 2달 단모음 / 3-4달 장모음+사이트워즈 / 5-6달 이중자음 / 7-8달 이중모음 / 9-10달 총복습+사이트워즈 마무리.
   유치부 주2회·초등부 주4회 — 칸마다 ○ 는 그 Day 를 몇 번 도는지(배정 반복 횟수). */
:root{ --navy:#1f3a5f; --gold:#f2a900; --cream:#fff8e7; --ink:#263238; --mut:#8a7d60; --line:#eadfc6; --leaf:#43a047; }
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Jua','Malgun Gothic',sans-serif}
.en{font-family:'Andika',Arial,sans-serif}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px}
.top .logo{width:36px;height:36px;border-radius:10px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.top b{font-size:18px;color:var(--navy)} .top small{display:block;font-size:13px;color:var(--mut);font-family:'Malgun Gothic',sans-serif}
.top button{margin-left:auto;background:#fff;border:0;border-radius:10px;padding:8px 12px;font:inherit;color:var(--navy);box-shadow:0 3px 0 var(--line);cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 40px}
.box{background:#fff;border-radius:22px;padding:16px;box-shadow:0 4px 0 var(--line);margin-bottom:16px}
.today-h{display:flex;justify-content:space-between;align-items:center;font-size:18px;color:var(--navy)}
.today-h small{color:var(--mut);font-size:14px}
.bar{height:10px;background:#f1e8d2;border-radius:5px;overflow:hidden;margin:10px 0 14px} .bar i{display:block;height:100%;background:var(--gold);width:0}
.today{background:#fff6d8;border-radius:18px;padding:18px;text-align:center}
.today .e{font-size:48px} .today .t{font-size:22px;color:var(--navy);margin:4px 0} .today .s{color:var(--mut);font-size:15px}
.go{display:inline-block;margin-top:10px;background:var(--leaf);color:#fff;border:0;border-radius:999px;padding:10px 26px;font:inherit;font-size:18px;cursor:pointer;text-decoration:none}
.seg{display:flex;gap:6px;justify-content:center;margin:4px 0 14px}
.seg button{border:0;border-radius:999px;padding:8px 18px;font:inherit;font-size:16px;background:#fff;color:var(--navy);box-shadow:0 3px 0 var(--line);cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
h2{font-size:22px;color:var(--navy);text-align:center;margin:18px 0 12px}
.month h3{margin:0 0 10px;font-size:17px;color:var(--navy)} .month h3 small{color:var(--mut);font-size:14px;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{display:flex;gap:10px;align-items:center;background:#fffdf7;border:2px solid #f1e8d2;border-radius:16px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;text-decoration:none}
.card.now{border-color:#7e57c2;box-shadow:0 0 0 3px #ede4fb}
.card.sight{background:#f3f8ff;border-color:#dbe8fb}
.card.exam{background:#fff3c4;border-color:#f2d46b}
.card .e{font-size:30px;flex:none;width:40px;text-align:center}
.card .t{font-size:15px;color:var(--navy);line-height:1.3}
.card .t .en{font-size:15px}
.card .dots{font-size:14px;color:#c9bfa6;letter-spacing:2px;margin-top:3px}
.card .dots b{color:var(--gold)}
.note{color:var(--mut);font-size:14px;text-align:center;line-height:1.6;font-family:'Malgun Gothic',sans-serif}
@media (max-width:520px){ .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="top"><div class="logo">🌳</div><div><b>트리톡 파닉스 · LV1</b><small id="who">로그인하지 않아 시연으로 열려요</small></div>
  <button id="back" style="display:none">↩ 트리톡</button></div>
<div class="wrap" id="root"><p class="note">불러오는 중…</p></div>
<script>
'use strict';
const QS = new URLSearchParams(location.search), SID = QS.get('sid')||'', SNAME = QS.get('name')||'';
const store = { get(k,d){ try{ return localStorage.getItem(k) ?? d }catch(e){ return d } }, set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} } };
let TRACK = store.get('ht_ph_track', 'k');   // k = 유치부 주2, e = 초등부 주4
// 한 Day 를 몇 번 도는지(관리자 배정의 'Day를 며칠씩 반복'). 원장 일정에 맞춘 값(2026-10-30 정리).
const REP = { k:{1:1, 2:1, 3:3, 4:2, 5:3, 6:2, s:1}, e:{1:2, 2:3, 3:6, 4:4, 5:6, 6:4, s:1} };
const E = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

(async function(){
  const C = await (await fetch('/api/phonics/content')).json();
  const BOOKS = {1:{book:C.book, name:'알파벳'}, 2:C.short, 3:C.long, 4:C.cons, 5:C.diph, 6:C.rev, s:C.sight};
  // 학생 기록: 이 학생이 받은 파닉스 과제(책·Day) → 끝낸 횟수, 그리고 아직 안 끝낸 과제(누르면 그걸 연다)
  const done = {}, open = {};
  if(SID){
    try{
      const [list, subs] = await Promise.all([
        fetch('/api/assignments?student='+encodeURIComponent(SID)).then(r=>r.json()),
        fetch('/api/student-submissions/'+encodeURIComponent(SID)).then(r=>r.json())]);
      list.filter(a=>/^LV1 (\d권|사이트워즈)$/.test(a.book||'')).forEach(a=>{
        const bk = a.book==='LV1 사이트워즈' ? 's' : a.book.match(/(\d)권/)[1];   // 'LV1' 의 1 이 아니라 'n권' 의 n
        const day = a.type==='exam' ? 'exam' : +(((a.title||'').match(/Day\s*0*(\d+)/)||[])[1]||0);
        const k = bk+'|'+day, st = (subs[a.id]||{}).status;
        if(st==='submitted'||st==='reviewed') done[k] = (done[k]||0)+1;
        else if(!open[k] || (a.dueDate||'') < (open[k].dueDate||'')) open[k] = a;
      });
      document.getElementById('who').textContent = (SNAME||SID)+' 학생의 기록이에요';
    }catch(e){}
    if(window.parent!==window){ const b=document.getElementById('back'); b.style.display=''; b.onclick=()=>window.parent.postMessage('phonics-close', location.origin) }
  }

  // 칸 하나 = 책의 Day 하나
  const dayLabel = (bk, d) => bk==1 ? d.letters.map(x=>x.toUpperCase()).join(' · ')
    : bk==='s' ? d.words.map(w=>w[0]).join(' · ')
    : bk==6 ? d.kind : bk==2 ? `짧은 ${d.vowel}` : bk==3 ? `긴 ${d.vowel}` : d.families.map(f=>f.name).join(' · ');
  const dayEmoji = (bk, d) => bk==1 ? C.letters[d.letters[0]].words[0][2] : bk==='s' ? '👀' : (d.families[0].words[0][2]);
  const daysOf = bk => bk==1 ? C.days : BOOKS[bk].days;
  const cell = (bk, d) => ({bk, day:d.day, key:bk+'|'+d.day, e:dayEmoji(bk,d), t:`${bk==='s'?'사이트워즈 '+d.day+'세트':'Day '+d.day} · ${dayLabel(bk,d)}`, rep:REP[TRACK][bk]});
  const exam = (bk, t) => ({bk, day:'exam', key:bk+'|exam', e:bk==='s'?'🏅':bk==6?'🎓':'🎯', t, rep:1, exam:true});
  const sightRange = (a,b) => C.sight.days.filter(d=>d.day>=a && d.day<=b).map(d=>Object.assign(cell('s',d),{sight:true}));
  const PLAN = [
    {m:'1달', title:'알파벳', cells:[...C.days.map(d=>cell(1,d)), exam(1,'알파벳 진급시험')]},
    {m:'2달', title:'단모음', cells:[...C.short.days.map(d=>cell(2,d)), exam(2,'단모음 진급시험')]},
    {m:'3~4달', title:'장모음 · 사이트워즈 시작', cells:[...C.long.days.map(d=>cell(3,d)), exam(3,'장모음 진급시험'), ...sightRange(1,8)]},
    {m:'5~6달', title:'이중자음', cells:[...C.cons.days.map(d=>cell(4,d)), exam(4,'이중자음 진급시험'), ...sightRange(9,16)]},
    {m:'7~8달', title:'이중모음', cells:[...C.diph.days.map(d=>cell(5,d)), exam(5,'이중모음 진급시험'), ...sightRange(17,23)]},
    {m:'9~10달', title:'총복습 · 사이트워즈 마무리', cells:[...C.rev.days.map(d=>cell(6,d)), exam(6,'LV1 파닉스 졸업 시험'), exam('s','사이트워즈 마무리 시험')]},
  ];
  const all = PLAN.flatMap(p=>p.cells), total = all.reduce((n,c)=>n+c.rep,0);
  const got = c => Math.min(done[c.key]||0, c.rep);
  const finished = all.reduce((n,c)=>n+got(c),0);
  const next = all.find(c=>got(c) < c.rep) || all[all.length-1];
  const href = c => open[c.key] ? `/phonics.html?aid=${encodeURIComponent(open[c.key].id)}&sid=${encodeURIComponent(SID)}&name=${encodeURIComponent(SNAME)}`
    : c.exam ? null : `/phonics.html?book=${c.bk}&day=${c.day}`;
  const dots = c => c.exam ? (got(c) ? '<b>🏆</b>' : '🏆') : '<b>'+'●'.repeat(got(c))+'</b>'+'○'.repeat(c.rep-got(c));

  document.getElementById('root').innerHTML = `
    <div class="box">
      <div class="today-h">📅 오늘의 학습 <small>10달 과정 ${finished} / ${total}회</small></div>
      <div class="bar"><i style="width:${Math.round(finished/total*100)}%"></i></div>
      <div class="today"><div class="s">오늘의 학습</div><div class="e">${next.e}</div>
        <div class="t ${next.bk==='s'?'en':''}">${E(next.t)}</div>
        <div class="s">${E(PLAN.find(p=>p.cells.includes(next)).m)} · ${E(PLAN.find(p=>p.cells.includes(next)).title)}</div>
        ${href(next) ? `<a class="go" href="${href(next)}">시작하기 ▶</a>` : '<div class="s" style="margin-top:8px">선생님이 시험을 열어 주면 시작해요</div>'}</div>
    </div>
    <div class="seg"><button data-t="k" class="${TRACK==='k'?'on':''}">유치부 (주 2회)</button><button data-t="e" class="${TRACK==='e'?'on':''}">초등부 (주 4회)</button></div>
    <h2>🌱 트리톡 파닉스 10개월 과정</h2>
    ${PLAN.map(p=>`<div class="box month"><h3>${E(p.m)} · ${E(p.title)} <small>${p.cells.reduce((n,c)=>n+got(c),0)} / ${p.cells.reduce((n,c)=>n+c.rep,0)}회</small></h3>
      <div class="grid">${p.cells.map(c=>{ const h = href(c); const cls = `card ${c===next?'now':''} ${c.sight?'sight':''} ${c.exam?'exam':''}`;
        const inner = `<div class="e">${c.e}</div><div><div class="t">${E(c.t).replace(/([A-Za-z][A-Za-z_ ·'-]*)/g,'<span class="en">$1</span>')}</div><div class="dots">${dots(c)}</div></div>`;
        return h ? `<a class="${cls}" href="${h}">${inner}</a>` : `<div class="${cls}">${inner}</div>` }).join('')}</div></div>`).join('')}
    <p class="note">칸마다 ○ 는 그 날을 몇 번 하는지예요(유치부·초등부에 따라 달라요). 다 하면 ●로 바뀌어요.<br>
      🎯 진급시험은 그 책 마지막 날을 끝내면 저절로 열려요. 🔊 와 글자를 누르면 읽어 줘요.</p>`;
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ store.set('ht_ph_track', b.dataset.t); location.reload() });
})();
</script>
</body>
</html>
